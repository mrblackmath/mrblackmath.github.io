<style>

/* MR BLACK NBK — DESIGN SYSTEM (kế thừa từ bài giảng Mr Black trước):
   sân khấu cố định 1920×1080 co giãn vừa màn hình · nền xanh đêm + ánh vàng thương hiệu · Chakra Petch · KaTeX nhúng sẵn.
   Bản bài giảng: topbar (thương hiệu – tên phần – thanh 6 pha của dạng toán) · stage (mỗi slide một vấn đề) · bottombar điều hướng. */
:root{
  --stage-a:#070d24; --stage-b:#13245e; --ray:rgba(255,214,102,.05);
  --panel:#0f1a3f; --panel-2:#16245a; --panel-line:#2f4488; --glow:rgba(76,142,255,.35);
  --text:#f5f7fc; --muted:#b4c0e2; --dim:#7f8db8;
  --gold:#ffc83d; --gold-2:#ff9f1c; --gold-ink:#1a1204; --gold-soft:rgba(255,200,61,.14);
  --blue:#4c8eff; --blue-2:#2f6bff; --blue-soft:rgba(76,142,255,.16);
  --ok:#2fd27a; --ok-soft:rgba(47,210,122,.16); --bad:#ff5a5f; --bad-soft:rgba(255,90,95,.16);
  --hint:#ffd166;
  --fig-ink:#f5f7fc; --fig-dim:#9fb0da; --fig-faint:#3a4d8f;
  --pl-a:rgba(76,142,255,.26); --pl-b:rgba(255,200,61,.24); --pl-c:rgba(47,210,122,.22);
  --btn:#1b2a63; --btn-line:#3a55a8; --input-bg:#060b1f;
  --font:"Chakra Petch","Bahnschrift","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans",sans-serif;
  color-scheme:dark;
}
:root[data-mb="light"]{
  --stage-a:#e9eefb; --stage-b:#f8f9fe; --ray:rgba(30,64,175,.035);
  --panel:#ffffff; --panel-2:#f2f5fd; --panel-line:#c6d1ee; --glow:rgba(29,78,216,.12);
  --text:#0d1433; --muted:#3c4870; --dim:#6b7699;
  --gold:#b87a00; --gold-2:#a86400; --gold-ink:#ffffff; --gold-soft:rgba(201,136,0,.12);
  --blue:#1d4ed8; --blue-2:#1e40af; --blue-soft:rgba(29,78,216,.1);
  --ok:#0f8a44; --ok-soft:rgba(15,138,68,.12); --bad:#c62828; --bad-soft:rgba(198,40,40,.1);
  --hint:#8a5a00;
  --fig-ink:#0d1433; --fig-dim:#5b6892; --fig-faint:#c3cde9;
  --pl-a:rgba(29,78,216,.16); --pl-b:rgba(201,136,0,.2); --pl-c:rgba(15,138,68,.16);
  --btn:#ffffff; --btn-line:#b9c6ea; --input-bg:#ffffff;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--stage-a);color:var(--text);font-family:var(--font);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}


/* ĐOÀN TÀU DÃY SỐ · Mr Black NBK
   Thang chữ khóa 3 cỡ: --h 40px (đề mục) · --tx 32px (nội dung) · --sm 24px (nhãn phụ). */
:root{--h:40px;--tx:32px;--sm:24px;--line:1.45}
#viewport{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% -10%,var(--stage-b),var(--stage-a) 70%)}
#canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;font-size:var(--tx);line-height:var(--line)}
.katex{font-size:1.02em;text-transform:none;letter-spacing:normal}
b{font-weight:700}

/* ---------- Thanh trên: thương hiệu + mục lục đề mục ---------- */
.topbar{position:absolute;left:48px;right:48px;top:24px;height:64px;display:flex;align-items:center;gap:28px;z-index:3;transition:opacity .3s,filter .3s}
.brand{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;text-align:left;flex:0 0 auto}
.brand .logo{width:56px;height:56px;position:relative}
.brand .logo svg{width:56px;height:56px;display:block}
.brand .logo img{position:absolute;inset:4px;width:48px;height:48px;object-fit:cover;border-radius:9px}
.brand b{display:block;font-size:var(--sm);line-height:1}
.brand small{display:block;margin-top:5px;font-size:16px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.secs{margin-left:auto;display:flex;align-items:center;gap:0}
.secs span{height:44px;padding:0 18px;display:inline-flex;align-items:center;font-size:20px;font-weight:700;color:var(--dim);border-bottom:3px solid var(--panel-line)}
.secs span.done{color:var(--muted)}
.secs span.cur{color:var(--gold);border-bottom-color:var(--gold)}

.stage{position:absolute;left:48px;right:48px;top:112px;bottom:112px;z-index:2}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;gap:28px}
.watermark{position:absolute;right:0;bottom:0;font-size:110px;font-weight:700;color:var(--text);opacity:.045;pointer-events:none;line-height:1}

/* ---------- ĐỀ MỤC: luôn nổi bật ở đầu mỗi slide ---------- */
.hd{flex:0 0 auto;display:flex;align-items:stretch;gap:0;border-radius:16px;overflow:hidden;border:2px solid var(--gold);background:var(--panel)}
.hd .sn{flex:0 0 auto;min-width:92px;padding:0 22px;display:grid;place-items:center;font-size:var(--h);font-weight:700;color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2))}
.hd .st{flex:0 0 auto;padding:14px 28px;font-size:var(--h);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center}
.hd .ss{flex:1 1 auto;padding:14px 28px;font-size:var(--h);font-weight:700;color:var(--text);display:flex;align-items:center;border-left:2px solid var(--panel-line)}
.lead{margin:0;font-size:var(--tx);font-weight:600;color:var(--muted)}
.lead b{color:var(--text)}

/* ---------- Vùng hình ---------- */
.fig{flex:1 1 auto;min-height:0;display:grid;place-items:center;position:relative}
.fig>svg{display:block;overflow:visible}
.cols{flex:1 1 auto;min-height:0;display:grid;gap:40px;align-items:center}
.muted{color:var(--muted)} .gold-t{color:var(--gold)} .blue-t{color:var(--blue)} .ok-t{color:var(--ok)} .bad-t{color:var(--bad)}
.box{border-radius:18px;border:2px solid var(--panel-line);background:var(--panel);padding:22px 28px}
.cap{display:block;text-align:center;font-size:var(--sm);font-weight:700;color:var(--muted);margin-top:8px}

/* ---------- GHI VỞ: thẻ vở có tab thò ra, nội dung thò thụt ---------- */
.ghi{position:relative;flex:0 0 auto;margin-top:18px;padding:26px 34px 22px 34px;border-radius:0 18px 18px 18px;border:3px solid var(--gold);
  background:repeating-linear-gradient(180deg,transparent 0 45px,rgba(255,200,61,.07) 45px 46px),var(--panel);transition:transform .35s ease,box-shadow .35s ease}
.ghi::before{content:"📝  GHI VỞ";position:absolute;left:-3px;top:-44px;height:44px;padding:0 22px;display:flex;align-items:center;border-radius:12px 12px 0 0;
  font-size:var(--sm);font-weight:700;letter-spacing:.12em;color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2))}
.ghi{cursor:pointer}
.ghi ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ghi li{font-size:var(--tx);font-weight:600;line-height:var(--line);padding-left:36px;position:relative}
.ghi li::before{content:"";position:absolute;left:6px;top:.6em;width:14px;height:14px;border-radius:4px;background:var(--gold)}
.ghi li.l2{padding-left:84px}
.ghi li.l2::before{left:48px;top:.72em;width:20px;height:4px;border-radius:2px;background:var(--muted)}
.ghi .kw{color:var(--gold)}
/* chế độ tập trung ghi chép */
.dimmer{position:absolute;inset:-112px -48px;z-index:5;background:rgba(3,6,18,.74);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .35s}
:root[data-mb="light"] .dimmer{background:rgba(230,235,248,.8)}
.slide.focus .dimmer{opacity:1;pointer-events:auto}
.ghi.spot{z-index:6;transform:scale(1.04);box-shadow:0 0 0 8px var(--gold-soft),0 30px 80px rgba(0,0,0,.45)}
body.focus .topbar,body.focus .bottombar>:not(#next):not(#prev){opacity:.18;filter:blur(2px)}
.focus-tip{position:absolute;right:0;top:-40px;font-size:20px;font-weight:700;color:var(--dim);display:none}
.ghi.spot .focus-tip{display:block}

/* ---------- Thanh dưới ---------- */
.bottombar{position:absolute;left:48px;right:48px;bottom:24px;height:64px;display:flex;align-items:center;gap:14px;z-index:7}
.bottombar>*{transition:opacity .3s,filter .3s}
.nbtn{height:58px;min-width:58px;padding:0 18px;border-radius:10px;border:2px solid var(--btn-line);background:var(--btn);font-size:20px;font-weight:700;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.nbtn:hover:not(:disabled){border-color:var(--gold)}
.nbtn:disabled{opacity:.35;cursor:default}
.nbtn.go{background:linear-gradient(180deg,var(--gold),var(--gold-2));border-color:var(--gold);color:var(--gold-ink);min-width:110px;font-size:var(--sm)}
.nbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.nlabel{font-size:20px;font-weight:700;width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.progress{flex:1;height:10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--panel-line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .3s}
.ncount{font-size:20px;font-weight:700;color:var(--muted);min-width:76px;text-align:right;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:6px;min-width:80px}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--gold)}
.pips i.on{background:var(--gold)}

/* ---------- Thành phần ---------- */
.btn{height:60px;padding:0 26px;border-radius:12px;border:2px solid var(--btn-line);background:var(--btn);font-size:var(--sm);font-weight:700}
.btn:hover{border-color:var(--gold)}
.btn[data-state="ok"]{border-color:var(--ok);background:var(--ok-soft)}
.btn[data-state="ok"]::before{content:"✓ ";color:var(--ok)}
.btn[data-state="bad"]{border-color:var(--bad);border-style:dashed;background:var(--bad-soft)}
.btn[data-state="bad"]::before{content:"✗ ";color:var(--bad)}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.fbk{font-size:var(--sm);font-weight:600;min-height:1.45em;margin:0;text-align:center}
.qa{display:grid;gap:14px;align-content:center}
.qa .q{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:14px 26px;border-radius:14px;border:2px solid var(--panel-line);background:var(--panel);font-size:var(--tx)}
.qa .a{font-weight:700;color:var(--gold)}
.qa .a .katex{color:var(--gold)}
.say{display:grid;gap:14px}
.say>div{font-size:var(--tx);font-weight:600;padding:12px 24px;border-left:6px solid var(--gold);border-radius:0 14px 14px 0;background:var(--panel)}

[data-step]:not(.on){visibility:hidden}
[data-unstep].gone{visibility:hidden}

/* ---------- SVG ---------- */
.rail{stroke:var(--panel-line);stroke-width:5}
.car{fill:var(--panel-2);stroke:var(--blue);stroke-width:3}
.car.last{stroke:var(--gold);stroke-width:5}
.carg.click{cursor:pointer}
.carg.click:hover .car{stroke:var(--gold)}
.carg[data-state="ok"] .car{stroke:var(--ok);stroke-width:5;fill:var(--ok-soft)}
.carg[data-state="bad"] .car{stroke:var(--bad);stroke-dasharray:10 7;fill:var(--bad-soft)}
.wheel{fill:var(--stage-a);stroke:var(--muted);stroke-width:4}
.cpl{stroke:var(--muted);stroke-width:5}
.loco{fill:var(--gold)} .loco2{fill:var(--stage-a)}
.num{font-family:var(--font);font-size:44px;font-weight:700;fill:var(--text)}
.num.q{fill:var(--blue)} .num.ans{fill:var(--gold)}
.lab{font-family:var(--font);font-size:24px;font-weight:600;fill:var(--muted)}
.lab.gold{fill:var(--gold);font-weight:700} .lab.blue{fill:var(--blue)} .lab.ok{fill:var(--ok)} .lab.bad{fill:var(--bad)} .lab.ink{fill:var(--gold-ink);font-weight:700}
.mt{font-family:KaTeX_Math,"Times New Roman",serif;font-style:italic;font-size:28px;fill:var(--blue)}
.mt .sb{font-family:KaTeX_Main,"Times New Roman",serif;font-style:normal}
.dot3{fill:var(--muted)}
.arc{fill:none;stroke:var(--gold);stroke-width:4}
.arrh{fill:var(--gold)}
.axis{stroke:var(--text);stroke-width:3}
.bar{fill:var(--blue)} .bar.g{fill:var(--gold)} .bar.bad{fill:var(--bad)}
.lineM{stroke:var(--gold);stroke-width:4} .linem{stroke:var(--blue);stroke-width:4}
.tunnel{fill:var(--gold-soft)}
.gridl{stroke:var(--panel-line);stroke-width:2;stroke-dasharray:8 6}

/* máy công thức (hình động → lớn) */
.machine{display:grid;grid-template-columns:330px auto 560px auto 330px;align-items:center;justify-content:center;gap:28px}
.machine .io{border-radius:22px;border:3px solid var(--blue);background:var(--blue-soft);padding:34px 20px;text-align:center;font-size:56px;font-weight:700}
.machine .core{border-radius:26px;border:4px solid var(--gold);background:var(--gold-soft);padding:30px 24px 40px;text-align:center;font-size:56px;font-weight:700}
.machine .core small{display:block;font-size:var(--sm);color:var(--gold);letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
.machine .io.out{border-color:var(--gold);background:var(--gold-soft)}
.machine .ar{font-size:56px;color:var(--gold)}
.slider{display:flex;align-items:center;justify-content:center;gap:24px;font-size:var(--tx);font-weight:700}
input[type=range]{accent-color:var(--gold);width:640px;height:34px}

/* 4 cách cho */
.ways{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;align-content:center;flex:1 1 auto}
.way{border-radius:18px;border:2px solid var(--panel-line);background:var(--panel);padding:22px 18px;display:grid;justify-items:center;gap:10px;text-align:center}
.way svg{width:220px;height:130px}
.way b{font-size:var(--tx)}
.way .ex{font-size:var(--sm);font-weight:600;color:var(--muted)}
.way .k{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:var(--sm);font-weight:700;background:linear-gradient(180deg,var(--gold),var(--gold-2));color:var(--gold-ink)}

/* tổng kết */
.map{position:relative;flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 520px 1fr;grid-template-rows:1fr 1fr;gap:28px 40px;align-items:center}
.map>svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.node{position:relative;z-index:1;border-radius:18px;border:2px solid var(--panel-line);background:var(--panel);padding:20px 26px;font-size:var(--sm);font-weight:600;line-height:1.55}
.node b{display:block;font-size:var(--tx);color:var(--gold);margin-bottom:4px}
.node.c{grid-column:2;grid-row:1/3;align-self:center;text-align:center;border:4px solid var(--gold);background:linear-gradient(var(--gold-soft),var(--gold-soft)),var(--panel);font-size:var(--h);font-weight:700;padding:34px 20px}

/* bìa */
.cover{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.cover h1{margin:14px 0 0;font-size:120px;line-height:1;letter-spacing:-.03em}
.cover h1 span{display:block;color:var(--gold)}
.cover .eb{margin:0;font-size:var(--sm);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.cover .sig{margin-top:30px;font-size:var(--sm);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.cover .sig b{color:var(--gold)}
.gvnote{position:absolute;left:0;right:0;bottom:-8px;z-index:8;display:none;padding:10px 18px;border-radius:14px;border:2px dashed var(--gold);background:var(--panel);font-size:20px;font-weight:600;color:var(--muted)}
body.gv .gvnote{display:block}
.menu{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);width:1300px;z-index:9;padding:24px;border-radius:18px;border:2px solid var(--panel-line);background:var(--panel)}
.menu .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu button{text-align:left;padding:14px 18px;border-radius:12px;border:2px solid var(--panel-line);background:var(--btn);font-size:22px;font-weight:700}
.menu button:hover{border-color:var(--gold)}
#nojs{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#0b1024;color:#fff;font:600 18px system-ui,sans-serif}
.js #nojs{display:none}
#rotate{position:fixed;inset:0;z-index:998;display:none;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:rgba(6,9,20,.94);color:#fff;font:600 19px system-ui,sans-serif;text-align:center;padding:28px}
#rotate button{font:700 16px system-ui,sans-serif;background:#ffc83d;border:0;border-radius:10px;padding:10px 18px;color:#0a0c12}
@media (orientation:portrait) and (max-width:900px){.js:not(.keep-portrait) #rotate{display:flex}}
.fade{animation:fd .4s ease-out}
@keyframes fd{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fig{align-content:center;gap:12px}
.chart{display:grid;justify-items:center;gap:14px;font-size:var(--tx)}
.node{font-size:var(--tx);line-height:1.5}
.ghi.spot{transform:scale(1.02)}

/* ===== V4: chữ lớn hơn, hình tự giãn, ghi vở phóng giữa màn hình ===== */
:root{--h:44px;--tx:36px;--sm:28px}
.fig>svg.fit,.fig svg.fit{width:100%;height:100%;display:block}
.fig{min-height:0;min-width:0}
.cols>*{min-height:0;min-width:0}
.cols{align-items:stretch}
.chart{display:grid;grid-template-rows:auto 1fr;justify-items:stretch;text-align:center;min-height:0}
.lead{font-size:var(--tx)}
.lead.big{font-size:var(--h);font-weight:700;color:var(--text);text-align:center}
.ghi{padding:22px 34px 18px}
.ghi li{font-size:var(--tx)}
.ghi.spot{transform:none;box-shadow:none}
.spotbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:1560px;max-height:820px;padding:64px 70px 54px;border:4px solid var(--gold);border-radius:28px;
  background:repeating-linear-gradient(180deg,transparent 0 69px,rgba(255,200,61,.08) 69px 70px),var(--panel);box-shadow:0 0 0 12px var(--gold-soft),0 40px 120px rgba(0,0,0,.55);cursor:pointer}

.f3v.blue .f3vl{stroke:#5aa8ff} .f3v.blue .f3vh{fill:#5aa8ff}
.f3v.gold .f3vl{stroke:var(--gold)} .f3v.gold .f3vh{fill:var(--gold)}
.f3v.green .f3vl{stroke:#2fd27a} .f3v.green .f3vh{fill:#2fd27a}
.f3v.violet .f3vl{stroke:#c08bff} .f3v.violet .f3vh{fill:#c08bff}
:root[data-mb="light"] .f3v.red .f3vl{stroke:#d63031} :root[data-mb="light"] .f3v.red .f3vh{fill:#d63031}
:root[data-mb="light"] .f3v.blue .f3vl{stroke:#1d6fe0} :root[data-mb="light"] .f3v.blue .f3vh{fill:#1d6fe0}
:root[data-mb="light"] .f3v.green .f3vl{stroke:#0f8a44} :root[data-mb="light"] .f3v.green .f3vh{fill:#0f8a44}
:root[data-mb="light"] .f3v.violet .f3vl{stroke:#7b3fd1} :root[data-mb="light"] .f3v.violet .f3vh{fill:#7b3fd1}
.f3vt{font-family:KaTeX_Math,"Times New Roman",serif;font-style:italic;font-size:34px;fill:currentColor;paint-order:stroke;stroke:var(--stage-a);stroke-width:7px}
.f3va{fill:none;stroke-width:2.4;stroke:currentColor}
.f3v.red{color:#ff6b6b} .f3v.blue{color:#5aa8ff} .f3v.gold{color:var(--gold)} .f3v.green{color:#2fd27a} .f3v.violet{color:#c08bff}
:root[data-mb="light"] .f3v.red{color:#d63031} :root[data-mb="light"] .f3v.blue{color:#1d6fe0} :root[data-mb="light"] .f3v.green{color:#0f8a44} :root[data-mb="light"] .f3v.violet{color:#7b3fd1}
.f3dot circle{fill:var(--gold);stroke:var(--stage-a);stroke-width:2}
.f3tick line{stroke:var(--gold);stroke-width:3}
.f3arc polyline{fill:none;stroke:var(--gold);stroke-width:4}
.f3al{font-family:var(--font);font-size:28px;font-weight:700;fill:var(--gold);paint-order:stroke;stroke:var(--stage-a);stroke-width:6px}
.f3rot{position:absolute;right:0;bottom:-10px;transform:scale(.85);transform-origin:100% 100%;display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;border:2px solid var(--panel-line);background:var(--panel);font-size:20px;font-weight:700;color:var(--muted);opacity:.85}

/* nhãn đỉnh/vectơ phải đổi màu viền halo theo nền */
:root[data-mb="light"] .f3l,:root[data-mb="light"] .f3vt,:root[data-mb="light"] .f3al{stroke:#f4f6fd}
/* --- hình 2D --- */
.v2{display:block;overflow:visible}
.v2 .ln{stroke:var(--fig-ink);stroke-width:3;fill:none}
.v2 .ln.dash{stroke:var(--fig-dim);stroke-dasharray:10 8}
.v2 .lab{font-family:KaTeX_Math,"Times New Roman",serif;font-style:italic;font-size:32px;fill:var(--text);paint-order:stroke;stroke:var(--stage-a);stroke-width:6px}
.v2 .lbl{font-family:var(--font);font-size:26px;font-weight:700;fill:var(--muted);paint-order:stroke;stroke:var(--stage-a);stroke-width:6px}
:root[data-mb="light"] .v2 .lab,:root[data-mb="light"] .v2 .lbl{stroke:#f4f6fd}
.ctl{display:flex;align-items:center;justify-content:center;gap:20px;font-size:var(--sm);font-weight:700;color:var(--muted)}
.ctl input[type=range]{width:520px}
.ctl output{min-width:120px;color:var(--gold);font-variant-numeric:tabular-nums}
/* --- thẻ định nghĩa/tri thức trên slide (không phải ghi vở) --- */
.kbox{border-radius:18px;border:2px solid var(--gold);background:linear-gradient(var(--gold-soft),var(--gold-soft)),var(--panel);padding:20px 28px;font-size:var(--tx);font-weight:600;line-height:1.45}
.kbox .kw{color:var(--gold)}
.sayv>div{font-size:var(--tx)}
.say .q2{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-right:54px}
.qa .q .ach .btn{min-width:120px}
.vs{display:inline-flex;gap:10px}
.lead.c{text-align:center}
.tagq{display:inline-block;margin-right:12px;padding:2px 14px;border-radius:10px;background:var(--gold);color:var(--gold-ink);font-weight:700}
.fignote{position:absolute;left:8px;top:4px;font-size:20px;font-weight:700;color:var(--dim)}
.cols>.fig{height:100%}
.qa.tight{gap:10px}
.qa.tight .q{padding-top:10px;padding-bottom:10px}
.ach.wide .btn{min-width:110px;padding:0 18px}
.proof{display:grid;gap:12px;align-content:center}
.proof .pr{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:38px;font-weight:600;padding:10px 54px 10px 22px;border-radius:14px;border:2px solid var(--panel-line);background:var(--panel);position:relative}
.proof .pr .why{font-size:var(--sm);color:var(--ok);font-weight:600}
.proof .pr .ach{justify-self:auto}
.proof .pr .ach .btn{height:58px;min-width:96px;font-size:30px;padding:0 16px}
.calc3 .cr{grid-template-columns:minmax(0,1fr) auto}
.calc3 .cr .why{max-width:300px}
.calc3.sm .cr{font-size:34px}
.calc3.sm .cr .why{font-size:24px}
.nomic{height:44px;padding:0 14px;display:inline-flex;align-items:center;border-radius:10px;font-size:18px;font-weight:700;color:var(--dim);border:2px dashed var(--panel-line);white-space:nowrap}

/* hình 3D luôn nằm gọn trong ô hình, không đè thanh trạm dừng */
.fig>.f3d{position:absolute;inset:0;margin:auto;width:100%;height:100%;max-width:var(--fw);max-height:var(--fh)}
.cover .fig>.f3d{position:relative}
.ach .btn{height:auto;min-height:60px;padding:6px 20px;line-height:1.25}
.lead{margin:0}
.slide>.lead{flex:0 0 auto}
/* bìa: chọn phần học */
.cover .cvr{display:grid;grid-template-rows:380px auto;gap:6px;align-self:stretch;align-content:center;min-width:0}
.cover .cvr .fig{height:380px;position:relative}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.parts .pk{grid-column:1/-1;margin:0 0 2px;font-size:var(--sm);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.pcard{display:grid;gap:4px;text-align:left;padding:14px 20px 12px;border-radius:16px;border:2px solid var(--panel-line);background:var(--panel);color:var(--text);cursor:pointer;font:inherit}

.pcard .pn{font-size:20px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}

.pcard .pf{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:20px;font-weight:600;color:var(--muted)}
.pcard .pneed{color:var(--dim)}
.pcard.ok{border-color:var(--ok)}
.pcard.ok .pst{color:var(--ok);font-weight:700}
.cover .btn.resume{margin-top:16px;margin-left:16px;height:auto;min-height:78px;padding:10px 26px;font-size:30px;border:2px solid var(--gold);background:var(--panel);color:var(--text)}
.pcard{justify-items:start;align-content:start}
.pcard b{font-size:27px}

.cover .pending{justify-self:end;margin:0;padding:6px 16px;border-radius:12px;border:2px dashed var(--gold);font-size:22px;font-weight:700;color:var(--gold);background:var(--gold-soft)}
.cover .cvr:has(.pending){grid-template-rows:auto 340px auto}
.cover .cvr:has(.pending) .fig{height:340px}

/* ===== THỐNG KÊ · CHƯƠNG III TOÁN 12 — thành phần riêng ===== */
/* khung đề bài: viền vàng, chữ lớn; các ý a), b), c) mỗi ý một dòng */
.de{flex:0 0 auto;position:relative;border:3px solid var(--gold);border-radius:18px;background:linear-gradient(var(--gold-soft),var(--gold-soft)),var(--panel);padding:18px 30px 16px;font-size:var(--tx);font-weight:600;line-height:1.42}
.de .tg{display:inline-block;margin-right:14px;padding:0 14px;border-radius:10px;background:linear-gradient(180deg,var(--gold),var(--gold-2));color:var(--gold-ink);font-weight:700;font-size:30px;line-height:44px;vertical-align:2px}
.de .dt{display:inline}
.de .it{margin-top:6px;padding-left:28px}
.de.sm{font-size:32px;padding:14px 26px 12px}
.de.sm .tg{font-size:26px;line-height:40px}
/* bảng số liệu ghép nhóm */
.gt{border-collapse:separate;border-spacing:0;margin:0 auto;font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;border:2px solid var(--panel-line);border-radius:14px;overflow:hidden;background:var(--panel)}
.gt th,.gt td{padding:8px 18px;text-align:center;border-right:2px solid var(--panel-line);border-bottom:2px solid var(--panel-line);white-space:nowrap;transition:background .3s,color .3s}
.gt tr:last-child>*{border-bottom:0}
.gt tr>*:last-child{border-right:0}
.gt tr:first-child th{background:var(--panel-2);color:var(--text)}
.gt th.rh{text-align:left;color:var(--gold);background:var(--panel-2)}
.gt td.hl,.gt th.hl{background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 3px var(--gold)}
.gt .dimc{color:var(--dim)}
.gt.sm{font-size:28px}
.gt.sm th,.gt.sm td{padding:6px 14px}
.gt.lg{font-size:36px}
.gt td .ain{justify-self:center}
.gt td .ain input{height:56px;font-size:32px}
.gt td .mk{right:-30px}
/* biểu đồ */
.hist,.strip,.zoom,.dots{overflow:visible}
.hist .hg{stroke:var(--panel-line);stroke-width:1.5;stroke-dasharray:6 8}
.hist .hax,.zoom .hax,.dots .hax{stroke:var(--fig-ink);stroke-width:3}
.hist .hah{fill:var(--fig-ink)}
.ht{font-family:var(--font);font-size:26px;font-weight:600;fill:var(--muted);text-anchor:middle}
.ht.r{text-anchor:end}
.ht.mut{fill:var(--dim);font-size:24px}
.hbar rect{fill:rgba(76,142,255,.55);stroke:var(--blue);stroke-width:2.5}
.hbar.g rect{fill:rgba(255,200,61,.5);stroke:var(--gold)}
.hbar.v rect{fill:rgba(192,139,255,.45);stroke:#c08bff}
.hbar.dim rect{fill:rgba(160,175,215,.18);stroke:var(--fig-dim)}
.hbar.bad rect{fill:var(--bad-soft);stroke:var(--bad);stroke-dasharray:8 6}
:root[data-mb="light"] .hbar rect{fill:rgba(29,78,216,.28)}
:root[data-mb="light"] .hbar.g rect{fill:rgba(201,136,0,.3)}
:root[data-mb="light"] .hbar.v rect{fill:rgba(123,63,209,.22);stroke:#7b3fd1}
.hv{font-family:var(--font);font-size:26px;font-weight:700;fill:var(--text);text-anchor:middle}
.hv.z{fill:var(--dim)}
.hband rect{fill:var(--ok-soft);stroke:none}
.hband.gold rect{fill:var(--gold-soft)}
.hl2{font-family:var(--font);font-size:24px;font-weight:700;fill:var(--ok);text-anchor:middle}
.hmk line{stroke:var(--ok);stroke-width:3.5;stroke-dasharray:10 7}
.hmk text{font-family:KaTeX_Main,"Times New Roman",serif;font-size:30px;font-weight:700;fill:var(--ok);text-anchor:middle;paint-order:stroke;stroke:var(--stage-a);stroke-width:6px}
.hmk.gold line{stroke:var(--gold)} .hmk.gold text{fill:var(--gold)}
.hbr path{fill:none;stroke:var(--gold);stroke-width:4}
.hbr .gd{stroke:var(--gold);stroke-width:2;stroke-dasharray:6 6;opacity:.7}
.hbr text{font-family:var(--font);font-size:30px;font-weight:700;fill:var(--gold);text-anchor:middle;paint-order:stroke;stroke:var(--stage-a);stroke-width:6px}
.hbr.ok path{stroke:var(--ok)} .hbr.ok .gd{stroke:var(--ok)} .hbr.ok text{fill:var(--ok)}
.hbr.bad path{stroke:var(--bad)} .hbr.bad .gd{stroke:var(--bad)} .hbr.bad text{fill:var(--bad)}
:root[data-mb="light"] .hmk text,:root[data-mb="light"] .hbr text{stroke:#f4f6fd}
/* dải xếp hạng */
.strip .sg rect{stroke:var(--stage-a);stroke-width:1}
.strip .sg.g0 rect{fill:rgba(76,142,255,.6)} .strip .sg.g1 rect{fill:rgba(192,139,255,.55)}
:root[data-mb="light"] .strip .sg.g0 rect{fill:rgba(29,78,216,.35)} :root[data-mb="light"] .strip .sg.g1 rect{fill:rgba(123,63,209,.3)}
.strip .shi{fill:none;stroke:var(--gold);stroke-width:5}
.strip .sb{stroke:var(--fig-ink);stroke-width:2.5}
.strip .sl{font-family:var(--font);font-size:24px;font-weight:700;fill:var(--muted);text-anchor:middle}
.strip .sc{font-family:var(--font);font-size:24px;font-weight:700;fill:var(--text);text-anchor:middle}
.strip .spos line{stroke:var(--gold);stroke-width:4}
.strip .spos polygon{fill:var(--gold)}
.strip .spos text{font-family:var(--font);font-size:28px;font-weight:700;fill:var(--gold);text-anchor:middle;paint-order:stroke;stroke:var(--stage-a);stroke-width:6px}
.strip .spos.ok line{stroke:var(--ok)} .strip .spos.ok polygon{fill:var(--ok)} .strip .spos.ok text{fill:var(--ok)}
:root[data-mb="light"] .strip .spos text{stroke:#f4f6fd}
/* phóng to nhóm */
.zoom .zc{fill:var(--panel-2);stroke:var(--blue);stroke-width:2.5}
.zoom .zf{fill:var(--gold-soft);stroke:var(--gold);stroke-width:2.5}
.zoom .zq line{stroke:var(--gold);stroke-width:4}
.zoom .zq text{font-family:var(--font);font-size:30px;font-weight:700;fill:var(--gold);text-anchor:middle}
.zoom .zt{font-family:var(--font);font-size:26px;font-weight:700;fill:var(--gold);text-anchor:middle}
/* mô hình chấm */
.dots .dt{fill:rgba(76,142,255,.75);stroke:var(--stage-a);stroke-width:1.5}
.dots .dt.v{fill:rgba(192,139,255,.75)}
.dots .dband{fill:var(--ok-soft)}
.dots .dmean{stroke:var(--gold);stroke-width:4}
.dots .dsd{stroke:var(--ok);stroke-width:3;stroke-dasharray:9 7}
.dots .dml{font-family:KaTeX_Main,"Times New Roman",serif;font-style:italic;font-size:32px;font-weight:700;fill:var(--gold);text-anchor:middle}
/* bảng điều khiển của mô hình */
.dctl{display:flex;justify-content:space-around;gap:10px;padding:0 40px}
.dctl .pm{display:flex;align-items:center;gap:6px}
.dctl .pm button{width:52px;height:48px;border-radius:10px;border:2px solid var(--btn-line);background:var(--btn);font-size:26px;font-weight:700}
.dctl .pm button:hover{border-color:var(--gold)}
.dctl .pm b{min-width:40px;text-align:center;font-size:28px}
.readout{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.readout .chip{height:54px;font-size:28px;color:var(--text)}
.readout .chip b{color:var(--gold);margin-left:8px}
.readout .chip.ok b{color:var(--ok)}
.dpre{display:flex;gap:12px;justify-content:center}
.dpre .btn{height:52px;font-size:22px;padding:0 18px}
/* dự đoán */
.pred{display:inline-flex;gap:12px;flex-wrap:wrap}
.pred .btn{height:auto;min-height:58px;padding:6px 20px}
.pred .btn[data-state="sel"]{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
/* nút rút thăm mẫu gốc */
.rawbox{display:grid;gap:10px;justify-items:center}
.rawbox .row{justify-content:center}
.btn.gold-o{border-color:var(--gold);color:var(--gold)}
/* thẻ chốt */
.chot{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:stretch}
.remember,.mist{border-radius:20px;padding:24px 30px;background:var(--panel);font-size:32px;font-weight:600;line-height:1.45}
.remember{border:3px solid var(--gold)} .mist{border:3px dashed var(--bad)}
.remember h3,.mist h3{margin:0 0 12px;font-size:36px}
.remember h3{color:var(--gold)} .mist h3{color:var(--bad)}
.remember ul,.mist ul{margin:0;padding-left:30px;display:grid;gap:10px}
.mist .fix{color:var(--ok)}
.qa .q .ain{justify-self:end}
.calc3 .cr .m{white-space:nowrap}
.note2{font-size:26px;font-weight:600;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto auto;gap:10px 24px;align-items:center;justify-content:start;font-size:34px;font-weight:600}
.split{flex:1 1 auto;min-height:0;display:grid;gap:28px;align-items:stretch}
.split>*{min-height:0;min-width:0}
.vstack{display:flex;flex-direction:column;gap:16px;justify-content:center;min-height:0}
.vstack>.fig{flex:1 1 auto}
.cap2{text-align:center;font-size:26px;font-weight:700;color:var(--muted)}
.ht.xl{fill:var(--text);font-style:italic}
.qa.tight .q{font-size:30px;padding:10px 54px 10px 22px}
.qa.tight .q .ach .btn{min-height:54px;font-size:26px}
.ht.s{text-anchor:start}
.remember,.mist{font-size:36px}
.remember ul,.mist ul{gap:18px}
.rawbox{display:flex;flex-direction:column;gap:10px}
.rawbox>.fig{flex:1 1 auto;min-height:0}
/* Bài 9 */
.raw .rg0{fill:rgba(76,142,255,.08)} .raw .rg1{fill:rgba(192,139,255,.08)}
.raw .rdot{fill:var(--gold);stroke:var(--stage-a);stroke-width:1.5}
.raw .hax{stroke:var(--fig-ink);stroke-width:3}
.kbox .katex-display{margin:8px 0}

/* ===== Chương IV · đồ thị hàm số, hình thang cong ===== */
.pl{display:block;width:100%;height:100%;overflow:visible}
.pl-ax{stroke:var(--fig-ink);stroke-width:3}
.pl-ar{fill:var(--fig-ink)}
.pl-tk{stroke:var(--fig-ink);stroke-width:2.5}
.pl-g{stroke:var(--fig-faint);stroke-width:1.5;stroke-dasharray:4 6}
.pl-n{font-family:var(--font);font-size:26px;font-weight:600;fill:var(--muted)}
.pl-v{font-family:KaTeX_Math,"Times New Roman",serif;font-style:italic;font-size:32px;fill:var(--fig-ink)}
.pl-l{font-family:var(--font);font-size:28px;font-weight:700;fill:var(--text);paint-order:stroke;stroke:var(--stage-a);stroke-width:6px;stroke-linejoin:round}
.pl-l.fn{font-family:KaTeX_Main,"Times New Roman",serif;font-style:italic;font-weight:400;font-size:30px}
.pl-l.big{font-size:40px;fill:var(--gold)}
.pl-c path{fill:none;stroke:var(--blue);stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
.pl-c.c2 path{stroke:var(--bad)} .pl-c.c3 path{stroke:var(--ok)} .pl-c.c4 path{stroke:#c08bff} .pl-c.c5 path{stroke:var(--gold)}
.pl-c.dim path{stroke:var(--fig-dim);stroke-width:3;opacity:.8}
.pl-c.c2 .pl-l{fill:var(--bad)} .pl-c.c3 .pl-l{fill:var(--ok)} .pl-c .pl-l{fill:var(--blue)} .pl-c.c5 .pl-l{fill:var(--gold)}
.pl-fill path{fill:rgba(255,200,61,.32);stroke:var(--gold);stroke-width:2.5}
.pl-fill.f2 path{fill:rgba(76,142,255,.30);stroke:var(--blue)}
.pl-fill.f3 path{fill:rgba(47,210,122,.28);stroke:var(--ok)}
.pl-fill.f4 path{fill:rgba(255,90,95,.26);stroke:var(--bad)}
.pl-fill.f2 .pl-l{fill:var(--blue)} .pl-fill.f3 .pl-l{fill:var(--ok)} .pl-fill.f4 .pl-l{fill:var(--bad)}
:root[data-mb="light"] .pl-fill path{fill:rgba(201,136,0,.22)}
:root[data-mb="light"] .pl-fill.f2 path{fill:rgba(29,78,216,.16)}
:root[data-mb="light"] .pl-fill.f3 path{fill:rgba(15,138,68,.16)}
:root[data-mb="light"] .pl-fill.f4 path{fill:rgba(198,40,40,.14)}
:root[data-mb="light"] .pl-l{stroke:#f4f6fd}
.pl-d{stroke:var(--fig-dim);stroke-width:2.5;stroke-dasharray:8 7}
.pl-d.gold{stroke:var(--gold)} .pl-d.solid{stroke-dasharray:none;stroke:var(--fig-ink)}
.pl-p circle{fill:var(--gold);stroke:var(--stage-a);stroke-width:3}
.pl-p.b circle{fill:var(--blue)} .pl-p.o circle{fill:var(--stage-a);stroke:var(--gold);stroke-width:3.5}
/* màn hình máy tính mô phỏng */
.calcs{position:relative;display:grid;gap:12px;padding:18px 20px 16px;border-radius:24px;background:linear-gradient(180deg,#2b3240,#1a1f29);border:3px solid #444d5e;box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}
.calcs .ctag{position:absolute;right:16px;top:-15px;padding:2px 12px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-size:16px;font-weight:700;letter-spacing:.14em}
.cscr{border-radius:12px;background:#c9d6b8;color:#1a2414;padding:12px 18px;font-family:"Courier New",monospace;box-shadow:inset 0 3px 8px rgba(0,0,0,.35)}
.cscr .katex{color:#1a2414}
.cin{font-size:30px;min-height:46px}
.cout{font-size:44px;font-weight:700;text-align:right}
.ckeys{display:flex;flex-wrap:wrap;align-items:center;gap:6px 6px;font-size:24px;color:#cfd6e4}
.ckeys .casio{color:#f2f4f8;border-color:#8a94a8;background:#3a4252}
.ckeys i{font-style:normal;color:#8a94a8}
/* ô ẩn */
.rv{position:relative;display:inline-grid;place-items:center;min-width:120px;min-height:52px;padding:2px 12px;border-radius:12px;border:2px dashed var(--gold);background:var(--gold-soft);font:inherit;color:var(--gold);font-weight:700}
.rv .ra{display:none} .rv.on{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--text)} .rv.on .ra{display:inline} .rv.on .rq{display:none}
/* thẻ nhận dạng */
.nhan{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.nhan .nc{padding:14px 22px;border-radius:16px;border:2px solid var(--blue);background:var(--panel);font-size:28px;font-weight:600}
.nhan .nc.k{border-color:var(--gold)}
.nhan em{display:block;font-style:normal;font-size:19px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.nhan .nc.k em{color:var(--gold)}
/* khung định nghĩa */
.dn{padding:16px 26px;border-radius:18px;border:3px solid var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--panel));font-size:30px;font-weight:600;line-height:1.5}
.dn .t{display:block;font-size:20px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.dn.blue{border-color:var(--blue);background:linear-gradient(180deg,var(--blue-soft),var(--panel))} .dn.blue .t{color:var(--blue)}
.dn.ok{border-color:var(--ok);background:linear-gradient(180deg,var(--ok-soft),var(--panel))} .dn.ok .t{color:var(--ok)}
.tipcard{display:grid;gap:12px}
.tiprow{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start;padding:10px 18px;border-radius:14px;background:var(--panel);border:2px solid var(--panel-line);font-size:27px;font-weight:600}
.tiprow>b{font-size:20px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.tiprow.warn{border-color:var(--bad);border-style:dashed} .tiprow.warn>b{color:var(--bad)}
.ntab{width:100%;border-collapse:separate;border-spacing:0;border:2px solid var(--gold);border-radius:16px;overflow:hidden;background:var(--panel)}
.ntab td{padding:10px 18px;border-bottom:1px solid var(--panel-line);border-right:1px solid var(--panel-line);font-size:30px;text-align:center}
.ntab tr:last-child td{border-bottom:0} .ntab td:last-child{border-right:0}
.sld{display:flex;align-items:center;gap:16px;font-size:28px;font-weight:700}
.sld input[type=range]{width:420px;accent-color:var(--gold)}
.sld output{min-width:120px;color:var(--gold)}
/* ===== Chương VI · hình minh hoạ xác suất ===== */
.tree{position:relative;flex:0 0 auto;margin:0 auto}
.tree svg{position:absolute;inset:0;overflow:visible}
.tr-l{stroke:var(--fig-ink);stroke-width:3.2;stroke-linecap:round}
.tr-l.hl{stroke:var(--gold);stroke-width:6}
.tr-n{fill:var(--blue);stroke:var(--stage-a);stroke-width:3}
.tr-n.root{fill:var(--gold)} .tr-n.k{fill:#20242e;stroke:var(--fig-ink)} .tr-n.g{fill:var(--ok)} .tr-n.r{fill:var(--bad)} .tr-n.p{fill:#c06bff}
.tree [data-step]:not(.on){visibility:hidden}
.tr-p,.tr-lab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:28px;font-weight:700;line-height:1}
.tr-p{color:var(--text);background:var(--panel);border-radius:10px;padding:3px 6px}
.tr-p.l{transform:translate(-100%,-50%)} .tr-p.r{transform:translate(0,-50%)}
.tr-p.hl{color:var(--gold-ink);background:var(--gold)}
.tr-lab{color:var(--text)} .tr-lab.l{transform:translate(-100%,-50%)} .tr-lab.r{transform:translate(0,-50%)}
.tr-lab.leaf{display:flex;flex-direction:column;align-items:center;gap:6px;transform:translate(-50%,0)}
.tr-lab.leaf small{font-size:22px;color:var(--muted);font-weight:600}
.tr-lab.top{color:var(--gold)}
.tb2{border-collapse:collapse;font-size:30px;font-weight:600;margin:0 auto;background:var(--panel)}
.tb2 th,.tb2 td{border:2px solid var(--blue);padding:8px 22px;text-align:center;min-width:170px;white-space:nowrap}
.tb2 th{background:var(--blue-soft)}
.tb2 td.hl{background:var(--gold);color:var(--gold-ink)}
.tb2 .sm{color:var(--muted);font-weight:600}
.tb2 tr.sm td{color:var(--muted)}
.tb2 th.diag{position:relative;min-width:300px;height:92px;background:linear-gradient(to top right,var(--blue-soft) calc(50% - 1.5px),var(--blue) calc(50% - 1px),var(--blue) calc(50% + 1px),var(--blue-soft) calc(50% + 1.5px))}
.tb2 th.diag .dc{position:absolute;right:10px;top:6px;font-size:24px} .tb2 th.diag .dr{position:absolute;left:10px;bottom:6px;font-size:24px}
.tb2.sm2{font-size:26px} .tb2.sm2 th,.tb2.sm2 td{padding:6px 14px;min-width:120px} .tb2.sm2 th.diag{min-width:250px;height:84px} .tb2.sm2 th.diag span{font-size:20px}
.doors{display:flex;gap:24px;justify-content:center;flex:0 0 auto;margin:0 auto}
.door{position:relative;border-radius:14px 14px 4px 4px;background:linear-gradient(180deg,#8a4b22,#5d2f14);border:4px solid #3b1d0b;box-shadow:inset 0 0 0 10px rgba(255,255,255,.06)}
.door.sel{outline:5px solid var(--gold);outline-offset:6px}
.door .dno{position:absolute;left:50%;top:14%;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-size:38px;font-weight:800;display:grid;place-items:center}
.door .knob{position:absolute;right:12%;top:52%;width:16px;height:16px;border-radius:50%;background:var(--gold)}
.door.open{background:linear-gradient(180deg,#1b2340,#10162b);border-color:var(--panel-line)}
.door .dbg{position:absolute;left:0;right:0;bottom:12%;display:flex;flex-direction:column;align-items:center;font-size:84px;line-height:1}
.door .dbg small{font-size:24px;color:var(--text);font-weight:700;margin-top:6px}
.cover .door .pick{display:none}
.door .pick{position:absolute;left:50%;bottom:-48px;transform:translateX(-50%);white-space:nowrap;font-size:22px;color:var(--gold)}
.omg{flex:0 0 auto;max-width:100%;height:auto}
.omg .om-o{fill:var(--panel);stroke:var(--fig-ink);stroke-width:3}
.omg .om-b{fill:rgba(90,168,255,.18);stroke:var(--blue);stroke-width:4}
.omg .om-a{fill:none;stroke:var(--ok);stroke-width:4;stroke-dasharray:12 8}
.omg .om-ab{fill:var(--gold);opacity:.75}
.omg .om-t{font-size:40px;font-weight:800;fill:var(--text);font-style:italic} .omg .om-t.sm{font-size:32px;fill:var(--gold-ink)}
.omg [data-step]:not(.on){visibility:hidden}
.pens{display:flex;flex-wrap:wrap;gap:10px;max-width:420px;padding:16px;border:3px solid var(--panel-line);border-radius:18px;background:var(--panel)}
.pens .ball{width:44px;height:44px;border-radius:50%;display:inline-block;border:3px solid rgba(0,0,0,.25)}
.pens .b-x{background:#2f7bff} .pens .b-d{background:#20242e;border-color:#6b7286} .pens .b-t{background:#f4f6fb}
.pens .ball.gone{opacity:.18;outline:3px dashed var(--bad)}
.simbox{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;font-size:30px;font-weight:700}
.simbox .sb{border:3px solid var(--panel-line);border-radius:16px;padding:14px 20px;background:var(--panel)}
.simbox .sb b{display:block;font-size:46px;color:var(--gold)}
.simbar{height:18px;border-radius:9px;background:var(--panel-line);overflow:hidden;margin-top:8px} .simbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}

.de.xs{font-size:28px;padding:10px 22px 8px;line-height:1.3} .de.xs .tg{font-size:24px;line-height:36px}
.cap2.xs{font-size:25px;margin:0}

$('#brand').innerHTML = '<span class="logo">' + LOGO + '<span class="mb">MB</span></span><span><b>Mr Black</b><small>Toán THPT</small></span>';
function setPhoto(src){
  const logo = $('#brand .logo'); let img = logo.querySelector('img');
  if (!src){ if (img) img.remove(); $('#brand').classList.remove('has-photo'); return; }
  if (!img){ img = document.createElement('img'); img.alt = 'Ảnh giáo viên'; logo.appendChild(img); }
  img.src = src; $('#brand').classList.add('has-photo');
}
(function(){ let saved = ''; try { saved = localStorage.getItem('mrblack-photo') || ''; } catch (e) {} setPhoto(TEACHER_PHOTO || saved); })();
$('#brand').addEventListener('click', () => $('#photo-input').click());
$('#photo-input').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const S = 200, cv = document.createElement('canvas'); cv.width = S; cv.height = S;
      const s = Math.min(im.width, im.height), cx = cv.getContext('2d');
      cx.drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, S, S);
      const url = cv.toDataURL('image/jpeg', .85); setPhoto(url);
      try { localStorage.setItem('mrblack-photo', url); } catch (err) {}
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(f); e.target.value = '';
});

/* ---------- Công thức ---------- */
function texAll(root){
  if (!window.katex) return;
  root.querySelectorAll('.m:not([data-k]),.md:not([data-k])').forEach(e => {
    try { katex.render(e.textContent, e, {displayMode: e.classList.contains('md'), throwOnError: false, strict: false}); e.dataset.k = '1'; } catch (err) {}
  });
}
/* đọc số học sinh nhập: 3/4, -1/2, 0,75, 45°, 0.96 … */
function parseNum(str){

  const fresh = DRAW.slide !== S.cur, prev = DRAW.step; DRAW.slide = S.cur; DRAW.step = k;
  if (!DRAW.on) return;
  if (fresh){ if (k === 0) drawIn(s.el, null); return; }
  if (k > prev) drawIn(s.el, [prev, k]);

const FIGSEL = '.fig svg, .f3d svg, svg.v2, .map > svg';
function drawCat(e){
  if (e.closest('.f3fill')) return 2;
  if (e.closest('.f3v')) return 3;
  if (e.closest('.f3dot, .f3tick, .f3arc')) return 4;
  if (e.tagName === 'text') return 1;
  return 0;
}
function drawLen(e){
  const n = e.tagName;
  if (n === 'line') return Math.hypot(e.x2.baseVal.value - e.x1.baseVal.value, e.y2.baseVal.value - e.y1.baseVal.value);
  if (n === 'polyline' || n === 'path'){ try { return e.getTotalLength(); } catch (err) { return 0; } }
  return 0;
}
function drawIn(root, range){
  const items = [];
  root.querySelectorAll(FIGSEL).forEach(svg => svg.querySelectorAll('line, polyline, path, polygon, circle, text, rect, ellipse').forEach(e => {
    const st = e.closest('[data-step]');
    if (st && !st.classList.contains('on')) return;
    if (e.closest('[data-unstep].gone')) return;
    if (range){ if (!st) return; const v = +st.dataset.step; if (!(v > range[0] && v <= range[1])) return; }
    items.push({e, c: drawCat(e)});
  }));
  if (!items.length) return;
  items.sort((a, b) => a.c - b.c);
  const cnt = [0, 0, 0, 0, 0]; items.forEach(i => cnt[i.c]++);
  /* nhịp vẽ: trọn hình khoảng 2–4 giây, đủ để lời giảng giới thiệu hình */
  const base = range ? 0 : 1, gap = [Math.min(0.12, 1.4 / Math.max(1, cnt[0])), Math.min(0.05, 0.6 / Math.max(1, cnt[1])), 0.12, range ? 0.25 : 0.4, 0.1];
  let t = 0; const start = [];
  [0, 1, 2, 3, 4].forEach(c => { start[c] = t; if (cnt[c]) t += gap[c] * (cnt[c] - 1) + (c === 0 ? 0.45 : c === 1 ? 0.1 : 0.5); });
  if (cnt[1] && cnt[0]) start[1] = Math.max(0, start[1] - 0.35);
  const seen = [0, 0, 0, 0, 0], grp = new Map();
  items.forEach(({e, c}) => {
    /* các nét trong cùng một vectơ (thân, đầu, nhãn) vẽ liền nhau */
    let d;
    if (c === 3){ const g = e.closest('.f3v'); if (!grp.has(g)) grp.set(g, start[3] + gap[3] * seen[3]++); d = grp.get(g); }
    else d = start[c] + gap[c] * seen[c]++;
    const L = drawLen(e), dashed = e.classList.contains('hid'), ms = x => Math.round(x * 1000);
    if (L > 4 && !dashed && e.tagName !== 'text'){
      e.animate([{strokeDasharray: `${L} ${L}`, strokeDashoffset: L}, {strokeDasharray: `${L} ${L}`, strokeDashoffset: 0}], {duration: ms(c === 3 ? 0.5 : 0.45), delay: ms(d), fill: 'backwards', easing: 'ease-in-out'});
    } else {
      const late = c === 3 && e.tagName !== 'line' ? 0.4 : 0;
      e.animate([{opacity: 0}, {opacity: 1}], {duration: ms(c === 2 ? 0.6 : 0.35), delay: ms(d + late), fill: 'backwards', easing: 'ease-out'});
    }
  });
}

/* ---------- MỘT TRẠM DỪNG ---------- */
function station(sec, cfg){
  const st = {id: cfg.id, gate: cfg.gate || 0, done: false, attempts: 0, review: false, items: {}, cfg};
  const foot = sec.querySelector(`.stfoot[data-st="${cfg.id}"]`), fb = foot.querySelector('.stfb');
  const B = a => foot.querySelector(`[data-a=${a}]`);
  cfg.items.forEach(it => {
    const el = sec.querySelector(`[data-it="${cfg.id}:${it.id}"]`), I = {cfg: it, el, ok: false, bad: false, val: null};
    st.items[it.id] = I;
    if (it.kind === 'choice'){
      el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { if (I.ok || I.bad) return; el.querySelectorAll('button').forEach(x => x.removeAttribute('data-state')); b.dataset.state = 'sel'; I.val = +b.dataset.v; }));
    } else {
      const inp = el.querySelector('input');
      inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); check(); } e.stopPropagation(); });
      inp.addEventListener('input', () => { el.removeAttribute('data-state'); });
    }
  });
  const setMark = (I, s) => { if (s) I.el.dataset.state = s; else I.el.removeAttribute('data-state'); I.el.querySelector('.mk').textContent = s === 'ok' ? '✓' : s === 'bad' ? '✗' : ''; };
  const lock = (I, on) => { if (I.cfg.kind === 'choice') I.el.querySelectorAll('button').forEach(b => { b.disabled = on; }); else I.el.querySelector('input').disabled = on; };
  function diag(I, v){
    if (I.cfg.diag){ const d = I.cfg.diag(v); if (d) return d; }
    return I.cfg.why || 'Chưa đúng.';
  }
  const isOk = I => I.cfg.kind === 'choice' ? I.val === I.cfg.ans : near(I.val, I.cfg.ans, I.cfg.tol);
  function check(){
    if (st.done || st.review) return;
    const open = Object.values(st.items).filter(I => !I.ok);
    let empty = false;
    open.forEach(I => { if (I.cfg.kind === 'choice'){ if (I.val === null) empty = true; } else { const raw = I.el.querySelector('input').value; I.val = parseNum(raw); if (raw.trim() === '') empty = true; } });
    if (empty){ fb.className = 'stfb'; fb.innerHTML = 'Con hoàn thành đủ tất cả các ô rồi bấm <b>Kiểm tra</b> nhé.'; return; }
    const notNum = open.find(I => I.cfg.kind !== 'choice' && isNaN(I.val));
    if (notNum){ fb.className = 'stfb'; fb.innerHTML = 'Có ô chưa phải là một số. Ví dụ cách viết: <b>45</b>, <b>1/2</b> hoặc <b>0,96</b>.'; return; }
    const wrong = [];
    open.forEach(I => {
      if (isOk(I)){ I.ok = true; setMark(I, 'ok'); lock(I, true); if (I.cfg.kind === 'choice') I.el.querySelector(`[data-v="${I.val}"]`).dataset.state = 'ok'; }
      else { I.bad = true; setMark(I, 'bad'); lock(I, true); if (I.cfg.kind === 'choice') I.el.querySelector(`[data-v="${I.val}"]`).dataset.state = 'bad'; wrong.push(I); }
    });
    if (!wrong.length){
      st.done = true; fb.className = 'stfb ok'; fb.innerHTML = '<b>✓ Chính xác!</b> Bấm ▶ để học tiếp.';
      B('chk').disabled = true; B('rev').disabled = true; B('rev').classList.remove('pulse'); B('sol').disabled = false;
      if (cfg.onDone) cfg.onDone(sec); gateUI(); document.dispatchEvent(new CustomEvent('station-done', {detail: {id: cfg.id, attempts: st.attempts}})); return;
    }
    st.attempts++; st.review = true;
    fb.className = 'stfb bad'; fb.innerHTML = wrong.map(I => `<span class="why"><b>${I.cfg.name}</b> ${diag(I, I.val)}</span>`).join('') + '<span class="why go">Bấm <b>📖 Xem lại</b>, đọc lại kiến thức rồi làm lại các ô màu đỏ.</span>';
    texAll(fb);
    B('chk').disabled = true; B('rev').disabled = false; B('rev').classList.add('pulse');
  }
  function retry(){
    st.review = false; B('rev').classList.remove('pulse'); B('rev').disabled = true; B('chk').disabled = false;
    if (st.attempts >= (cfg.solAfter || 2)) B('sol').disabled = false;
    let first = null;
    Object.values(st.items).forEach(I => { if (!I.bad) return; I.bad = false; I.val = null; setMark(I, null); lock(I, false);
      if (I.cfg.kind === 'choice') I.el.querySelectorAll('button').forEach(b => b.removeAttribute('data-state')); else { const inp = I.el.querySelector('input'); inp.value = ''; first = first || inp; } });
    fb.className = 'stfb'; fb.innerHTML = 'Làm lại các ô màu đỏ rồi bấm <b>Kiểm tra</b>.' + (st.attempts >= (cfg.solAfter || 2) ? ' Cần thì mở <b>💡 Lời giải chi tiết</b>.' : '');
    if (first) setTimeout(() => first.focus(), 50);
  }
  B('chk').addEventListener('click', check);
  B('rev').addEventListener('click', () => { const keys = Object.values(st.items).filter(I => I.bad).map(I => I.cfg.review || cfg.review); showTheory(keys, retry); });
  B('sol').addEventListener('click', () => openModal(`<div class="tab">💡 LỜI GIẢI CHI TIẾT</div>${cfg.title ? `<h3>${cfg.title}</h3>` : ''}${lis(cfg.items.map(it => cfg.solNoName ? it.sol : `<b class="kw">${it.name}</b> ${it.sol}`))}<div class="row" style="justify-content:flex-end;margin-top:26px"><button class="btn gold" type="button" data-a="close">Đóng</button></div>`));
  return st;
}

/* ================= THỐNG KÊ · MẪU SỐ LIỆU GHÉP NHÓM — thành phần dùng chung (Toán 12 · Chương III) =================
   GT    : bảng số liệu ghép nhóm (ô được tô sáng theo bước ▶ bằng data-hl="k" hoặc "k-j")
   HIST  : biểu đồ tần số ghép nhóm (SVG dựng từ toạ độ thật của các đầu mút)
   STRIP : dải xếp hạng n số liệu → tìm vị trí r·n/4 và nhóm chứa tứ phân vị
   ZOOM  : phóng to nhóm chứa tứ phân vị → nội suy tuyến tính trong nhóm
   DOTS  : mô hình chấm (mỗi chấm một số liệu đặt ở giá trị đại diện) + số trung bình + dải x̄ ± s, sửa được tần số */
const nf = (v, d = 3) => { const r = Math.round(v * 10 ** d) / 10 ** d; return String(r).replace('-', '−').replace('.', ','); };
const grp = (a, i) => `[${nf(a[i])}; ${nf(a[i + 1])})`;
const gcols = a => a.slice(0, -1).map((_, i) => grp(a, i));
const sum = arr => arr.reduce((s, x) => s + x, 0);
/* bảng: head = tên hàng đầu; cols = nhãn các cột; rows = [[tên hàng, [giá trị…]], …]; o.hl = {"r,c": "k" | "k-j"} (r = 0 là hàng tiêu đề) */
function GT(head, cols, rows, o = {}){
  const hl = o.hl || {}, H = (r, c) => hl[r + ',' + c] ? ` data-hl="${hl[r + ',' + c]}"` : '';
  const th = `<tr><th class="rh"${H(0, 'h')}>${head}</th>${cols.map((g, c) => `<th${H(0, c)}>${g}</th>`).join('')}</tr>`;
  const tr = rows.map((r, i) => `<tr><th class="rh"${H(i + 1, 'h')}>${r[0]}</th>${r[1].map((v, c) => `<td${H(i + 1, c)}>${typeof v === 'number' ? nf(v) : v}</td>`).join('')}</tr>`).join('');
  return `<table class="gt${o.cls ? ' ' + o.cls : ''}"${o.style ? ` style="${o.style}"` : ''}>${th}${tr}</table>`;
}
/* khung đề bài (vàng): tag = "Ví dụ 1", "Luyện tập 2"…; parts = các ý a), b), c) — mỗi ý một dòng */
const DE = (tag, html, parts, o = {}) => `<section class="de${o.cls ? ' ' + o.cls : ''}"${o.step ? ` data-step="${o.step}"` : ''}>${tag ? `<span class="tg">${tag}</span>` : ''}<div class="dt">${html}</div>${(parts || []).map(p => `<div class="it">${p}</div>`).join('')}</section>`;

/* ---------- BIỂU ĐỒ TẦN SỐ GHÉP NHÓM ---------- */
function HIST(o){
  const a = o.a, m = o.m, W = o.W || 820, nb = (o.br || []).filter(b => !b.below).length, nbb = (o.br || []).filter(b => b.below).length;
  const L = 78, Rp = 72, T = 40 + 64 * nb + (o.topPad || 0), H = o.H || 440, B = 64 + 54 * nbb + ((o.mk || []).length ? 34 : 0);
  const x0 = o.x0 ?? a[0], x1 = o.x1 ?? a[a.length - 1], ymax = o.ymax || Math.max(...m) + 1, ys = o.ystep || (ymax > 20 ? 5 : ymax > 10 ? 2 : 1);
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - Rp), Y = v => H - B - v / ymax * (H - B - T);
  const st = (s, cls) => `${s ? ` data-step="${s}"` : ''} class="${cls || ''}"`;
  let g = `<svg class="hist fit" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria || 'Biểu đồ tần số ghép nhóm'}">`;
  /* lưới ngang */
  if (!o.flat) for (let v = ys; v <= ymax; v += ys) g += `<line class="hg" x1="${L}" y1="${Y(v)}" x2="${W - Rp + 10}" y2="${Y(v)}"/><text class="ht r" x="${L - 12}" y="${Y(v) + 8}">${v}</text>`;
  /* dải tô (ví dụ: nửa giữa Q1 → Q3; x̄ ± s) */
  (o.band || []).forEach(b => { g += `<g${st(b.step, 'hband ' + (b.cls || ''))}><rect x="${X(b.x0)}" y="${T - 8}" width="${X(b.x1) - X(b.x0)}" height="${Y(0) - T + 8}"/>${b.lab ? `<text class="hl2" x="${(X(b.x0) + X(b.x1)) / 2}" y="${T + 22}">${b.lab}</text>` : ''}</g>`; });
  /* cột */
  m.forEach((v, i) => { const xa = X(a[i]), xb = X(a[i + 1]), cls = (o.cls && o.cls[i]) || o.c || '';
    const s = o.barStep ? o.barStep[i] : 0;
    const hv = o.flat ? ymax * 0.55 : v, lab = o.flat ? (o.flatLab ? o.flatLab(v) : v) : v;
    if (v > 0) g += `<g${st(s, 'hbar ' + cls)}><rect x="${xa + 1.5}" y="${Y(hv)}" width="${xb - xa - 3}" height="${Y(0) - Y(hv)}"/>${o.noVal ? '' : `<text class="hv" x="${(xa + xb) / 2}" y="${o.flat ? (Y(hv) + Y(0)) / 2 + 10 : Y(v) - 10}">${lab}</text>`}</g>`;
    else if (!o.noVal && !o.hideZero) g += `<text class="hv z" x="${(xa + xb) / 2}" y="${Y(0) - 10}">0</text>`; });
  /* trục */
  g += `<line class="hax" x1="${L}" y1="${Y(0)}" x2="${W - Rp + 30}" y2="${Y(0)}"/><polygon class="hah" points="${W - Rp + 44},${Y(0)} ${W - Rp + 26},${Y(0) - 8} ${W - Rp + 26},${Y(0) + 8}"/>`;
  if (!o.flat) g += `<line class="hax" x1="${L}" y1="${Y(0)}" x2="${L}" y2="${T - 22}"/><polygon class="hah" points="${L},${T - 36} ${L - 8},${T - 18} ${L + 8},${T - 18}"/><text class="ht s" x="${L + 16}" y="${T - 22}">${o.yl || 'Tần số'}</text>`;
  g += `<text class="ht xl" x="${W - Rp + 50}" y="${Y(0) + 34}">${o.xl || ''}</text>`;
  const ticks = o.ticks || a;
  ticks.forEach(v => { g += `<line class="hax" x1="${X(v)}" y1="${Y(0)}" x2="${X(v)}" y2="${Y(0) + 8}"/><text class="ht" x="${X(v)}" y="${Y(0) + 34}">${nf(v)}</text>`; });
  /* vạch đánh dấu (Q1, Q3, x̄…) */
  (o.mk || []).forEach(k => { g += `<g${st(k.step, 'hmk ' + (k.cls || ''))}><line x1="${X(k.x)}" y1="${Y(0) + 44}" x2="${X(k.x)}" y2="${T - 4}"/><text x="${X(k.x)}" y="${Y(0) + 70}">${k.lab}</text></g>`; });
  /* ngoặc đo độ dài (R, ΔQ…): trên hình hoặc dưới trục */
  let up = 0, dn = 0;
  (o.br || []).forEach(b => {
    const y = b.below ? Y(0) + 62 + 54 * dn++ : T - 50 - 64 * up++, xa = X(b.x0), xb = X(b.x1), dir = b.below ? -1 : 1;
    g += `<g${st(b.step, 'hbr ' + (b.cls || ''))}><line class="gd" x1="${xa}" y1="${y}" x2="${xa}" y2="${Y(0)}"/><line class="gd" x1="${xb}" y1="${y}" x2="${xb}" y2="${Y(0)}"/>` +
      `<path d="M${xa} ${y + 10 * dir} V${y} H${xb} V${y + 10 * dir}"/><text x="${(xa + xb) / 2}" y="${y - 10}">${b.lab}</text></g>`;
  });
  return g + '</svg>';
}

/* ---------- DẢI XẾP HẠNG: n số liệu xếp tăng dần, mỗi ô một số liệu ---------- */
function STRIP(o){
  const m = o.m, n = sum(m), W = o.W || 1500, ch = o.ch || 56, y = 56, H = o.H || (y + ch + 110), P = 30, cw = (W - 2 * P) / n;
  const st = (s, cls) => `${s ? ` data-step="${s}"` : ''} class="${cls || ''}"`;
  let g = `<svg class="strip fit" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria || 'Dải xếp hạng các số liệu'}">`, c = 0;
  m.forEach((v, i) => {
    const xa = P + c * cw, hs = o.hiGrp && o.hiGrp.find(h => h.p === i);
    if (v > 0){
      g += `<g class="sg g${i % 2}">`; for (let j = 0; j < v; j++) g += `<rect x="${xa + j * cw + 1}" y="${y}" width="${cw - 2}" height="${ch}" rx="3"/>`; g += '</g>';
      if (hs) g += `<rect${st(hs.step, 'shi')} x="${xa - 2}" y="${y - 6}" width="${v * cw + 4}" height="${ch + 12}" rx="8"/>`;
      g += `<text class="sl" x="${xa + v * cw / 2}" y="${y - 18}">${o.labels ? o.labels[i] : ''}</text>`;
    }
    c += v;
    g += `<line class="sb" x1="${P + c * cw}" y1="${y - 6}" x2="${P + c * cw}" y2="${y + ch + 14}"/>`;

}

/* ---------- PHÓNG TO NHÓM CHỨA TỨ PHÂN VỊ: nội suy tuyến tính ---------- */
function ZOOM(o){

  g += `<line class="hax" x1="${P}" y1="${y + ch + 22}" x2="${W - P}" y2="${y + ch + 22}"/>`;

  g += `<g class="zq"${st(o.s2)}><line x1="${xq}" y1="${y - 26}" x2="${xq}" y2="${y + ch + 32}"/><text x="${xq}" y="${y - 36}">${o.lab}</text></g>`;
  g += `<text class="zt"${st(o.s1)} x="${P + Math.max(f * cw / 2, 60)}" y="${y + ch / 2 + 10}">${o.ft || ''}</text>`;

/* ---------- MÔ HÌNH CHẤM: x̄ và dải x̄ ± s (Bài 10) ---------- */
function statOf(a, m){ const x = m.map((_, i) => (a[i] + a[i + 1]) / 2), n = sum(m); if (!n) return {n: 0};
  const mean = sum(m.map((v, i) => v * x[i])) / n, v = sum(m.map((k, i) => k * x[i] * x[i])) / n - mean * mean; return {n, x, mean, v: Math.max(0, v), s: Math.sqrt(Math.max(0, v))}; }
function dotsSVG(o, m){
  const a = o.a, W = o.W || 1000, H = o.H || 400, L = 50, Rp = 50, base = H - 70, r = o.r || 13, x0 = a[0], x1 = a[a.length - 1];
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - Rp), S = statOf(a, m);
  let g = `<svg class="dots fit" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mô hình chấm của mẫu số liệu ghép nhóm">`;
  if (S.n && o.band !== false) g += `<rect class="dband" x="${X(Math.max(x0, S.mean - S.s))}" y="18" width="${X(Math.min(x1, S.mean + S.s)) - X(Math.max(x0, S.mean - S.s))}" height="${base - 18}"/>`;
  m.forEach((v, i) => { const xm = X((a[i] + a[i + 1]) / 2), per = Math.max(1, Math.floor((base - 40) / (2 * r + 3)));
    for (let j = 0; j < v; j++){ const col = Math.floor(j / per), row = j % per; g += `<circle class="dt${o.cls ? ' ' + o.cls[i] : ''}" cx="${xm + (col - (Math.ceil(v / per) - 1) / 2) * (2 * r + 3)}" cy="${base - r - 3 - row * (2 * r + 3)}" r="${r}"/>`; } });
  g += `<line class="hax" x1="${L - 10}" y1="${base}" x2="${W - Rp + 20}" y2="${base}"/>`;
  a.forEach(v => { g += `<line class="hax" x1="${X(v)}" y1="${base}" x2="${X(v)}" y2="${base + 8}"/><text class="ht" x="${X(v)}" y="${base + 36}">${nf(v)}</text>`; });
  if (S.n){ g += `<line class="dmean" x1="${X(S.mean)}" y1="10" x2="${X(S.mean)}" y2="${base}"/>`;
    if (o.band !== false) [S.mean - S.s, S.mean + S.s].forEach((v, k) => { if (v >= x0 && v <= x1) g += `<line class="dsd" x1="${X(v)}" y1="18" x2="${X(v)}" y2="${base}"/>`; });
    g += `<text class="dml" x="${X(S.mean)}" y="${base + 64}">x̄</text>`; }
  return g + '</svg>';
}

/* ================= GIẢI TÍCH · ĐỒ THỊ HÀM SỐ, HÌNH THANG CONG, MÀN HÌNH MÁY TÍNH MÔ PHỎNG (Toán 12 · Chương IV) =================
   PLOT dựng SVG từ toạ độ Toán học: trục có mũi tên, đường cong lấy mẫu dày, miền tô giữa hai đồ thị, đường dóng nét đứt, nhãn có viền halo.
   Mọi phần tử có thể gắn step (hiện theo ▶). */
const PL = {};
function PLOT(o){
  const W = o.W || 800, H = o.H || 500, P = Object.assign({l: 56, r: 56, t: 40, b: 50}, o.pad || {});
  let [x0, x1] = o.x, [y0, y1] = o.y;
  let sx = (W - P.l - P.r) / (x1 - x0), sy = (H - P.t - P.b) / (y1 - y0);
  if (o.eq){ const s = Math.min(sx, sy); sx = sy = s; }
  const ox = P.l + ((W - P.l - P.r) - sx * (x1 - x0)) / 2, oy = P.t + ((H - P.t - P.b) - sy * (y1 - y0)) / 2;
  const X = x => ox + (x - x0) * sx, Y = y => oy + (y1 - y) * sy;
  const st = s => s !== undefined && s !== null ? ` data-step="${s}"` : '';
  const f2 = v => Math.round(v * 10) / 10;
  const lab = (x, y, s, pos = 'ne', cls = '') => { const d = {n: [0, -14, 'middle'], s: [0, 30, 'middle'], e: [14, 9, 'start'], w: [-14, 9, 'end'], ne: [10, -10, 'start'], nw: [-10, -10, 'end'], se: [10, 28, 'start'], sw: [-10, 28, 'end'], c: [0, 9, 'middle']}[pos];
    return `<text class="pl-l ${cls}" x="${f2(X(x) + d[0])}" y="${f2(Y(y) + d[1])}" text-anchor="${d[2]}">${s}</text>`; };
  const path = (f, a, b, n = 260) => { let d = '', pen = false; for (let i = 0; i <= n; i++){ const x = a + (b - a) * i / n, y = f(x);
      if (!isFinite(y) || y < y0 - (y1 - y0) * 0.02 || y > y1 + (y1 - y0) * 0.02){ pen = false; continue; }
      d += (pen ? 'L' : 'M') + f2(X(x)) + ' ' + f2(Y(Math.max(y0, Math.min(y1, y)))); pen = true; } return d; };

    (o.yt || []).forEach(t => { const v = Array.isArray(t) ? t[0] : t; g += `<line class="pl-g" x1="${f2(X(x0))}" y1="${f2(Y(v))}" x2="${f2(X(x1))}" y2="${f2(Y(v))}"/>`; }); }

    for (let i = n; i >= 0; i--){ const x = a + (b - a) * i / n; dn += 'L' + f2(X(x)) + ' ' + f2(Y(Math.max(y0, Math.min(y1, g0(x))))); }
    g += `<g class="pl-fill ${F.cls || ''}"${st(F.step)}><path d="${up + dn}Z"/>${F.lab ? lab(F.lx, F.ly, F.lab, 'c', 'big') : ''}</g>`; });

  (o.poly || []).forEach(Q => { g += `<g class="pl-fill ${Q.cls || ''}"${st(Q.step)}><path d="${Q.pts.map((p, i) => (i ? 'L' : 'M') + f2(X(p[0])) + ' ' + f2(Y(p[1]))).join('')}Z"/>${Q.lab ? lab(Q.lx, Q.ly, Q.lab, 'c', 'big') : ''}</g>`; });
  /* trục */
  const ax = o.ax !== false;
  if (ax){ const yA = Math.max(y0, Math.min(y1, 0)), xA = Math.max(x0, Math.min(x1, 0));
    g += `<line class="pl-ax" x1="${f2(X(x0))}" y1="${f2(Y(yA))}" x2="${f2(X(x1) + 18)}" y2="${f2(Y(yA))}"/><path class="pl-ar" d="M${f2(X(x1) + 30)} ${f2(Y(yA))} l-16 -8 v16 z"/>`;
    g += `<line class="pl-ax" x1="${f2(X(xA))}" y1="${f2(Y(y0))}" x2="${f2(X(xA))}" y2="${f2(Y(y1) - 18)}"/><path class="pl-ar" d="M${f2(X(xA))} ${f2(Y(y1) - 30)} l-8 16 h16 z"/>`;
    g += `<text class="pl-v" x="${f2(X(x1) + 26)}" y="${f2(Y(yA) + 34)}" text-anchor="middle">${o.xl || 'x'}</text><text class="pl-v" x="${f2(X(xA) - 16)}" y="${f2(Y(y1) - 22)}" text-anchor="end">${o.yl || 'y'}</text>`;
    if (x0 <= 0 && x1 >= 0 && y0 <= 0 && y1 >= 0) g += `<text class="pl-v" x="${f2(X(0) - 10)}" y="${f2(Y(0) + 30)}" text-anchor="end">O</text>`;
    (o.xt || []).forEach(t => { const [v, s] = Array.isArray(t) ? t : [t, nf(t)]; if (v === 0) return; g += `<line class="pl-tk" x1="${f2(X(v))}" y1="${f2(Y(yA) - 7)}" x2="${f2(X(v))}" y2="${f2(Y(yA) + 7)}"/><text class="pl-n" x="${f2(X(v))}" y="${f2(Y(yA) + 34)}" text-anchor="middle">${s}</text>`; });
    (o.yt || []).forEach(t => { const [v, s] = Array.isArray(t) ? t : [t, nf(t)]; if (v === 0) return; g += `<line class="pl-tk" x1="${f2(X(xA) - 7)}" y1="${f2(Y(v))}" x2="${f2(X(xA) + 7)}" y2="${f2(Y(v))}"/><text class="pl-n" x="${f2(X(xA) - 14)}" y="${f2(Y(v) + 9)}" text-anchor="end">${s}</text>`; }); }
  /* đường dóng */
  (o.v || []).forEach(L => { g += `<line class="pl-d ${L.cls || ''}"${st(L.step)} x1="${f2(X(L.x))}" y1="${f2(Y(L.a ?? 0))}" x2="${f2(X(L.x))}" y2="${f2(Y(L.b))}"/>`; });
  (o.h || []).forEach(L => { g += `<line class="pl-d ${L.cls || ''}"${st(L.step)} x1="${f2(X(L.a ?? 0))}" y1="${f2(Y(L.y))}" x2="${f2(X(L.b))}" y2="${f2(Y(L.y))}"/>`; });
  /* đường cong */
  (o.c || []).forEach(C => { g += `<g class="pl-c ${C.cls || ''}"${st(C.step)}><path d="${path(C.f, C.d ? C.d[0] : x0, C.d ? C.d[1] : x1, C.n)}"/>${C.lab ? lab(C.lx, C.ly, C.lab, C.pos || 'ne', 'fn') : ''}</g>`; });
  /* điểm */

  /* chữ */
  (o.t || []).forEach(T => { g += `<g${st(T.step)}>${lab(T.x, T.y, T.s, T.pos || 'c', T.cls || '')}</g>`; });
  if (o.extra) g += o.extra(X, Y, sx, sy, st, f2);

}
/* màn hình máy tính cầm tay MÔ PHỎNG (không phải ảnh chụp máy thật) */

/* ================= HÌNH MINH HOẠ CHƯƠNG VI (xác suất) ================= */
/* SƠ ĐỒ HÌNH CÂY 2 tầng. o = {W, H, root, kids:[{lab, p, kids:[{lab, p, leaf}]}], hl:['0-1',...] (nhánh tô vàng), step:{...}}

function TREE(o){
  const W = o.W || 760, H = o.H || 440, n1 = o.kids.length, n2 = o.kids.reduce((s, k) => s + k.kids.length, 0);
  const y0 = 46, y1 = H * 0.46, y2 = H - 70, R = 13, hl = new Set(o.hl || []), st = o.step || {};

  o.kids.forEach((k, i) => {

/* BẢNG DỮ LIỆU THỐNG KÊ 2×2 (ô đầu có đường chéo). o = {row, col, cols:[..], rows:[[tên, a, b], ...], hl:['r0c1', 'c1', 'r1'], sum:true} */

function BOX(o){
  const cls = {x: 'b-x', d: 'b-d', t: 'b-t'}; let s = '';
  o.items.forEach(([c, n]) => { for (let i = 0; i < n; i++){ const g = o.gone && o.gone[c] && i < o.gone[c]; s += `<i class="ball ${cls[c]}${g ? ' gone' : ''}"${g && o.step ? ` data-step="${o.step}"` : ''}></i>`; } });

}

${DE('Luyện tập 2', R`Chứng tỏ rằng nếu ${m('A')} và ${m('B')} là hai biến cố độc lập thì: ${m('P(' + PA + '\\mid B) = P(' + PA + ')')} và ${m('P(A\\mid ' + PB + ') = P(A)')}.`, [], {cls: 'sm'})}
<p class="cap2 xs">🤖 Sử dụng tính chất đã học ở lớp 11: Nếu cặp biến cố ${m('A')} và ${m('B')} độc lập thì các cặp biến cố ${m(PA)} và ${m('B')}; ${m('A')} và ${m(PB)} cũng độc lập.</p>
<div class="qa tight">
  <div class="q"><span>a) Vì ${m(PA)} và ${m('B')} độc lập nên ${m('P(' + PA + 'B)')} bằng</span>${CH('l2', 'a', [m('P(A)\\cdot P(B)'), m('P(' + PA + ')\\cdot P(B)'), m('1 - P(AB)')])}</div>
  <div class="q"><span>b) Do đó ${m('P(' + PA + '\\mid B) = \\dfrac{P(' + PA + 'B)}{P(B)}')} bằng</span>${CH('l2', 'b', [m('P(B)'), m('1 - P(B)'), m('P(' + PA + ')')])}</div>
  <div class="q"><span>c) Tương tự, ${m('P(A\\mid ' + PB + ')')} bằng</span>${CH('l2', 'c', [m('P(A)'), m('P(' + PB + ')'), m('P(A' + PB + ')')])}</div>
</div>${FOOT('l2')}`, note: 'Trạm dừng. P(ĀB) = P(Ā)P(B) ⇒ P(Ā|B) = P(Ā); A, B̄ độc lập ⇒ P(A|B̄) = P(A).',
  init(sec){ addStations(sec, this, [{id: 'l2', review: 'K03', items: [
    {id: 'a', name: 'a)', kind: 'choice', ans: 1, diag: v => [R`Đó là ${m('P(AB)')}; ở đây là cặp ${m(PA)} và ${m('B')}.`, 0, 'Không có quy tắc này.'][v], sol: m('P(' + PA + 'B) = P(' + PA + ')\\cdot P(B)')},
    {id: 'b', name: 'b)', kind: 'choice', ans: 2, diag: v => [R`Tử số là ${m('P(' + PA + ')\\cdot P(B)')}, chia cho ${m('P(B)')}.`, 'Kiểm tra lại phép rút gọn.', 0][v], sol: m('\\dfrac{P(' + PA + ')P(B)}{P(B)} = P(' + PA + ')')},
    {id: 'c', name: 'c)', kind: 'choice', ans: 0, diag: v => [0, R`Biến cố cần tính là ${m('A')}, không phải ${m(PB)}.`, R`Đó là xác suất để cả ${m('A')} và ${m(PB)} cùng xảy ra.`][v], sol: m('P(A\\mid ' + PB + ') = \\dfrac{P(A)P(' + PB + ')}{P(' + PB + ')} = P(A)')}]}]); }});

addSlide({label: 'Ví dụ 3 · Bảng 2 × 2', sec: 1, anchor: 'tb', html: hd(1, 'Ví dụ 3 · Bảng dữ liệu thống kê 2 × 2') + R`
${DE('Ví dụ 3', R`<i>(Bảng dữ liệu thống kê 2 × 2)</i> Một viện nghiên cứu về an toàn giao thông muốn tìm hiểu về mối quan hệ giữa việc thắt dây an toàn khi lái xe và nguy cơ tử vong của người lái xe khi xảy ra tai nạn giao thông. Giả sử viện đã xem xét ${m('577\\,006')} vụ tai nạn giao thông ô tô và việc thắt dây an toàn của người lái xe khi xảy ra tai nạn giao thông. Kết quả cho thấy:<br>• Trong số những người lái xe có thắt dây an toàn, có ${m('510')} người tử vong và ${m('412\\,368')} người sống sót;<br>• Trong số những người lái xe không thắt dây an toàn, có ${m('1\\,601')} người tử vong và ${m('162\\,527')} người sống sót.<br>Kết quả trên được trình bày dưới dạng bảng gồm 2 dòng và 2 cột như dưới đây, được gọi là <b class="gold-t">bảng dữ liệu thống kê 2 × 2</b>.`, [], {cls: 'sm'})}
${TB2({row: 'Thắt dây an toàn', col: 'Kết quả', cols: ['Tử vong', 'Sống sót'], rows: [['Không', 1601, 162527], ['Có', 510, 412368]], step: 1})}`,

</div>`, note: 'Thầy làm mẫu. Ô vàng là n(AB); tổng của hàng “Không” là n(B). Số liệu và kết luận theo SGK tr.67.'});

addSlide({label: '1. Luyện tập 3', sec: 1, html: hd(1, 'Luyện tập 3 · Con tự làm') + R`
${DE('Luyện tập 3', R`Một công ty dược phẩm muốn so sánh tác dụng điều trị bệnh X của hai loại thuốc M và N. Công ty đã tiến hành thử nghiệm với ${m('4\\,000')} bệnh nhân mắc bệnh X trong đó ${m('2\\,400')} bệnh nhân dùng thuốc M, ${m('1\\,600')} bệnh nhân còn lại dùng thuốc N. Kết quả được cho trong bảng dữ liệu thống kê 2 × 2. Chọn ngẫu nhiên một bệnh nhân trong số ${m('4\\,000')} bệnh nhân thử nghiệm sau khi uống thuốc. Tính xác suất để bệnh nhân đó<br>a) uống thuốc M, biết rằng bệnh nhân đó khỏi bệnh;<br>b) uống thuốc N, biết rằng bệnh nhân đó không khỏi bệnh.`, [], {cls: 'sm'})}

  <div class="qa tight">

addSlide({label: '2. HĐ2', sec: 2, anchor: 'm2', html: hd(2, 'HĐ2 · Hình thành công thức nhân xác suất') + R`
${DE('HĐ2', R`Chứng minh rằng, với hai biến cố ${m('A')} và ${m('B')}, ${m('P(B) > 0')}, ta có: ${m('P(AB) = P(B)\\cdot P(A\\mid B)')}.`, [], {cls: 'sm'})}
${STEPS([[R`Theo công thức xác suất có điều kiện: ${m('P(A\\mid B) = \\dfrac{P(AB)}{P(B)}')}`, ''], [R`Nhân hai vế với ${m('P(B) > 0')}: ${m('P(AB) = P(B)\\cdot P(A\\mid B)')}`, 'điều phải chứng minh']], {sm: true})}

addSlide({label: '2. Công thức nhân xác suất', sec: 2, html: hd(2, 'Công thức nhân xác suất') + R`

addSlide({label: '2. Ví dụ 4', sec: 2, html: hd(2, 'Ví dụ 4 · Thầy làm mẫu') + R`

addSlide({label: 'Vận dụng · Ô cửa bí mật', sec: 3, anchor: 'vd', html: hd(3, 'Vận dụng · a) Các xác suất ban đầu') + R`
${DE('Vận dụng', R`Trở lại trò chơi “Ô cửa bí mật” trong tình huống mở đầu. Giả sử người chơi chọn cửa số 1 và người quản trò mở cửa số 3. Kí hiệu ${m('E_1; E_2; E_3')} tương ứng là các biến cố: “Sau ô cửa số 1 có ô tô”; “Sau ô cửa số 2 có ô tô”; “Sau ô cửa số 3 có ô tô” và ${m('H')} là biến cố: “Người quản trò mở ô cửa số 3 thấy con lừa”. Sau khi người quản trò mở cánh cửa số 3 thấy con lừa, tức là khi ${m('H')} xảy ra. Để quyết định thay đổi lựa chọn hay không, người chơi cần so sánh hai xác suất có điều kiện: ${m('P(E_1\\mid H)')} và ${m('P(E_2\\mid H)')}.<br>a) Chứng minh rằng: • ${m('P(E_1) = P(E_2) = P(E_3) = \\dfrac13')}; • ${m('P(H\\mid E_1) = \\dfrac12')} và ${m('P(H\\mid E_2) = 1')}.`, [], {cls: 'xs'})}
