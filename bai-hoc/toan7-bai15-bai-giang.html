/* MR BLACK NBK — DESIGN SYSTEM (kế thừa từ bài giảng Mr Black trước):
   sân khấu cố định 1920×1080 co giãn vừa màn hình · nền xanh đêm + ánh vàng thương hiệu · Chakra Petch · KaTeX nhúng sẵn.
   Bản bài giảng: topbar (thương hiệu – tên phần – thanh 6 pha của dạng toán) · stage (mỗi slide một vấn đề) · bottombar điều hướng. */
:root{
  --stage-a:#070d24; --stage-b:#13245e; --ray:rgba(255,214,102,.05);
  --panel:#0f1a3f; --panel-2:#16245a; --panel-line:#2f4488; --glow:rgba(76,142,255,.35);
  --text:#f5f7fc; --muted:#b4c0e2; --dim:#7f8db8;
  --gold:#ffc83d; --gold-2:#ff9f1c; --gold-ink:#1a1204; --gold-soft:rgba(255,200,61,.14);
  --blue:#4c8eff; --blue-2:#2f6bff; --blue-soft:rgba(76,142,255,.16);
  --ok:#2fd27a; --ok-soft:rgba(47,210,122,.16); --bad:#ff5a5f; --bad-soft:rgba(255,90,95,.16);
  --hint:#ffd166;
  --fig-ink:#f5f7fc; --fig-dim:#9fb0da; --fig-faint:#3a4d8f;
  --pl-a:rgba(76,142,255,.26); --pl-b:rgba(255,200,61,.24); --pl-c:rgba(47,210,122,.22);
  --btn:#1b2a63; --btn-line:#3a55a8; --input-bg:#060b1f;
  --font:"Chakra Petch","Bahnschrift","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans",sans-serif;
  color-scheme:dark;
}
:root[data-mb="light"]{
  --stage-a:#e9eefb; --stage-b:#f8f9fe; --ray:rgba(30,64,175,.035);
  --panel:#ffffff; --panel-2:#f2f5fd; --panel-line:#c6d1ee; --glow:rgba(29,78,216,.12);
  --text:#0d1433; --muted:#3c4870; --dim:#6b7699;
  --gold:#b87a00; --gold-2:#a86400; --gold-ink:#ffffff; --gold-soft:rgba(201,136,0,.12);
  --blue:#1d4ed8; --blue-2:#1e40af; --blue-soft:rgba(29,78,216,.1);
  --ok:#0f8a44; --ok-soft:rgba(15,138,68,.12); --bad:#c62828; --bad-soft:rgba(198,40,40,.1);
  --hint:#8a5a00;
  --fig-ink:#0d1433; --fig-dim:#5b6892; --fig-faint:#c3cde9;
  --pl-a:rgba(29,78,216,.16); --pl-b:rgba(201,136,0,.2); --pl-c:rgba(15,138,68,.16);
  --btn:#ffffff; --btn-line:#b9c6ea; --input-bg:#ffffff;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--stage-a);color:var(--text);font-family:var(--font);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}


/* ĐOÀN TÀU DÃY SỐ · Mr Black NBK
   Thang chữ khóa 3 cỡ: --h 40px (đề mục) · --tx 32px (nội dung) · --sm 24px (nhãn phụ). */
:root{--h:40px;--tx:32px;--sm:24px;--line:1.45}
#viewport{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% -10%,var(--stage-b),var(--stage-a) 70%)}
#canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;font-size:var(--tx);line-height:var(--line)}
.katex{font-size:1.02em;text-transform:none;letter-spacing:normal}
b{font-weight:700}

/* ---------- Thanh trên: thương hiệu + mục lục đề mục ---------- */
.topbar{position:absolute;left:48px;right:48px;top:24px;height:64px;display:flex;align-items:center;gap:28px;z-index:3;transition:opacity .3s,filter .3s}
.brand{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;text-align:left;flex:0 0 auto}
.brand .logo{width:56px;height:56px;position:relative}
.brand .logo svg{width:56px;height:56px;display:block}
.brand .logo img{position:absolute;inset:4px;width:48px;height:48px;object-fit:cover;border-radius:9px}
.brand b{display:block;font-size:var(--sm);line-height:1}
.brand small{display:block;margin-top:5px;font-size:16px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.secs{margin-left:auto;display:flex;align-items:center;gap:0}
.secs span{height:44px;padding:0 18px;display:inline-flex;align-items:center;font-size:20px;font-weight:700;color:var(--dim);border-bottom:3px solid var(--panel-line)}
.secs span.done{color:var(--muted)}
.secs span.cur{color:var(--gold);border-bottom-color:var(--gold)}

.stage{position:absolute;left:48px;right:48px;top:112px;bottom:112px;z-index:2}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;gap:28px}
.watermark{position:absolute;right:0;bottom:0;font-size:110px;font-weight:700;color:var(--text);opacity:.045;pointer-events:none;line-height:1}

/* ---------- ĐỀ MỤC: luôn nổi bật ở đầu mỗi slide ---------- */
.hd{flex:0 0 auto;display:flex;align-items:stretch;gap:0;border-radius:16px;overflow:hidden;border:2px solid var(--gold);background:var(--panel)}
.hd .sn{flex:0 0 auto;min-width:92px;padding:0 22px;display:grid;place-items:center;font-size:var(--h);font-weight:700;color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2))}
.hd .st{flex:0 0 auto;padding:14px 28px;font-size:var(--h);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center}
.hd .ss{flex:1 1 auto;padding:14px 28px;font-size:var(--h);font-weight:700;color:var(--text);display:flex;align-items:center;border-left:2px solid var(--panel-line)}
.lead{margin:0;font-size:var(--tx);font-weight:600;color:var(--muted)}
.lead b{color:var(--text)}

/* ---------- Vùng hình ---------- */
.fig{flex:1 1 auto;min-height:0;display:grid;place-items:center;position:relative}
.fig>svg{display:block;overflow:visible}
.cols{flex:1 1 auto;min-height:0;display:grid;gap:40px;align-items:center}
.muted{color:var(--muted)} .gold-t{color:var(--gold)} .blue-t{color:var(--blue)} .ok-t{color:var(--ok)} .bad-t{color:var(--bad)}
.box{border-radius:18px;border:2px solid var(--panel-line);background:var(--panel);padding:22px 28px}
.cap{display:block;text-align:center;font-size:var(--sm);font-weight:700;color:var(--muted);margin-top:8px}

/* ---------- GHI VỞ: thẻ vở có tab thò ra, nội dung thò thụt ---------- */
.ghi{position:relative;flex:0 0 auto;margin-top:18px;padding:26px 34px 22px 34px;border-radius:0 18px 18px 18px;border:3px solid var(--gold);
  background:repeating-linear-gradient(180deg,transparent 0 45px,rgba(255,200,61,.07) 45px 46px),var(--panel);transition:transform .35s ease,box-shadow .35s ease}
.ghi::before{content:"📝  GHI VỞ";position:absolute;left:-3px;top:-44px;height:44px;padding:0 22px;display:flex;align-items:center;border-radius:12px 12px 0 0;
  font-size:var(--sm);font-weight:700;letter-spacing:.12em;color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2))}
.ghi{cursor:pointer}
.ghi ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ghi li{font-size:var(--tx);font-weight:600;line-height:var(--line);padding-left:36px;position:relative}
.ghi li::before{content:"";position:absolute;left:6px;top:.6em;width:14px;height:14px;border-radius:4px;background:var(--gold)}
.ghi li.l2{padding-left:84px}
.ghi li.l2::before{left:48px;top:.72em;width:20px;height:4px;border-radius:2px;background:var(--muted)}
.ghi .kw{color:var(--gold)}
/* chế độ tập trung ghi chép */
.dimmer{position:absolute;inset:-112px -48px;z-index:5;background:rgba(3,6,18,.74);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .35s}
:root[data-mb="light"] .dimmer{background:rgba(230,235,248,.8)}
.slide.focus .dimmer{opacity:1;pointer-events:auto}
.ghi.spot{z-index:6;transform:scale(1.04);box-shadow:0 0 0 8px var(--gold-soft),0 30px 80px rgba(0,0,0,.45)}
body.focus .topbar,body.focus .bottombar>:not(#next):not(#prev){opacity:.18;filter:blur(2px)}
.focus-tip{position:absolute;right:0;top:-40px;font-size:20px;font-weight:700;color:var(--dim);display:none}
.ghi.spot .focus-tip{display:block}

/* ---------- Thanh dưới ---------- */
.bottombar{position:absolute;left:48px;right:48px;bottom:24px;height:64px;display:flex;align-items:center;gap:14px;z-index:7}
.bottombar>*{transition:opacity .3s,filter .3s}
.nbtn{height:58px;min-width:58px;padding:0 18px;border-radius:10px;border:2px solid var(--btn-line);background:var(--btn);font-size:20px;font-weight:700;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.nbtn:hover:not(:disabled){border-color:var(--gold)}
.nbtn:disabled{opacity:.35;cursor:default}
.nbtn.go{background:linear-gradient(180deg,var(--gold),var(--gold-2));border-color:var(--gold);color:var(--gold-ink);min-width:110px;font-size:var(--sm)}
.nbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.nlabel{font-size:20px;font-weight:700;width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.progress{flex:1;height:10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--panel-line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .3s}
.ncount{font-size:20px;font-weight:700;color:var(--muted);min-width:76px;text-align:right;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:6px;min-width:80px}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--gold)}
.pips i.on{background:var(--gold)}

/* ---------- Thành phần ---------- */
.btn{height:60px;padding:0 26px;border-radius:12px;border:2px solid var(--btn-line);background:var(--btn);font-size:var(--sm);font-weight:700}
.btn:hover{border-color:var(--gold)}
.btn[data-state="ok"]{border-color:var(--ok);background:var(--ok-soft)}
.btn[data-state="ok"]::before{content:"✓ ";color:var(--ok)}
.btn[data-state="bad"]{border-color:var(--bad);border-style:dashed;background:var(--bad-soft)}
.btn[data-state="bad"]::before{content:"✗ ";color:var(--bad)}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.fbk{font-size:var(--sm);font-weight:600;min-height:1.45em;margin:0;text-align:center}
.qa{display:grid;gap:14px;align-content:center}
.qa .q{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:14px 26px;border-radius:14px;border:2px solid var(--panel-line);background:var(--panel);font-size:var(--tx)}
.qa .a{font-weight:700;color:var(--gold)}
.qa .a .katex{color:var(--gold)}
.say{display:grid;gap:14px}
.say>div{font-size:var(--tx);font-weight:600;padding:12px 24px;border-left:6px solid var(--gold);border-radius:0 14px 14px 0;background:var(--panel)}

[data-step]:not(.on){visibility:hidden}
[data-unstep].gone{visibility:hidden}

/* ---------- SVG ---------- */
.rail{stroke:var(--panel-line);stroke-width:5}
.car{fill:var(--panel-2);stroke:var(--blue);stroke-width:3}
.car.last{stroke:var(--gold);stroke-width:5}
.carg.click{cursor:pointer}
.carg.click:hover .car{stroke:var(--gold)}
.carg[data-state="ok"] .car{stroke:var(--ok);stroke-width:5;fill:var(--ok-soft)}
.carg[data-state="bad"] .car{stroke:var(--bad);stroke-dasharray:10 7;fill:var(--bad-soft)}
.wheel{fill:var(--stage-a);stroke:var(--muted);stroke-width:4}
.cpl{stroke:var(--muted);stroke-width:5}
.loco{fill:var(--gold)} .loco2{fill:var(--stage-a)}
.num{font-family:var(--font);font-size:44px;font-weight:700;fill:var(--text)}
.num.q{fill:var(--blue)} .num.ans{fill:var(--gold)}
.lab{font-family:var(--font);font-size:24px;font-weight:600;fill:var(--muted)}
.lab.gold{fill:var(--gold);font-weight:700} .lab.blue{fill:var(--blue)} .lab.ok{fill:var(--ok)} .lab.bad{fill:var(--bad)} .lab.ink{fill:var(--gold-ink);font-weight:700}
.mt{font-family:KaTeX_Math,"Times New Roman",serif;font-style:italic;font-size:28px;fill:var(--blue)}
.mt .sb{font-family:KaTeX_Main,"Times New Roman",serif;font-style:normal}
.dot3{fill:var(--muted)}
.arc{fill:none;stroke:var(--gold);stroke-width:4}
.arrh{fill:var(--gold)}
.axis{stroke:var(--text);stroke-width:3}
.bar{fill:var(--blue)} .bar.g{fill:var(--gold)} .bar.bad{fill:var(--bad)}
.lineM{stroke:var(--gold);stroke-width:4} .linem{stroke:var(--blue);stroke-width:4}
.tunnel{fill:var(--gold-soft)}
.gridl{stroke:var(--panel-line);stroke-width:2;stroke-dasharray:8 6}

/* máy công thức (hình động → lớn) */
.machine{display:grid;grid-template-columns:330px auto 560px auto 330px;align-items:center;justify-content:center;gap:28px}
.machine .io{border-radius:22px;border:3px solid var(--blue);background:var(--blue-soft);padding:34px 20px;text-align:center;font-size:56px;font-weight:700}
.machine .core{border-radius:26px;border:4px solid var(--gold);background:var(--gold-soft);padding:30px 24px 40px;text-align:center;font-size:56px;font-weight:700}
.machine .core small{display:block;font-size:var(--sm);color:var(--gold);letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
.machine .io.out{border-color:var(--gold);background:var(--gold-soft)}
.machine .ar{font-size:56px;color:var(--gold)}
.slider{display:flex;align-items:center;justify-content:center;gap:24px;font-size:var(--tx);font-weight:700}
input[type=range]{accent-color:var(--gold);width:640px;height:34px}

/* 4 cách cho */
.ways{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;align-content:center;flex:1 1 auto}
.way{border-radius:18px;border:2px solid var(--panel-line);background:var(--panel);padding:22px 18px;display:grid;justify-items:center;gap:10px;text-align:center}
.way svg{width:220px;height:130px}
.way b{font-size:var(--tx)}
.way .ex{font-size:var(--sm);font-weight:600;color:var(--muted)}
.way .k{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:var(--sm);font-weight:700;background:linear-gradient(180deg,var(--gold),var(--gold-2));color:var(--gold-ink)}

/* tổng kết */
.map{position:relative;flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 520px 1fr;grid-template-rows:1fr 1fr;gap:28px 40px;align-items:center}
.map>svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.node{position:relative;z-index:1;border-radius:18px;border:2px solid var(--panel-line);background:var(--panel);padding:20px 26px;font-size:var(--sm);font-weight:600;line-height:1.55}
.node b{display:block;font-size:var(--tx);color:var(--gold);margin-bottom:4px}
.node.c{grid-column:2;grid-row:1/3;align-self:center;text-align:center;border:4px solid var(--gold);background:linear-gradient(var(--gold-soft),var(--gold-soft)),var(--panel);font-size:var(--h);font-weight:700;padding:34px 20px}

/* bìa */
.cover{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.cover h1{margin:14px 0 0;font-size:120px;line-height:1;letter-spacing:-.03em}
.cover h1 span{display:block;color:var(--gold)}
.cover .eb{margin:0;font-size:var(--sm);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.cover .sig{margin-top:30px;font-size:var(--sm);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.cover .sig b{color:var(--gold)}
.gvnote{position:absolute;left:0;right:0;bottom:-8px;z-index:8;display:none;padding:10px 18px;border-radius:14px;border:2px dashed var(--gold);background:var(--panel);font-size:20px;font-weight:600;color:var(--muted)}
body.gv .gvnote{display:block}
.menu{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);width:1300px;z-index:9;padding:24px;border-radius:18px;border:2px solid var(--panel-line);background:var(--panel)}
.menu .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu button{text-align:left;padding:14px 18px;border-radius:12px;border:2px solid var(--panel-line);background:var(--btn);font-size:22px;font-weight:700}
.menu button:hover{border-color:var(--gold)}
#nojs{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#0b1024;color:#fff;font:600 18px system-ui,sans-serif}
.js #nojs{display:none}
#rotate{position:fixed;inset:0;z-index:998;display:none;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:rgba(6,9,20,.94);color:#fff;font:600 19px system-ui,sans-serif;text-align:center;padding:28px}
#rotate button{font:700 16px system-ui,sans-serif;background:#ffc83d;border:0;border-radius:10px;padding:10px 18px;color:#0a0c12}
@media (orientation:portrait) and (max-width:900px){.js:not(.keep-portrait) #rotate{display:flex}}
.fade{animation:fd .4s ease-out}
@keyframes fd{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fig{align-content:center;gap:12px}
.chart{display:grid;justify-items:center;gap:14px;font-size:var(--tx)}
.node{font-size:var(--tx);line-height:1.5}
.ghi.spot{transform:scale(1.02)}

/* ===== V4: chữ lớn hơn, hình tự giãn, ghi vở phóng giữa màn hình ===== */
:root{--h:44px;--tx:36px;--sm:28px}
.fig>svg.fit,.fig svg.fit{width:100%;height:100%;display:block}
.fig{min-height:0;min-width:0}
.cols>*{min-height:0;min-width:0}
.cols{align-items:stretch}
.chart{display:grid;grid-template-rows:auto 1fr;justify-items:stretch;text-align:center;min-height:0}
.lead{font-size:var(--tx)}
.lead.big{font-size:var(--h);font-weight:700;color:var(--text);text-align:center}
.ghi{padding:22px 34px 18px}

$('#brand').innerHTML = '<span class="logo">' + LOGO + '<span class="mb">MB</span></span><span><b>Mr Black</b><small>' + LESSON.brandSub + '</small></span>';
function setPhoto(src){
  const logo = $('#brand .logo'); let img = logo.querySelector('img');
  if (!src){ if (img) img.remove(); $('#brand').classList.remove('has-photo'); return; }
  if (!img){ img = document.createElement('img'); img.alt = 'Ảnh giáo viên'; logo.appendChild(img); }
  img.src = src; $('#brand').classList.add('has-photo');
}
(function(){ let saved = ''; try { saved = localStorage.getItem('mrblack-photo') || ''; } catch (e) {} setPhoto(TEACHER_PHOTO || saved); })();
$('#brand').addEventListener('click', () => $('#photo-input').click());
$('#photo-input').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const S = 200, cv = document.createElement('canvas'); cv.width = S; cv.height = S;
      const s = Math.min(im.width, im.height), cx = cv.getContext('2d');
      cx.drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, S, S);
      const url = cv.toDataURL('image/jpeg', .85); setPhoto(url);
      try { localStorage.setItem('mrblack-photo', url); } catch (err) {}
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(f); e.target.value = '';
});

/* ---------- Công thức ---------- */
function texAll(root){
  if (!window.katex) return;
  root.querySelectorAll('.m:not([data-k]),.md:not([data-k])').forEach(e => {
    try { katex.render(e.textContent, e, {displayMode: e.classList.contains('md'), throwOnError: false, strict: false}); e.dataset.k = '1'; } catch (err) {}
  });
}
/* đọc số học sinh nhập: 3/4, -1/2, 0,75, 45°, 0.96 … */
function parseNum(str){

const FIGSEL = '.fig svg, .f3d svg, svg.v2, .map > svg';
function drawCat(e){
  if (e.closest('.f3fill')) return 2;
  if (e.closest('.f3v')) return 3;
  if (e.closest('.f3dot, .f3tick, .f3arc')) return 4;
  if (e.tagName === 'text') return 1;
  return 0;
}
function drawLen(e){
  const n = e.tagName;
  if (n === 'line') return Math.hypot(e.x2.baseVal.value - e.x1.baseVal.value, e.y2.baseVal.value - e.y1.baseVal.value);
  if (n === 'polyline' || n === 'path'){ try { return e.getTotalLength(); } catch (err) { return 0; } }

}
function drawIn(root, range){
  const items = [];
  root.querySelectorAll(FIGSEL).forEach(svg => svg.querySelectorAll('line, polyline, path, polygon, circle, text, rect, ellipse').forEach(e => {
    const st = e.closest('[data-step]');
    if (st && !st.classList.contains('on')) return;
    if (e.closest('[data-unstep].gone')) return;
    if (range){ if (!st) return; const v = +st.dataset.step; if (!(v > range[0] && v <= range[1])) return; }
    items.push({e, c: drawCat(e)});
  }));
  if (!items.length) return;
  items.sort((a, b) => a.c - b.c);
  const cnt = [0, 0, 0, 0, 0]; items.forEach(i => cnt[i.c]++);
  /* nhịp vẽ: trọn hình khoảng 2–4 giây, đủ để lời giảng giới thiệu hình */
  const base = range ? 0 : 1, gap = [Math.min(0.12, 1.4 / Math.max(1, cnt[0])), Math.min(0.05, 0.6 / Math.max(1, cnt[1])), 0.12, range ? 0.25 : 0.4, 0.1];
  let t = 0; const start = [];
  [0, 1, 2, 3, 4].forEach(c => { start[c] = t; if (cnt[c]) t += gap[c] * (cnt[c] - 1) + (c === 0 ? 0.45 : c === 1 ? 0.1 : 0.5); });
  if (cnt[1] && cnt[0]) start[1] = Math.max(0, start[1] - 0.35);
  const seen = [0, 0, 0, 0, 0], grp = new Map();
  items.forEach(({e, c}) => {
    /* các nét trong cùng một vectơ (thân, đầu, nhãn) vẽ liền nhau */
    let d;
    if (c === 3){ const g = e.closest('.f3v'); if (!grp.has(g)) grp.set(g, start[3] + gap[3] * seen[3]++); d = grp.get(g); }
    else d = start[c] + gap[c] * seen[c]++;
    const L = drawLen(e), dashed = e.classList.contains('hid'), ms = x => Math.round(x * 1000);
    if (L > 4 && !dashed && e.tagName !== 'text'){
      e.animate([{strokeDasharray: `${L} ${L}`, strokeDashoffset: L}, {strokeDasharray: `${L} ${L}`, strokeDashoffset: 0}], {duration: ms(c === 3 ? 0.5 : 0.45), delay: ms(d), fill: 'backwards', easing: 'ease-in-out'});
    } else {
      const late = c === 3 && e.tagName !== 'line' ? 0.4 : 0;
      e.animate([{opacity: 0}, {opacity: 1}], {duration: ms(c === 2 ? 0.6 : 0.35), delay: ms(d + late), fill: 'backwards', easing: 'ease-out'});
    }
  });
}

function station(sec, cfg){
  const st = {id: cfg.id, gate: cfg.gate || 0, done: false, attempts: 0, review: false, items: {}, cfg};
  const foot = sec.querySelector(`.stfoot[data-st="${cfg.id}"]`), fb = foot.querySelector('.stfb');
  const B = a => foot.querySelector(`[data-a=${a}]`);
  cfg.items.forEach(it => {
    const el = sec.querySelector(`[data-it="${cfg.id}:${it.id}"]`), I = {cfg: it, el, ok: false, bad: false, val: null};
    st.items[it.id] = I;
    if (it.kind === 'val'){ /* giá trị lấy từ hình tương tác (kéo / chọn trên hình) */ }
    else if (it.kind === 'choice'){
      el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { if (I.ok || I.bad) return; el.querySelectorAll('button').forEach(x => x.removeAttribute('data-state')); b.dataset.state = 'sel'; I.val = +b.dataset.v; }));
    } else {
      const inp = el.querySelector('input');
      inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); check(); } e.stopPropagation(); });
      inp.addEventListener('input', () => { el.removeAttribute('data-state'); });
    }
  });
  const setMark = (I, s) => { if (s) I.el.dataset.state = s; else I.el.removeAttribute('data-state'); I.el.querySelector('.mk').textContent = s === 'ok' ? '✓' : s === 'bad' ? '✗' : ''; };
  const lock = (I, on) => { if (I.cfg.kind === 'val'){ I.cfg.locked = on; if (I.cfg.onLock) I.cfg.onLock(on); return; } if (I.cfg.kind === 'choice') I.el.querySelectorAll('button').forEach(b => { b.disabled = on; }); else I.el.querySelector('input').disabled = on; };
  function diag(I, v){
    if (I.cfg.diag){ const d = I.cfg.diag(v); if (d) return d; }
    return I.cfg.why || 'Chưa đúng.';
  }
  const isOk = I => I.cfg.kind === 'val' ? (I.cfg.ok ? I.cfg.ok(I.val) : near(I.val, I.cfg.ans, I.cfg.tol)) : I.cfg.kind === 'choice' ? I.val === I.cfg.ans : near(I.val, I.cfg.ans, I.cfg.tol);
  function check(){
    if (st.done || st.review) return;
    const open = Object.values(st.items).filter(I => !I.ok);
    let empty = false;
    open.forEach(I => { if (I.cfg.kind === 'val'){ I.val = I.cfg.get(); if (I.val === null || I.val === undefined) empty = true; } else if (I.cfg.kind === 'choice'){ if (I.val === null) empty = true; } else { const raw = I.el.querySelector('input').value; I.val = parseNum(raw); if (raw.trim() === '') empty = true; } });
    if (empty){ fb.className = 'stfb'; fb.innerHTML = 'Con hoàn thành đủ tất cả các ô rồi bấm <b>Kiểm tra</b> nhé.'; return; }
    const notNum = open.find(I => I.cfg.kind !== 'choice' && I.cfg.kind !== 'val' && isNaN(I.val));
    if (notNum){ fb.className = 'stfb'; fb.innerHTML = 'Có ô chưa phải là một số. Ví dụ cách viết: <b>45</b>, <b>1/2</b> hoặc <b>0,96</b>.'; return; }
    const wrong = [];
    open.forEach(I => {
      if (isOk(I)){ I.ok = true; setMark(I, 'ok'); lock(I, true); if (I.cfg.kind === 'choice') I.el.querySelector(`[data-v="${I.val}"]`).dataset.state = 'ok'; }
      else { I.bad = true; setMark(I, 'bad'); lock(I, true); if (I.cfg.kind === 'choice') I.el.querySelector(`[data-v="${I.val}"]`).dataset.state = 'bad'; wrong.push(I); }
    });
    if (!wrong.length){
      st.done = true; fb.className = 'stfb ok'; fb.innerHTML = '<b>✓ Chính xác!</b> Bấm ▶ để học tiếp.';
      B('chk').disabled = true; B('rev').disabled = true; B('rev').classList.remove('pulse'); B('sol').disabled = false;
      if (cfg.onDone) cfg.onDone(sec); gateUI(); document.dispatchEvent(new CustomEvent('station-done', {detail: {id: cfg.id, attempts: st.attempts}})); return;
    }
    st.attempts++; st.review = true;
    fb.className = 'stfb bad'; fb.innerHTML = wrong.slice(0, 2).map(I => `<span class="why"><b>${I.cfg.name}</b> ${diag(I, I.val)}</span>`).join('') + (wrong.length > 2 ? `<span class="why">… và ${wrong.length - 2} ô khác (viền đỏ).</span>` : '') + '<span class="why go">Bấm <b>📖 Xem lại</b>, đọc lại kiến thức rồi làm lại các ô màu đỏ.</span>';
    texAll(fb);
    B('chk').disabled = true; B('rev').disabled = false; B('rev').classList.add('pulse');
  }
  function retry(){
    st.review = false; B('rev').classList.remove('pulse'); B('rev').disabled = true; B('chk').disabled = false;
    if (st.attempts >= (cfg.solAfter || 2)) B('sol').disabled = false;
    let first = null;
    Object.values(st.items).forEach(I => { if (!I.bad) return; I.bad = false; I.val = null; setMark(I, null); lock(I, false);
      if (I.cfg.kind === 'val'){ if (I.cfg.reset) I.cfg.reset(); } else if (I.cfg.kind === 'choice') I.el.querySelectorAll('button').forEach(b => b.removeAttribute('data-state')); else { const inp = I.el.querySelector('input'); inp.value = ''; first = first || inp; } });
    fb.className = 'stfb'; fb.innerHTML = 'Làm lại các ô màu đỏ rồi bấm <b>Kiểm tra</b>.' + (st.attempts >= (cfg.solAfter || 2) ? ' Cần thì mở <b>💡 Lời giải chi tiết</b>.' : '');
    if (first) setTimeout(() => first.focus(), 50);
  }
  B('chk').addEventListener('click', check);
  B('rev').addEventListener('click', () => { const keys = Object.values(st.items).filter(I => I.bad).map(I => I.cfg.review || cfg.review); showTheory(keys, retry); });
  B('sol').addEventListener('click', () => openModal(`<div class="tab">💡 LỜI GIẢI CHI TIẾT</div>${cfg.title ? `<h3>${cfg.title}</h3>` : ''}${lis(cfg.items.map(it => cfg.solNoName ? it.sol : `<b class="kw">${it.name}</b> ${it.sol}`))}<div class="row" style="justify-content:flex-end;margin-top:26px"><button class="btn gold" type="button" data-a="close">Đóng</button></div>`));
  return st;
}

/* ================= TIỆN ÍCH ================= */
const rd = (rows, cls) => `<div class="meas${cls ? ' ' + cls : ''}">${rows.map(([k, lab, cls]) => `<div class="mr${cls ? ' ' + cls : ''}"><span>${lab}</span><b data-r="${k}">—</b></div>`).join('')}</div>`;
const rdSet = (sec, vals) => Object.entries(vals).forEach(([k, v]) => { const e = sec.querySelector(`[data-r="${k}"]`); if (e) e.innerHTML = v; });
const figOf = (sec, k = 0) => FIG2.filter(f => sec.contains(f.box))[k];
/* dòng lời giải: [html, step, cls] ; cls 'in' = thụt vào, 'kq' = kết luận */
const PRF = (rows, cls) => `<div class="prf${cls ? ' ' + cls : ''}">${rows.map(([t, st, c]) => `<div class="pl${c ? ' ' + c : ''}"${st ? ` data-step="${st}"` : ''}>${t}</div>`).join('')}</div>`;
const GTKL = (gt, kl, st, cls) => `<div class="gtkl gk${cls ? ' ' + cls : ''}"${st ? ` data-step="${st}"` : ''}><b>GT</b><span>${gt}</span><b>KL</b><span>${kl}</span></div>`;
const BUB = (who, txt, side) => `<div class="bub ${side || 'l'}"><span class="who">${who}:</span>${txt}</div>`;

/* ---------- HÌNH: tam giác, kí hiệu cạnh/góc bằng nhau ---------- */
/* biến đổi hình (toạ độ px, trục y xuống): quay rot độ (ngược chiều kim đồng hồ), lật ngang mir, rồi tịnh tiến */
const xf = (pts, o = {}) => pts.map(([x, y]) => { if (o.mir) x = -x; const c = Math.cos((o.rot || 0) * D2R), s = Math.sin((o.rot || 0) * D2R), k = o.s || 1; return [(o.dx || 0) + k * (x * c + y * s), (o.dy || 0) + k * (-x * s + y * c)]; });
const ctr = P => [(P[0][0] + P[1][0] + P[2][0]) / 3, (P[0][1] + P[1][1] + P[2][1]) / 3];
/* tam giác: V = {tên: điểm}, names = 3 tên; nhãn đặt ra phía ngoài (từ trọng tâm) */
function tri(G, V, names, o = {}){
  const P = names.map(n => V[n]), c = ctr(P);
  if (o.fill) G.poly(P, {cls: o.fill, step: o.fstep, unstep: o.funstep});
  for (let i = 0; i < 3; i++) G.seg(P[i], P[(i + 1) % 3], {cls: o.cls || ''});
  if (o.labs !== false) names.forEach(n => { const d = (o.off || {})[n] || [0, 0]; G.lab(pol(V[n], angOf(c, V[n]), o.lr || 32), n, {cls: 'pt', dx: d[0], dy: d[1], step: o.lstep}); });
}
/* gạch đánh dấu cạnh bằng nhau: n = 1, 2, 3 gạch hoặc 'x' (dấu ×) */
function tick(G, A, B, n = 1, o = {}){
  const M = lerp2(A, B, o.t ?? .5), d = angOf(A, B), L = o.L || 13, g = {cls: 'mk ' + (o.cls || ''), step: o.step, unstep: o.unstep};
  if (n === 'x'){ G.seg(pol(M, d + 50, L + 2), pol(M, d + 230, L + 2), g); G.seg(pol(M, d - 50, L + 2), pol(M, d + 130, L + 2), g); return; }
  for (let i = 0; i < n; i++){ const c = pol(M, d, (i - (n - 1) / 2) * 9); G.seg(pol(c, d + 90, L), pol(c, d - 90, L), g); }
}
/* cung góc tại P giữa hai tia PQ, PR (luôn lấy góc < 180°) */
function angM(G, P, Q, R, o = {}){ let d1 = angOf(P, Q), d2 = angOf(P, R); if ((d2 - d1 + 360) % 360 > 180) [d1, d2] = [d2, d1]; return G.arc(P, d1, d2, Object.assign({r: 34, cls: 'ink'}, o)); }
/* kí hiệu góc vuông tại P (giữa PQ và PR) */
function rt(G, P, Q, R, o = {}){ return G.right(P, angOf(P, Q), angOf(P, R), Object.assign({s: 22, cls: 'ink'}, o)); }
/* tô một cạnh (nét màu đè lên) */
const hl = (G, A, B, cls, o = {}) => G.seg(A, B, Object.assign({cls}, o));
/* vùng chạm dọc một đoạn thẳng */
function segHit(G, A, B, w, onPick, o){ const d = angOf(A, B), pts = [pol(A, d + 90, w), pol(B, d + 90, w), pol(B, d - 90, w), pol(A, d - 90, w)]; return G.hit({pts}, onPick, o); }

/* tam giác vuông mẫu: góc vuông tại gốc, cạnh góc vuông a (lên trên), b (sang phải) */
const RT0 = (a, b) => [[0, 0], [0, -a], [b, 0]];
/* hai tam giác vuông bằng nhau, đánh dấu theo trường hợp k (0..3); o.v = tên đỉnh [[A,B,C],[D,E,F]] (đỉnh đầu là góc vuông) */
function pairDraw(k, o = {}){
  return (G) => {
    const a = o.a || 120, b = o.b || 170, n = o.v || [['A', 'B', 'C'], ['D', 'E', 'F']];
    const P1 = xf(RT0(a, b), o.t1 || {dx: 60, dy: 175}), P2 = xf(RT0(a, b), o.t2 || {dx: 420, dy: 175, rot: 0, mir: true});
    [P1, P2].forEach((P, j) => {
      const V = {}; n[j].forEach((s, i) => { V[s] = P[i]; });
      tri(G, V, n[j], {fill: o.fill === false ? null : 'grey', labs: o.labs, lr: 28, off: o.off ? o.off[j] : undefined});
      rt(G, P[0], P[1], P[2], {s: 18});
      const c = THC[k];
      if (k === 0){ hl(G, P[0], P[1], c); hl(G, P[0], P[2], c); tick(G, P[0], P[1], 1); tick(G, P[0], P[2], 2); }
      if (k === 1){ hl(G, P[0], P[1], c); tick(G, P[0], P[1], 1); angM(G, P[1], P[0], P[2], {r: 30, cls: c, fill: true}); }
      if (k === 2){ hl(G, P[1], P[2], c); tick(G, P[1], P[2], 2); angM(G, P[2], P[0], P[1], {r: 40, cls: c, fill: true}); }
      if (k === 3){ hl(G, P[1], P[2], c); hl(G, P[0], P[1], c); tick(G, P[1], P[2], 2); tick(G, P[0], P[1], 1); }
    });
  };
}

/* ---------- HAI CHIẾC CỘT VÀ BÓNG NẮNG (mở đầu, Luyện tập 1) ---------- */
const POLE = {gy: 430, H: 300, sh: 200, X: [290, 640]};
function polesDraw(o = {}){
  return (G) => {
    const {gy, H, sh, X} = POLE;
    G.rect(0, gy, 820, 70, {cls: 'ground'});
    G.circ([782, 36], 30, {cls: 'sun'}); G.lab([738, 36], 'Mặt Trời ở rất xa', {cls: 'mut', anchor: 'end'});
    X.forEach((x, i) => {
      const top = [x, gy - H], foot = [x, gy], end = [x - sh, gy];
      if ('tri' in o) G.poly([top, foot, end], {cls: i ? 'green' : 'blue', step: o.tri});
      G.rect(end[0], gy - 7, sh, 14, {cls: 'shade', rx: 7});
      G.arrow(pol(top, angOf(end, top), 90), end, {cls: 'ray', hl: 20, hw: 9});
      G.rect(x - 12, gy - H - 10, 24, H + 10, {cls: 'pole', rx: 10});
      if ('tri' in o){ G.seg(top, foot, {cls: i ? 'green' : 'blue', step: o.tri}); G.seg(foot, end, {cls: i ? 'green' : 'blue', step: o.tri}); G.seg(top, end, {cls: 'thin', step: o.tri}); }
      if ('rt' in o) G.right(foot, 90, 180, {s: 24, cls: 'ink', step: o.rt});
      if ('tk' in o) tick(G, top, foot, 1, {step: o.tk, cls: 'gold', t: .55});
      if ('ang' in o) G.arc(top, angOf(top, end), 270, {r: 54, cls: 'gold', fill: true, step: o.ang});
      if ('q' in o) G.lab([x - sh / 2, gy + 40], '?', {cls: 'big', step: o.q, unstep: o.qx});
      if ('eq' in o){ tick(G, foot, end, 2, {step: o.eq, cls: 'gold'}); if (i) G.lab([(X[0] + X[1]) / 2 - sh / 2, gy + 44], 'hai bóng dài bằng nhau', {cls: 'ok', step: o.eq}); }
    });
  };
}

/* ---------- HÌNH 4.49 (Ví dụ 1) ---------- */
const H49 = (() => { const A = [70, 262], L = 500, al = 30, AB = L * Math.cos(al * D2R), B = pol(A, al, AB), D = pol(A, -al, AB), C = [A[0] + L, A[1]], E = [B[0], A[1]]; return {A, B, C, D, E}; })();
function fig449(o = {}){
  return (G) => {
    const {A, B, C, D, E} = H49;
    if ('f1' in o){ G.poly([B, A, C], {cls: 'blue', step: o.f1, unstep: o.f1x}); G.poly([D, A, C], {cls: 'green', step: o.f1, unstep: o.f1x}); }
    if ('f2' in o){ G.poly([B, A, E], {cls: 'blue', step: o.f2}); G.poly([D, A, E], {cls: 'green', step: o.f2}); }
    G.seg(A, B); G.seg(B, C); G.seg(C, D); G.seg(D, A); G.seg(A, C); G.seg(B, D);
    if (o.hc) hl(G, A, C, 'gold', {step: o.hc, unstep: o.hcx});
    if (o.he) hl(G, A, E, 'gold', {step: o.he});
    if (o.ab){ tick(G, A, B, 1, {step: o.ab}); tick(G, A, D, 1, {step: o.ab}); }
    rt(G, B, A, C); rt(G, D, A, C);
    angM(G, A, B, C, {r: 50}); angM(G, A, C, D, {r: 58});
    if (o.e90) rt(G, E, A, B, {cls: 'gold', step: o.e90, s: 20});
    G.dot(E, {r: 5});
    G.lab([A[0] - 28, A[1]], 'A'); G.lab([C[0] + 28, C[1]], 'C'); G.lab([B[0] + 4, B[1] - 26], 'B'); G.lab([D[0] + 4, D[1] + 28], 'D'); G.lab([E[0] + 22, E[1] - 24], 'E');
  };
}

/* HĐ1 · H.4.45 */
const H45 = {t1: {dx: 120, dy: 360}, t2: {dx: 540, dy: 360}, a: 260, b: 220};
function fig445(o = {}){
  return (G) => {
    [['A', 'B', 'C'], ["A'", "B'", "C'"]].forEach((n, j) => {
      const P = xf(RT0(H45.a, H45.b), j ? H45.t2 : H45.t1), V = {[n[0]]: P[0], [n[1]]: P[1], [n[2]]: P[2]};

}

      G.lab([B[0] + 8, B[1] + 34], n[0]); G.lab([A[0] + 6, A[1] + 34], n[1]); G.lab([C[0] - 10, C[1] - 28], n[2]);

/* Thử thách nhỏ · H.4.55 — hai chiếc thang */
function ladder(G, A, B, o = {}){
  const d = angOf(A, B), L = Math.hypot(B[0] - A[0], B[1] - A[1]), w = 15;
  const a1 = pol(A, d + 90, w), a2 = pol(A, d - 90, w), b1 = pol(B, d + 90, w), b2 = pol(B, d - 90, w);
  G.seg(a1, b1, {cls: 'rail'}); G.seg(a2, b2, {cls: 'rail'});
  for (let t = .1; t < .99; t += .11) G.seg(lerp2(a1, b1, t), lerp2(a2, b2, t), {cls: 'rung'});
}

  get src(){ return this._src; }

    this._stop(); this._src = v || ''; this.buf = null; this.readyState = 0; this.off = 0; this.paused = true; const g = ++this._gen;
    if (!v) return;
    waDecode(v).then(b => { if (g !== this._gen) return; this.buf = b; this.readyState = 4; this._emit('loadedmetadata'); this._emit('canplay'); }).catch(e => console.error('Không giải mã được lời giảng', e));
  }
  get playbackRate(){ return this._rate; }
  set playbackRate(r){ r = +r || 1; if (r === this._rate) return; const was = !this.paused && this.node; if (was) this._stop(); this._rate = r; if (was) this._start(); }
  get duration(){ return this.buf ? this.buf.duration : NaN; }
  get currentTime(){ if (!this.paused && this.node && WA.ctx) return Math.min(this.duration || 0, this.off + (WA.ctx.currentTime - this.t0) * this._rate); return this.off; }
  set currentTime(t){ t = Math.max(0, +t || 0); const was = !this.paused; this._stop(); this.off = t; if (was) this._start(); }
  _stop(){ if (this.node){ const n = this.node; this.node = null; n.onended = null; try { n.stop(); } catch (e) {} if (WA.ctx) this.off = Math.min(this.duration || 0, this.off + (WA.ctx.currentTime - this.t0) * this._rate); } }
  _start(){
    const c = waCtx(); if (!c || !this.buf) return;
    if (this.off >= this.buf.duration - 0.01) this.off = 0;
    const n = c.createBufferSource(); n.buffer = this.buf; n.playbackRate.value = this._rate; n.connect(c.destination);
    n.onended = () => { if (this.node !== n) return; this.node = null; this.off = this.buf.duration; this.paused = true; this._emit('ended'); };
    this.node = n; this.t0 = c.currentTime; n.start(0, this.off); this.paused = false;
  }
  play(){
    const c = waCtx(); if (!c) return Promise.reject(Object.assign(new Error('no audio'), {name: 'NotSupportedError'}));
    if (!this.paused) return Promise.resolve();
    this.paused = false;
    const go = () => new Promise(ok => { if (this.paused) return ok(); this.paused = true; this._start(); ok(); });
    if (this.buf) return go();
    return new Promise((ok, bad) => this.addEventListener('loadedmetadata', () => go().then(ok, bad), {once: true}));
  }
  pause(){ if (this.paused) return; this._stop(); this.paused = true; }
}

/* ================= LỜI GIẢNG CỦA THẦY (audio thu sẵn) =================
   Khi có audio: vào slide là phát lời; các bước hiện theo mốc ►; trạm dừng thì dừng chờ, làm đúng phát đoạn nhận xét;
   ghi vở thì chờ học sinh chạm; hết lời thì tự sang slide sau (trừ Tổng kết và Kết thúc).
   Khi CHƯA gắn audio (bản thiết kế này): bài giảng điều khiển hoàn toàn bằng ▶. */
const HAS_VO = Object.keys(VO_SRC).length > 0;
const VO = {au: new WAudio(), started: false, auto: true, phase: 'idle', slide: -1, raf: 0, timer: 0, recT: null};
VO.au.preload = 'auto';
const voKey = i => 'N' + String(i + 1).padStart(2, '0');
const voData = () => VO_DATA[voKey(S.cur)] || {cues: [], dur: 0};
const VO_MANUAL_END = new Set(slides.map((s, i) => ['Tổng kết', 'Kết thúc'].includes(s.label) ? voKey(i) : null).filter(Boolean));
function voOverride(){ try { const v = localStorage.getItem(LESSON.code + '-cues-' + voKey(S.cur)); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
const voCues = () => voOverride() || voData().cues;
function voLoad(){ if (VO.slide !== S.cur){ VO.au.src = VO_SRC[voKey(S.cur)]; VO.slide = S.cur; } }
function voPlayFrom(t, phase){
  clearTimeout(VO.timer);
  if (!VO_SRC[voKey(S.cur)]){ VO.phase = 'idle'; voUI(); return; }   // slide chưa có lời giảng: điều khiển bằng ▶ như bình thường
  voLoad(); VO.phase = phase;
  const tok = VO.tok = (VO.tok || 0) + 1;
  const start = () => { if (tok !== VO.tok) return; try { VO.au.currentTime = t; } catch (e) {} const p = VO.au.play(); if (p && p.catch) p.catch(err => { if (tok === VO.tok && err && err.name === 'NotAllowedError'){ VO.phase = 'idle'; voUI(); } }); voLoop(); voUI(); };
  if (VO.au.readyState >= 1) start();
  else { const p0 = VO.au.play(); if (p0 && p0.catch) p0.catch(() => {}); VO.au.addEventListener('loadedmetadata', start, {once: true}); }
}
function voStop(phase){ VO.tok = (VO.tok || 0) + 1; VO.au.pause(); cancelAnimationFrame(VO.raf); clearTimeout(VO.timer); VO.phase = phase || 'idle'; voUI(); }
function voLoop(){
  cancelAnimationFrame(VO.raf);
  const tick = () => {
    if (VO.au.paused) return;
    const d = voData(), t = VO.au.currentTime;
    if (VO.phase !== 'rec') voCues().forEach(c => { if (t >= c.t && c.step > S.step && !blocked()) setStep(c.step); });
    if (VO.phase === 'a1' && d.a1End && t >= d.a1End){
      if (blocked()){ VO.au.pause(); VO.phase = 'wait'; voUI(); return; }
      VO.au.currentTime = d.a2Start; VO.phase = 'a2';
    }
    VO.raf = requestAnimationFrame(tick);
  };
  VO.raf = requestAnimationFrame(tick);
}
VO.au.addEventListener('ended', () => { if (VO.phase === 'rec'){ voRecFinish(); return; } VO.phase = 'done'; voUI(); voNext(); });
function voNext(){
  clearTimeout(VO.timer);
  if (!VO.started || !VO.auto || VO.phase !== 'done') return;
  if (S.spot || blocked() || !modal.hidden || backTo >= 0) return;
  const s = slides[S.cur];
  if (S.step < s.max){ VO.timer = setTimeout(() => { if (VO.phase === 'done' && !S.spot && !blocked()) stepFwd(); }, 1200); return; }
  if (VO_MANUAL_END.has(voKey(S.cur)) || S.cur === slides.length - 1) return;
  VO.timer = setTimeout(() => { if (VO.phase === 'done' && !S.spot && !blocked() && modal.hidden) go(S.cur + 1); }, 1500);
}
function voAfterStep(){ if (VO.phase === 'done') voNext(); }
function voOnGo(step){
  VO.au.pause(); cancelAnimationFrame(VO.raf); clearTimeout(VO.timer); VO.phase = 'idle';
  if (VO.skipNext){ VO.skipNext = false; voUI(); return; }
  if (VO.started && VO.auto && (step !== 'end' || backTo >= 0)) voPlayFrom(0, 'a1'); else voUI();
}
function voInterceptFwd(){
  if (VO.phase === 'rec'){ if (S.step >= slides[S.cur].max) return true; VO.recT.push({t: +VO.au.currentTime.toFixed(2), step: S.step + 1}); return false; }
  if (VO.au.paused || !['a1', 'a2'].includes(VO.phase)) return false;
  const t = VO.au.currentTime, c = voCues().find(c => c.step > S.step && c.t > t);
  if (c && !blocked() && (VO.phase !== 'a1' || !voData().a1End || c.t < voData().a1End)){ VO.au.currentTime = c.t; setStep(c.step); return true; }
  voStop('done'); return false;
}
document.addEventListener('station-done', () => {
  const d = voData();
  if (!d.a2Start || !VO.started) return;
  if (VO.phase === 'wait' || (VO.auto && VO.phase !== 'a1')) voPlayFrom(d.a2Start, 'a2');
});
/* ---------- nút điều khiển ---------- */
const voBar = h(HAS_VO ? `<span class="vobar"><button class="nbtn" id="vo-play" type="button" title="Nghe / tạm dừng lời giảng">▶ Nghe</button><button class="nbtn" id="vo-replay" type="button" title="Nghe lại slide này" aria-label="Nghe lại slide này">↺</button><button class="nbtn" id="vo-auto" type="button" aria-pressed="true" title="Tự chạy: phát lời và tự sang slide">Tự chạy: Bật</button><button class="nbtn" id="vo-rec" type="button" title="Chỉnh mốc ► của slide này">⏺ Chỉnh mốc</button></span>`
  : `<span class="vobar"><span class="nomic" title="Bản thiết kế: chưa gắn file thu âm lời giảng">🎙 Chưa gắn lời giảng</span></span>`);
$('#btn-menu').before(voBar);
function voUI(){
  if (!HAS_VO) return;
  const playing = !VO.au.paused && VO.phase !== 'idle';
  $('#vo-play').textContent = VO.phase === 'rec' ? '■ Xong' : playing ? '⏸ Dừng' : '▶ Nghe';
  $('#vo-auto').textContent = 'Tự chạy: ' + (VO.auto ? 'Bật' : 'Tắt'); $('#vo-auto').setAttribute('aria-pressed', String(VO.auto));
  $('#vo-rec').classList.toggle('on', VO.phase === 'rec');
  document.body.classList.toggle('vo-on', playing);
  const vb = document.querySelector('.vostart'); if (vb) vb.textContent = S.cur === 0 && playing ? '🔊 Thầy đang giảng…' : '▶ Bắt đầu học';
}
if (HAS_VO){
  $('#vo-play').addEventListener('click', () => {
    VO.started = true;
    if (VO.phase === 'rec'){ voRecFinish(); return; }
    if (!VO.au.paused){ voStop(S.step >= slides[S.cur].max ? 'done' : 'idle'); return; }
    const d = voData();
    if (VO.slide === S.cur && VO.au.currentTime > 0.2 && VO.au.currentTime < VO.au.duration - 0.2 && VO.phase === 'idle'){
      VO.phase = d.a1End && VO.au.currentTime < d.a1End ? 'a1' : 'a2'; VO.au.play().catch(() => {}); voLoop(); voUI(); return;
    }
    if (VO.phase === 'wait' && !blocked()){ voPlayFrom(d.a2Start, 'a2'); return; }
    voPlayFrom(0, 'a1');
  });
  $('#vo-replay').addEventListener('click', () => { VO.started = true; const k = S.cur; go(k, 0); if (!VO.auto) voPlayFrom(0, 'a1'); });
  $('#vo-auto').addEventListener('click', () => { VO.auto = !VO.auto; VO.started = true; if (!VO.auto) clearTimeout(VO.timer); else voAfterStep(); voUI(); });
  $('#vo-rec').addEventListener('click', () => {
    if (VO.phase === 'rec'){ voRecFinish(); return; }
    VO.started = true; go(S.cur, 0); voStop(); VO.recT = []; voPlayFrom(0, 'rec');
  });
}
function voRecFinish(){
  VO.au.pause(); cancelAnimationFrame(VO.raf);
  const k = voKey(S.cur), marks = VO.recT || []; VO.phase = 'idle'; VO.recT = null; voUI();
  const line = `${k}: ${marks.map(m => m.t.toFixed(1)).join(', ') || '(chưa bấm mốc nào)'}`;
  if (marks.length){ try { localStorage.setItem(LESSON.code + '-cues-' + k, JSON.stringify(marks)); } catch (e) {} }
  const box = openModal(`<div class="tab">⏺ MỐC ► CỦA ${k}</div><h3>Đã ghi ${marks.length} mốc</h3><p class="slab">Máy này sẽ dùng các mốc mới ngay. Để áp dụng cho mọi học sinh, thầy gửi dòng dưới đây cho Claude:</p><pre class="voline">${line}</pre>
    <div class="row" style="justify-content:flex-end;margin-top:22px"><button class="btn" type="button" data-a="reset">Bỏ mốc đã chỉnh</button><button class="btn" type="button" data-a="copy">Sao chép</button><button class="btn gold" type="button" data-a="close">Đóng</button></div>`);
  box.querySelector('[data-a=copy]').addEventListener('click', e => { const b = e.currentTarget; const sel = () => { const r = document.createRange(); r.selectNodeContents(box.querySelector('.voline')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(line).then(() => { b.textContent = 'Đã chép ✓'; }, sel); } catch (err) { sel(); } });
  box.querySelector('[data-a=reset]').addEventListener('click', () => { try { localStorage.removeItem(LESSON.code + '-cues-' + k); } catch (e) {} closeModal(); });
}
const voUnlock = () => { VO.started = true; };
document.addEventListener('pointerdown', voUnlock, {once: true, capture: true});
document.addEventListener('keydown', voUnlock, {once: true, capture: true});
/* nút bắt đầu trên bìa */
(function(){ const c = slides[0].el.querySelector('.cover > div'); if (!c) return;
  const b = h('<button class="btn gold vostart" type="button">▶ Bắt đầu học</button>'); c.appendChild(b);
  b.addEventListener('click', () => { if (!HAS_VO){ go(1); return; } VO.started = true; VO.auto = true; voPlayFrom(0, 'a1'); }); })();
/* bản chưa có lời giảng: ghi rõ trên bìa là bản chờ hoàn thiện */
if (!HAS_VO){ const cv = slides[0].el.querySelector('.cover .cvr'); if (cv) cv.prepend(h('<p class="pending">🎙 Bản chờ hoàn thiện · lời giảng của thầy sẽ được bổ sung</p>')); }
/* bìa: chọn phần học + học tiếp (tiến độ chỉ lưu trên trình duyệt đang dùng) */
const PKEY = LESSON.code + '-prog';
const PROG = (() => { try { const v = JSON.parse(localStorage.getItem(PKEY) || '{}'); return {last: +v.last || 0, done: Array.isArray(v.done) ? v.done : []}; } catch (e) { return {last: 0, done: []}; } })();
const progSave = () => { try { localStorage.setItem(PKEY, JSON.stringify(PROG)); } catch (e) {} };
const PARTS = LESSON.parts;
/* trạm dừng của một phần: các slide từ mốc của phần đó đến mốc phần kế tiếp (hoặc tới Tổng kết) */
const pRange = p => { const j = PARTS.indexOf(p), a = slides.findIndex(s => s.anchor === p.a), nx = PARTS[j + 1] ? slides.findIndex(s => s.anchor === PARTS[j + 1].a) : slides.findIndex(s => s.anchor === 'sum'); return [a, nx < 0 ? slides.length : nx]; };
const stKeys = p => { const [a, b] = pRange(p); return slides.flatMap((s, i) => i >= a && i < b && s.stations ? s.stations.map(t => i + ':' + t.id) : []); };
const startLesson = (n) => { if (HAS_VO){ VO.started = true; VO.auto = true; } go(n); };
const cards = [];
(function(){ const box = slides[0].el.querySelector('.parts'); if (!box) return;
  PARTS.forEach((p, j) => { const k = slides.findIndex(s => s.anchor === p.a);
    const c = h(`<button type="button" class="pcard"><span class="pn">Phần ${j + 1}</span><b>${p.t}</b><span class="pf"><span class="pst"></span>${p.need ? `<span class="pneed">${p.need}</span>` : ''}</span></button>`);
    c.addEventListener('click', () => startLesson(k)); box.appendChild(c); cards.push({c, p}); });
  const cv = slides[0].el.querySelector('.cover > div');
  const r = h('<button class="btn resume" type="button" hidden></button>'); cv.appendChild(r);
  r.addEventListener('click', () => startLesson(PROG.last)); cards.resume = r; })();
function progUI(){
  cards.forEach(({c, p}) => { const ks = stKeys(p), d = ks.filter(k => PROG.done.includes(k)).length, all = d === ks.length && ks.length > 0;
    c.classList.toggle('ok', all); c.querySelector('.pst').textContent = (all ? '✓ ' : '') + `${d}/${ks.length} trạm dừng`; });
  const r = cards.resume; if (!r) return;
  r.hidden = !(PROG.last > 1 && PROG.last < slides.length - 1);
  if (!r.hidden) r.textContent = `↻ Học tiếp · ${slides[PROG.last].label}`;
}
document.addEventListener('station-done', e => { const k = S.cur + ':' + (e.detail && e.detail.id); if (!PROG.done.includes(k)){ PROG.done.push(k); progSave(); } progUI(); });
const go0 = go; go = function(n, step){ go0(n, step); if (S.cur > 0){ PROG.last = S.cur; progSave(); } else progUI(); };
backBtn.addEventListener('pointerdown', () => { VO.skipNext = true; });
backBtn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') VO.skipNext = true; });

slides[0].el.hidden = false; go(0);
window.__lesson = {go, slides, S, fwd, spot, blocked, VO, voData, FIGS, setStep};

})();

</script>

<script>
/* Xoay máy: co giãn lại sân khấu nhiều nhịp sau khi xoay (iPhone/Android báo kích thước mới trễ, nhất là trang nặng) */
(function(){
  var last = '';
  function refit(){ try { window.dispatchEvent(new Event('resize')); } catch (e) {} }
  function burst(){ [0, 120, 300, 600, 1000, 1600].forEach(function(t){ setTimeout(refit, t); }); }
  function check(){ var vv = window.visualViewport, k = (vv ? vv.width + 'x' + vv.height : innerWidth + 'x' + innerHeight); if (k !== last){ last = k; burst(); } }
  window.addEventListener('orientationchange', burst);
  try { if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', burst); } catch (e) {}
  try { var mq = matchMedia('(orientation: portrait)'); if (mq.addEventListener) mq.addEventListener('change', burst); else if (mq.addListener) mq.addListener(burst); } catch (e) {}
  try { if (window.ResizeObserver) new ResizeObserver(check).observe(document.documentElement); } catch (e) {}
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) burst(); });
  window.addEventListener('pageshow', burst);
})();
</script>
