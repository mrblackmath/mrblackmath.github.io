<style>

/* MR BLACK NBK — DESIGN SYSTEM (kế thừa từ bài giảng Mr Black trước):
   sân khấu cố định 1920×1080 co giãn vừa màn hình · nền xanh đêm + ánh vàng thương hiệu · Chakra Petch · KaTeX nhúng sẵn.
   Bản bài giảng: topbar (thương hiệu – tên phần – thanh 6 pha của dạng toán) · stage (mỗi slide một vấn đề) · bottombar điều hướng. */
:root{
  --stage-a:#070d24; --stage-b:#13245e; --ray:rgba(255,214,102,.05);
  --panel:#0f1a3f; --panel-2:#16245a; --panel-line:#2f4488; --glow:rgba(76,142,255,.35);
  --text:#f5f7fc; --muted:#b4c0e2; --dim:#7f8db8;
  --gold:#ffc83d; --gold-2:#ff9f1c; --gold-ink:#1a1204; --gold-soft:rgba(255,200,61,.14);
  --blue:#4c8eff; --blue-2:#2f6bff; --blue-soft:rgba(76,142,255,.16);
  --ok:#2fd27a; --ok-soft:rgba(47,210,122,.16); --bad:#ff5a5f; --bad-soft:rgba(255,90,95,.16);
  --hint:#ffd166;
  --fig-ink:#f5f7fc; --fig-dim:#9fb0da; --fig-faint:#3a4d8f;
  --pl-a:rgba(76,142,255,.26); --pl-b:rgba(255,200,61,.24); --pl-c:rgba(47,210,122,.22);
  --btn:#1b2a63; --btn-line:#3a55a8; --input-bg:#060b1f;
  --font:"Chakra Petch","Bahnschrift","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans",sans-serif;
  color-scheme:dark;
}
:root[data-mb="light"]{
  --stage-a:#e9eefb; --stage-b:#f8f9fe; --ray:rgba(30,64,175,.035);
  --panel:#ffffff; --panel-2:#f2f5fd; --panel-line:#c6d1ee; --glow:rgba(29,78,216,.12);
  --text:#0d1433; --muted:#3c4870; --dim:#6b7699;
  --gold:#b87a00; --gold-2:#a86400; --gold-ink:#ffffff; --gold-soft:rgba(201,136,0,.12);
  --blue:#1d4ed8; --blue-2:#1e40af; --blue-soft:rgba(29,78,216,.1);
  --ok:#0f8a44; --ok-soft:rgba(15,138,68,.12); --bad:#c62828; --bad-soft:rgba(198,40,40,.1);
  --hint:#8a5a00;
  --fig-ink:#0d1433; --fig-dim:#5b6892; --fig-faint:#c3cde9;
  --pl-a:rgba(29,78,216,.16); --pl-b:rgba(201,136,0,.2); --pl-c:rgba(15,138,68,.16);
  --btn:#ffffff; --btn-line:#b9c6ea; --input-bg:#ffffff;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--stage-a);color:var(--text);font-family:var(--font);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}


/* ĐOÀN TÀU DÃY SỐ · Mr Black NBK
   Thang chữ khóa 3 cỡ: --h 40px (đề mục) · --tx 32px (nội dung) · --sm 24px (nhãn phụ). */
:root{--h:40px;--tx:32px;--sm:24px;--line:1.45}
#viewport{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% -10%,var(--stage-b),var(--stage-a) 70%)}
#canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;font-size:var(--tx);line-height:var(--line)}
.katex{font-size:1.02em;text-transform:none;letter-spacing:normal}
b{font-weight:700}

/* ---------- Thanh trên: thương hiệu + mục lục đề mục ---------- */
.topbar{position:absolute;left:48px;right:48px;top:24px;height:64px;display:flex;align-items:center;gap:28px;z-index:3;transition:opacity .3s,filter .3s}
.brand{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;text-align:left;flex:0 0 auto}
.brand .logo{width:56px;height:56px;position:relative}
.brand .logo svg{width:56px;height:56px;display:block}
.brand .logo img{position:absolute;inset:4px;width:48px;height:48px;object-fit:cover;border-radius:9px}
.brand b{display:block;font-size:var(--sm);line-height:1}
.brand small{display:block;margin-top:5px;font-size:16px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.secs{margin-left:auto;display:flex;align-items:center;gap:0}
.secs span{height:44px;padding:0 18px;display:inline-flex;align-items:center;font-size:20px;font-weight:700;color:var(--dim);border-bottom:3px solid var(--panel-line)}
.secs span.done{color:var(--muted)}
.secs span.cur{color:var(--gold);border-bottom-color:var(--gold)}

.stage{position:absolute;left:48px;right:48px;top:112px;bottom:112px;z-index:2}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;gap:28px}
.watermark{position:absolute;right:0;bottom:0;font-size:110px;font-weight:700;color:var(--text);opacity:.045;pointer-events:none;line-height:1}

/* ---------- ĐỀ MỤC: luôn nổi bật ở đầu mỗi slide ---------- */
.hd{flex:0 0 auto;display:flex;align-items:stretch;gap:0;border-radius:16px;overflow:hidden;border:2px solid var(--gold);background:var(--panel)}
.hd .sn{flex:0 0 auto;min-width:92px;padding:0 22px;display:grid;place-items:center;font-size:var(--h);font-weight:700;color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2))}
.hd .st{flex:0 0 auto;padding:14px 28px;font-size:var(--h);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center}
.hd .ss{flex:1 1 auto;padding:14px 28px;font-size:var(--h);font-weight:700;color:var(--text);display:flex;align-items:center;border-left:2px solid var(--panel-line)}
.lead{margin:0;font-size:var(--tx);font-weight:600;color:var(--muted)}
.lead b{color:var(--text)}

/* ---------- Vùng hình ---------- */
.fig{flex:1 1 auto;min-height:0;display:grid;place-items:center;position:relative}
.fig>svg{display:block;overflow:visible}
.cols{flex:1 1 auto;min-height:0;display:grid;gap:40px;align-items:center}
.muted{color:var(--muted)} .gold-t{color:var(--gold)} .blue-t{color:var(--blue)} .ok-t{color:var(--ok)} .bad-t{color:var(--bad)}
.box{border-radius:18px;border:2px solid var(--panel-line);background:var(--panel);padding:22px 28px}
.cap{display:block;text-align:center;font-size:var(--sm);font-weight:700;color:var(--muted);margin-top:8px}

/* ---------- GHI VỞ: thẻ vở có tab thò ra, nội dung thò thụt ---------- */
.ghi{position:relative;flex:0 0 auto;margin-top:18px;padding:26px 34px 22px 34px;border-radius:0 18px 18px 18px;border:3px solid var(--gold);
  background:repeating-linear-gradient(180deg,transparent 0 45px,rgba(255,200,61,.07) 45px 46px),var(--panel);transition:transform .35s ease,box-shadow .35s ease}
.ghi::before{content:"📝  GHI VỞ";position:absolute;left:-3px;top:-44px;height:44px;padding:0 22px;display:flex;align-items:center;border-radius:12px 12px 0 0;
  font-size:var(--sm);font-weight:700;letter-spacing:.12em;color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2))}
.ghi{cursor:pointer}
.ghi ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ghi li{font-size:var(--tx);font-weight:600;line-height:var(--line);padding-left:36px;position:relative}
.ghi li::before{content:"";position:absolute;left:6px;top:.6em;width:14px;height:14px;border-radius:4px;background:var(--gold)}
.ghi li.l2{padding-left:84px}
.ghi li.l2::before{left:48px;top:.72em;width:20px;height:4px;border-radius:2px;background:var(--muted)}
.ghi .kw{color:var(--gold)}
/* chế độ tập trung ghi chép */
.dimmer{position:absolute;inset:-112px -48px;z-index:5;background:rgba(3,6,18,.74);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .35s}
:root[data-mb="light"] .dimmer{background:rgba(230,235,248,.8)}
.slide.focus .dimmer{opacity:1;pointer-events:auto}
.ghi.spot{z-index:6;transform:scale(1.04);box-shadow:0 0 0 8px var(--gold-soft),0 30px 80px rgba(0,0,0,.45)}
body.focus .topbar,body.focus .bottombar>:not(#next):not(#prev){opacity:.18;filter:blur(2px)}
.focus-tip{position:absolute;right:0;top:-40px;font-size:20px;font-weight:700;color:var(--dim);display:none}
.ghi.spot .focus-tip{display:block}

/* ---------- Thanh dưới ---------- */
.bottombar{position:absolute;left:48px;right:48px;bottom:24px;height:64px;display:flex;align-items:center;gap:14px;z-index:7}
.bottombar>*{transition:opacity .3s,filter .3s}
.nbtn{height:58px;min-width:58px;padding:0 18px;border-radius:10px;border:2px solid var(--btn-line);background:var(--btn);font-size:20px;font-weight:700;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.nbtn:hover:not(:disabled){border-color:var(--gold)}
.nbtn:disabled{opacity:.35;cursor:default}
.nbtn.go{background:linear-gradient(180deg,var(--gold),var(--gold-2));border-color:var(--gold);color:var(--gold-ink);min-width:110px;font-size:var(--sm)}
.nbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.nlabel{font-size:20px;font-weight:700;width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.progress{flex:1;height:10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--panel-line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .3s}
.ncount{font-size:20px;font-weight:700;color:var(--muted);min-width:76px;text-align:right;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:6px;min-width:80px}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--gold)}
.pips i.on{background:var(--gold)}

/* ---------- Thành phần ---------- */
.btn{height:60px;padding:0 26px;border-radius:12px;border:2px solid var(--btn-line);background:var(--btn);font-size:var(--sm);font-weight:700}
.btn:hover{border-color:var(--gold)}
.btn[data-state="ok"]{border-color:var(--ok);background:var(--ok-soft)}
.btn[data-state="ok"]::before{content:"✓ ";color:var(--ok)}
.btn[data-state="bad"]{border-color:var(--bad);border-style:dashed;background:var(--bad-soft)}
.btn[data-state="bad"]::before{content:"✗ ";color:var(--bad)}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.fbk{font-size:var(--sm);font-weight:600;min-height:1.45em;margin:0;text-align:center}
.qa{display:grid;gap:14px;align-content:center}
.qa .q{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:14px 26px;border-radius:14px;border:2px solid var(--panel-line);background:var(--panel);font-size:var(--tx)}
.qa .a{font-weight:700;color:var(--gold)}
.qa .a .katex{color:var(--gold)}
.say{display:grid;gap:14px}
.say>div{font-size:var(--tx);font-weight:600;padding:12px 24px;border-left:6px solid var(--gold);border-radius:0 14px 14px 0;background:var(--panel)}

[data-step]:not(.on){visibility:hidden}
[data-unstep].gone{visibility:hidden}

/* ---------- SVG ---------- */
.rail{stroke:var(--panel-line);stroke-width:5}
.car{fill:var(--panel-2);stroke:var(--blue);stroke-width:3}
.car.last{stroke:var(--gold);stroke-width:5}
.carg.click{cursor:pointer}
.carg.click:hover .car{stroke:var(--gold)}
.carg[data-state="ok"] .car{stroke:var(--ok);stroke-width:5;fill:var(--ok-soft)}
.carg[data-state="bad"] .car{stroke:var(--bad);stroke-dasharray:10 7;fill:var(--bad-soft)}
.wheel{fill:var(--stage-a);stroke:var(--muted);stroke-width:4}
.cpl{stroke:var(--muted);stroke-width:5}
.loco{fill:var(--gold)} .loco2{fill:var(--stage-a)}
.num{font-family:var(--font);font-size:44px;font-weight:700;fill:var(--text)}
.num.q{fill:var(--blue)} .num.ans{fill:var(--gold)}
.lab{font-family:var(--font);font-size:24px;font-weight:600;fill:var(--muted)}
.lab.gold{fill:var(--gold);font-weight:700} .lab.blue{fill:var(--blue)} .lab.ok{fill:var(--ok)} .lab.bad{fill:var(--bad)} .lab.ink{fill:var(--gold-ink);font-weight:700}
.mt{font-family:KaTeX_Math,"Times New Roman",serif;font-style:italic;font-size:28px;fill:var(--blue)}
.mt .sb{font-family:KaTeX_Main,"Times New Roman",serif;font-style:normal}
.dot3{fill:var(--muted)}
.arc{fill:none;stroke:var(--gold);stroke-width:4}
.arrh{fill:var(--gold)}
.axis{stroke:var(--text);stroke-width:3}
.bar{fill:var(--blue)} .bar.g{fill:var(--gold)} .bar.bad{fill:var(--bad)}
.lineM{stroke:var(--gold);stroke-width:4} .linem{stroke:var(--blue);stroke-width:4}
.tunnel{fill:var(--gold-soft)}
.gridl{stroke:var(--panel-line);stroke-width:2;stroke-dasharray:8 6}

/* máy công thức (hình động → lớn) */
.machine{display:grid;grid-template-columns:330px auto 560px auto 330px;align-items:center;justify-content:center;gap:28px}
.machine .io{border-radius:22px;border:3px solid var(--blue);background:var(--blue-soft);padding:34px 20px;text-align:center;font-size:56px;font-weight:700}
.machine .core{border-radius:26px;border:4px solid var(--gold);background:var(--gold-soft);padding:30px 24px 40px;text-align:center;font-size:56px;font-weight:700}
.machine .core small{display:block;font-size:var(--sm);color:var(--gold);letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
.machine .io.out{border-color:var(--gold);background:var(--gold-soft)}
.machine .ar{font-size:56px;color:var(--gold)}
.slider{display:flex;align-items:center;justify-content:center;gap:24px;font-size:var(--tx);font-weight:700}
input[type=range]{accent-color:var(--gold);width:640px;height:34px}

/* 4 cách cho */
.ways{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;align-content:center;flex:1 1 auto}
.way{border-radius:18px;border:2px solid var(--panel-line);background:var(--panel);padding:22px 18px;display:grid;justify-items:center;gap:10px;text-align:center}
.way svg{width:220px;height:130px}
.way b{font-size:var(--tx)}
.way .ex{font-size:var(--sm);font-weight:600;color:var(--muted)}
.way .k{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:var(--sm);font-weight:700;background:linear-gradient(180deg,var(--gold),var(--gold-2));color:var(--gold-ink)}

/* tổng kết */
.map{position:relative;flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 520px 1fr;grid-template-rows:1fr 1fr;gap:28px 40px;align-items:center}
.map>svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.node{position:relative;z-index:1;border-radius:18px;border:2px solid var(--panel-line);background:var(--panel);padding:20px 26px;font-size:var(--sm);font-weight:600;line-height:1.55}
.node b{display:block;font-size:var(--tx);color:var(--gold);margin-bottom:4px}
.node.c{grid-column:2;grid-row:1/3;align-self:center;text-align:center;border:4px solid var(--gold);background:linear-gradient(var(--gold-soft),var(--gold-soft)),var(--panel);font-size:var(--h);font-weight:700;padding:34px 20px}

/* bìa */
.cover{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.cover h1{margin:14px 0 0;font-size:120px;line-height:1;letter-spacing:-.03em}
.cover h1 span{display:block;color:var(--gold)}
.cover .eb{margin:0;font-size:var(--sm);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.cover .sig{margin-top:30px;font-size:var(--sm);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.cover .sig b{color:var(--gold)}
.gvnote{position:absolute;left:0;right:0;bottom:-8px;z-index:8;display:none;padding:10px 18px;border-radius:14px;border:2px dashed var(--gold);background:var(--panel);font-size:20px;font-weight:600;color:var(--muted)}
body.gv .gvnote{display:block}
.menu{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);width:1300px;z-index:9;padding:24px;border-radius:18px;border:2px solid var(--panel-line);background:var(--panel)}
.menu .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu button{text-align:left;padding:14px 18px;border-radius:12px;border:2px solid var(--panel-line);background:var(--btn);font-size:22px;font-weight:700}
.menu button:hover{border-color:var(--gold)}
#nojs{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#0b1024;color:#fff;font:600 18px system-ui,sans-serif}
.js #nojs{display:none}
#rotate{position:fixed;inset:0;z-index:998;display:none;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:rgba(6,9,20,.94);color:#fff;font:600 19px system-ui,sans-serif;text-align:center;padding:28px}
#rotate button{font:700 16px system-ui,sans-serif;background:#ffc83d;border:0;border-radius:10px;padding:10px 18px;color:#0a0c12}
@media (orientation:portrait) and (max-width:900px){.js:not(.keep-portrait) #rotate{display:flex}}
.fade{animation:fd .4s ease-out}
@keyframes fd{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fig{align-content:center;gap:12px}
.chart{display:grid;justify-items:center;gap:14px;font-size:var(--tx)}
.node{font-size:var(--tx);line-height:1.5}
.ghi.spot{transform:scale(1.02)}

/* ===== V4: chữ lớn hơn, hình tự giãn, ghi vở phóng giữa màn hình ===== */
:root{--h:44px;--tx:36px;--sm:28px}
.fig>svg.fit,.fig svg.fit{width:100%;height:100%;display:block}
.fig{min-height:0;min-width:0}
.cols>*{min-height:0;min-width:0}
.cols{align-items:stretch}
.chart{display:grid;grid-template-rows:auto 1fr;justify-items:stretch;text-align:center;min-height:0}
.lead{font-size:var(--tx)}
.lead.big{font-size:var(--h);font-weight:700;color:var(--text);text-align:center}
.ghi{padding:22px 34px 18px}
.ghi li{font-size:var(--tx)}
.ghi.spot{transform:none;box-shadow:none}
.spotbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:1560px;max-height:820px;padding:64px 70px 54px;border:4px solid var(--gold);border-radius:28px;
  background:repeating-linear-gradient(180deg,transparent 0 69px,rgba(255,200,61,.08) 69px 70px),var(--panel);box-shadow:0 0 0 12px var(--gold-soft),0 40px 120px rgba(0,0,0,.55);cursor:pointer}
.spotbox .tab{position:absolute;left:-4px;top:-60px;height:60px;padding:0 30px;display:flex;align-items:center;border-radius:16px 16px 0 0;font-size:var(--h);font-weight:700;letter-spacing:.1em;color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2))}
.spotbox ul{list-style:none;margin:0;padding:0;display:grid;gap:18px}

/* đọc số học sinh nhập: 3/4, -1/2, 0,75, 45°, 0.96 … */
function parseNum(str){
  let s = String(str || '').trim().toLowerCase().replace(/[°º]|độ/g, '').replace(/[−–]/g, '-').replace(/\s+/g, '').replace(',', '.');
  if (s === '' || s === '+' || s === '-') return NaN;
  const m = s.match(/^([+-]?\d*\.?\d+)\/([+-]?\d*\.?\d+)$/);
  if (m) return parseFloat(m[1]) / parseFloat(m[2]);
  if (/^[+-]?\d*\.?\d+$/.test(s)) return parseFloat(s);
  return NaN;
}

/* ================= HÌNH KHÔNG GIAN 3D (SVG) =================
   Mô hình: điểm có toạ độ thật (x sang phải, y ra sau, z lên trên) → phép quay quanh trục đứng (yaw)
   + nghiêng camera (pitch) → phép chiếu song song → toạ độ sân khấu.
   Nét khuất tự tính cho khối đa diện lồi: một đoạn được VẼ LIỀN khi nó nằm trên ít nhất một mặt
   hướng về người nhìn; ngược lại là nét đứt (nằm trên mặt khuất hoặc đi xuyên trong khối).
   Đối tượng có thuộc tính free:true (nằm ngoài khối, VD dây cẩu) luôn vẽ liền. */
const V3 = {
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  mul: (a, k) => [a[0] * k, a[1] * k, a[2] * k],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
  mid: (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2]
};
const FIGS = [];
/* tên điểm → nhãn hiển thị: A1 → A′ */
const pname = n => n.replace(/1$/, '′');
function fig3d(cfg){
  const id = 'f3-' + FIGS.length; cfg.id = id; FIGS.push(cfg);
  const W = cfg.w || 760, H = cfg.h || 560;
  cfg.W = W; cfg.H = H;
  return `<div class="f3d" id="${id}" style="--fw:${W}px;--fh:${H}px"><svg viewBox="0 0 ${W} ${H}" class="f3svg" role="img" aria-label="${cfg.aria || 'Hình không gian'}"></svg>` +
    (cfg.rot === false ? '' : `<label class="f3rot" title="Kéo trên hình hoặc kéo thanh này để xoay hình">⟲ <input type="range" min="-40" max="40" step="1" value="0" aria-label="Xoay hình"></label>`) + '</div>';
}
function f3init(root){
  root.querySelectorAll('.f3d').forEach(box => {
    const cfg = FIGS.find(f => f.id === box.id); if (!cfg || cfg.ready) return; cfg.ready = true;
    cfg.box = box; cfg.svg = box.querySelector('svg'); cfg.dyaw = 0;
    cfg.yaw0 = cfg.yaw ?? -28; cfg.pitch = cfg.pitch ?? 18;
    const P = cfg.P;
    /* các mặt: pháp tuyến hướng ra ngoài */
    const allPts = Object.values(P), cen = (cfg.faces || []).length ? (() => { const vs = [...new Set(cfg.faces.flat())].map(n => P[n]); return V3.mul(vs.reduce((s, p) => V3.add(s, p), [0, 0, 0]), 1 / vs.length); })() : [0, 0, 0];
    cfg.F = (cfg.faces || []).map(f => {
      const a = P[f[0]], b = P[f[1]], c = P[f[2]];
      let n = V3.norm(V3.cross(V3.sub(b, a), V3.sub(c, a)));
      const fc = V3.mul(f.map(k => P[k]).reduce((s, p) => V3.add(s, p), [0, 0, 0]), 1 / f.length);
      if (V3.dot(n, V3.sub(fc, cen)) < 0) n = V3.mul(n, -1);
      return {v: f, n, p0: a};
    });
    /* cạnh = các cặp đỉnh kề nhau trên các mặt */
    const es = new Map();
    (cfg.faces || []).forEach(f => f.forEach((k, i) => { const l = f[(i + 1) % f.length], key = [k, l].sort().join('|'); if (!es.has(key)) es.set(key, [k, l]); }));
    (cfg.edges || []).forEach(([a, b]) => { const key = [a, b].sort().join('|'); if (!es.has(key)) es.set(key, [a, b]); });
    cfg.E = [...es.values()].filter(([a, b]) => !(cfg.hideEdges || []).some(([c, d]) => (a === c && b === d) || (a === d && b === c)));
    /* tỉ lệ cố định: khung chứa trọn hình ở mọi góc xoay trong ±40° */
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    const fitPts = allPts.concat(cfg.fitExtra || []);
    for (let d = -(cfg.fitRange ?? 20); d <= (cfg.fitRange ?? 20); d += 5){ fitPts.forEach(p => { const q = f3proj(cfg, p, cfg.yaw0 + d); x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); }); }
    const pad = cfg.pad ?? 34, s = Math.min((cfg.W - 2 * pad) / (x1 - x0), (cfg.H - 2 * pad) / (y1 - y0));
    cfg.s = s; cfg.cx = cfg.W / 2 - s * (x0 + x1) / 2; cfg.cy = cfg.H / 2 + s * (y0 + y1) / 2;
    /* xoay: kéo trên hình hoặc thanh trượt */
    const rng = box.querySelector('.f3rot input');
    const setYaw = d => { cfg.dyaw = Math.max(-40, Math.min(40, d)); if (rng) rng.value = Math.round(cfg.dyaw); f3render(cfg); };
    if (rng) rng.addEventListener('input', () => setYaw(+rng.value));
    if (cfg.rot !== false){
      let drag = null;
      cfg.svg.addEventListener('pointerdown', e => { if (e.target.closest('.f3hit')) return; drag = {x: e.clientX, d: cfg.dyaw}; cfg.svg.setPointerCapture(e.pointerId); box.classList.add('drag'); });
      cfg.svg.addEventListener('pointermove', e => { if (!drag) return; const sc = cfg.svg.getScreenCTM(); const k = sc ? sc.a : 1; setYaw(drag.d + (e.clientX - drag.x) / k * 0.25); });
      const end = () => { drag = null; box.classList.remove('drag'); };
      cfg.svg.addEventListener('pointerup', end); cfg.svg.addEventListener('pointercancel', end);
      cfg.svg.addEventListener('dblclick', () => setYaw(0));
    }
    cfg.setYaw = setYaw;
    f3render(cfg);
  });
}
/* chiếu song song: trả về [X, Y(lên trên), độ sâu về phía người nhìn] */
function f3proj(cfg, p, yawDeg){
  const t = (yawDeg ?? (cfg.yaw0 + cfg.dyaw)) * Math.PI / 180, f = cfg.pitch * Math.PI / 180;
  const xr = p[0] * Math.cos(t) - p[1] * Math.sin(t), yr = p[0] * Math.sin(t) + p[1] * Math.cos(t), zr = p[2];
  return [xr, yr * Math.sin(f) + zr * Math.cos(f), -yr * Math.cos(f) + zr * Math.sin(f)];
}
function f3scr(cfg, p){ const q = f3proj(cfg, p); return [cfg.cx + cfg.s * q[0], cfg.cy - cfg.s * q[1]]; }
/* mặt có hướng về người nhìn không */
function f3front(cfg, F){ const t = cfg.pitch * Math.PI / 180, y = (cfg.yaw0 + cfg.dyaw) * Math.PI / 180;

    if (empty){ fb.className = 'stfb'; fb.innerHTML = 'Con hoàn thành đủ tất cả các ô rồi bấm <b>Kiểm tra</b> nhé.'; return; }
    const notNum = open.find(I => I.cfg.kind !== 'choice' && isNaN(I.val));
    if (notNum){ fb.className = 'stfb'; fb.innerHTML = 'Có ô chưa phải là một số. Ví dụ cách viết: <b>45</b>, <b>1/2</b> hoặc <b>0,96</b>.'; return; }
    const wrong = [];
    open.forEach(I => {
      if (isOk(I)){ I.ok = true; setMark(I, 'ok'); lock(I, true); if (I.cfg.kind === 'choice') I.el.querySelector(`[data-v="${I.val}"]`).dataset.state = 'ok'; }
      else { I.bad = true; setMark(I, 'bad'); lock(I, true); if (I.cfg.kind === 'choice') I.el.querySelector(`[data-v="${I.val}"]`).dataset.state = 'bad'; wrong.push(I); }
    });
    if (!wrong.length){
      st.done = true; fb.className = 'stfb ok'; fb.innerHTML = '<b>✓ Chính xác!</b> Bấm ▶ để sang nhiệm vụ tiếp theo.';
      B('chk').disabled = true; B('rev').disabled = true; B('rev').classList.remove('pulse'); B('sol').disabled = false;
      if (cfg.onDone) cfg.onDone(sec); gateUI(); document.dispatchEvent(new CustomEvent('station-done', {detail: {id: cfg.id, attempts: st.attempts}})); return;
    }
    st.attempts++; st.review = true;
    fb.className = 'stfb bad'; fb.innerHTML = wrong.map(I => `<span class="why"><b>${I.cfg.name}</b> ${diag(I, I.val)}</span>`).join('') + '<span class="why go">Bấm <b>📖 Xem lại</b>, đọc lại kiến thức rồi làm lại các ô màu đỏ.</span>';
    texAll(fb);
    B('chk').disabled = true; B('rev').disabled = false; B('rev').classList.add('pulse');
  }
  function retry(){
    st.review = false; B('rev').classList.remove('pulse'); B('rev').disabled = true; B('chk').disabled = false;
    if (st.attempts >= (cfg.solAfter || 2)) B('sol').disabled = false;
    let first = null;
    Object.values(st.items).forEach(I => { if (!I.bad) return; I.bad = false; I.val = null; setMark(I, null); lock(I, false);
      if (I.cfg.kind === 'choice') I.el.querySelectorAll('button').forEach(b => b.removeAttribute('data-state')); else { const inp = I.el.querySelector('input'); inp.value = ''; first = first || inp; } });
    fb.className = 'stfb'; fb.innerHTML = 'Làm lại các ô màu đỏ rồi bấm <b>Kiểm tra</b>.' + (st.attempts >= (cfg.solAfter || 2) ? ' Cần thì mở <b>💡 Lời giải chi tiết</b>.' : '');
    if (first) setTimeout(() => first.focus(), 50);
  }
  B('chk').addEventListener('click', check);
  B('rev').addEventListener('click', () => { const keys = Object.values(st.items).filter(I => I.bad).map(I => I.cfg.review || cfg.review); showTheory(keys, retry); });
  B('sol').addEventListener('click', () => openModal(`<div class="tab">💡 LỜI GIẢI CHI TIẾT</div>${cfg.title ? `<h3>${cfg.title}</h3>` : ''}${lis(cfg.items.map(it => cfg.solNoName ? it.sol : `<b class="kw">${it.name}</b> ${it.sol}`))}<div class="row" style="justify-content:flex-end;margin-top:26px"><button class="btn gold" type="button" data-a="close">Đóng</button></div>`));
  return st;
}
function addStations(sec, o, list){ o.stations = list.map(c => station(sec, c)); }
const blocked = () => { if (S.teacher) return false; const s = slides[S.cur]; return !!(s.stations && s.stations.some(t => !t.done && S.step >= t.gate)); };
const lockChip = h('<span class="lockchip" hidden>🔒 Làm đúng trạm dừng để đi tiếp</span>');
$('#next').before(lockChip);
function gateUI(){
  const s = slides[S.cur], b = blocked();
  lockChip.hidden = !b;
  $('#next').disabled = b || (S.cur === slides.length - 1 && S.step >= s.max);
}
/* ================= THỐNG KÊ · MẪU SỐ LIỆU GHÉP NHÓM — thành phần dùng chung (Toán 12 · Chương III) =================
   GT    : bảng số liệu ghép nhóm (ô được tô sáng theo bước ▶ bằng data-hl="k" hoặc "k-j")
   HIST  : biểu đồ tần số ghép nhóm (SVG dựng từ toạ độ thật của các đầu mút)
   STRIP : dải xếp hạng n số liệu → tìm vị trí r·n/4 và nhóm chứa tứ phân vị
   ZOOM  : phóng to nhóm chứa tứ phân vị → nội suy tuyến tính trong nhóm
   DOTS  : mô hình chấm (mỗi chấm một số liệu đặt ở giá trị đại diện) + số trung bình + dải x̄ ± s, sửa được tần số */
const nf = (v, d = 3) => { const r = Math.round(v * 10 ** d) / 10 ** d; return String(r).replace('-', '−').replace('.', ','); };
const grp = (a, i) => `[${nf(a[i])}; ${nf(a[i + 1])})`;
const gcols = a => a.slice(0, -1).map((_, i) => grp(a, i));
const sum = arr => arr.reduce((s, x) => s + x, 0);
/* bảng: head = tên hàng đầu; cols = nhãn các cột; rows = [[tên hàng, [giá trị…]], …]; o.hl = {"r,c": "k" | "k-j"} (r = 0 là hàng tiêu đề) */
function GT(head, cols, rows, o = {}){
  const hl = o.hl || {}, H = (r, c) => hl[r + ',' + c] ? ` data-hl="${hl[r + ',' + c]}"` : '';
  const th = `<tr><th class="rh"${H(0, 'h')}>${head}</th>${cols.map((g, c) => `<th${H(0, c)}>${g}</th>`).join('')}</tr>`;
  const tr = rows.map((r, i) => `<tr><th class="rh"${H(i + 1, 'h')}>${r[0]}</th>${r[1].map((v, c) => `<td${H(i + 1, c)}>${typeof v === 'number' ? nf(v) : v}</td>`).join('')}</tr>`).join('');
  return `<table class="gt${o.cls ? ' ' + o.cls : ''}"${o.style ? ` style="${o.style}"` : ''}>${th}${tr}</table>`;
}
/* khung đề bài (vàng): tag = "Ví dụ 1", "Luyện tập 2"…; parts = các ý a), b), c) — mỗi ý một dòng */
const DE = (tag, html, parts, o = {}) => `<section class="de${o.cls ? ' ' + o.cls : ''}"${o.step ? ` data-step="${o.step}"` : ''}>${tag ? `<span class="tg">${tag}</span>` : ''}<div class="dt">${html}</div>${(parts || []).map(p => `<div class="it">${p}</div>`).join('')}</section>`;

/* ---------- BIỂU ĐỒ TẦN SỐ GHÉP NHÓM ---------- */
function HIST(o){
  const a = o.a, m = o.m, W = o.W || 820, nb = (o.br || []).filter(b => !b.below).length, nbb = (o.br || []).filter(b => b.below).length;
  const L = 78, Rp = 72, T = 40 + 64 * nb + (o.topPad || 0), H = o.H || 440, B = 64 + 54 * nbb + ((o.mk || []).length ? 34 : 0);
  const x0 = o.x0 ?? a[0], x1 = o.x1 ?? a[a.length - 1], ymax = o.ymax || Math.max(...m) + 1, ys = o.ystep || (ymax > 20 ? 5 : ymax > 10 ? 2 : 1);
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - Rp), Y = v => H - B - v / ymax * (H - B - T);
  const st = (s, cls) => `${s ? ` data-step="${s}"` : ''} class="${cls || ''}"`;
  let g = `<svg class="hist fit" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria || 'Biểu đồ tần số ghép nhóm'}">`;
  /* lưới ngang */
  if (!o.flat) for (let v = ys; v <= ymax; v += ys) g += `<line class="hg" x1="${L}" y1="${Y(v)}" x2="${W - Rp + 10}" y2="${Y(v)}"/><text class="ht r" x="${L - 12}" y="${Y(v) + 8}">${v}</text>`;
  /* dải tô (ví dụ: nửa giữa Q1 → Q3; x̄ ± s) */
  (o.band || []).forEach(b => { g += `<g${st(b.step, 'hband ' + (b.cls || ''))}><rect x="${X(b.x0)}" y="${T - 8}" width="${X(b.x1) - X(b.x0)}" height="${Y(0) - T + 8}"/>${b.lab ? `<text class="hl2" x="${(X(b.x0) + X(b.x1)) / 2}" y="${T + 22}">${b.lab}</text>` : ''}</g>`; });
  /* cột */
  m.forEach((v, i) => { const xa = X(a[i]), xb = X(a[i + 1]), cls = (o.cls && o.cls[i]) || o.c || '';
    const s = o.barStep ? o.barStep[i] : 0;
    const hv = o.flat ? ymax * 0.55 : v, lab = o.flat ? (o.flatLab ? o.flatLab(v) : v) : v;
    if (v > 0) g += `<g${st(s, 'hbar ' + cls)}><rect x="${xa + 1.5}" y="${Y(hv)}" width="${xb - xa - 3}" height="${Y(0) - Y(hv)}"/>${o.noVal ? '' : `<text class="hv" x="${(xa + xb) / 2}" y="${o.flat ? (Y(hv) + Y(0)) / 2 + 10 : Y(v) - 10}">${lab}</text>`}</g>`;
    else if (!o.noVal && !o.hideZero) g += `<text class="hv z" x="${(xa + xb) / 2}" y="${Y(0) - 10}">0</text>`; });
  /* trục */
  g += `<line class="hax" x1="${L}" y1="${Y(0)}" x2="${W - Rp + 30}" y2="${Y(0)}"/><polygon class="hah" points="${W - Rp + 44},${Y(0)} ${W - Rp + 26},${Y(0) - 8} ${W - Rp + 26},${Y(0) + 8}"/>`;
  if (!o.flat) g += `<line class="hax" x1="${L}" y1="${Y(0)}" x2="${L}" y2="${T - 22}"/><polygon class="hah" points="${L},${T - 36} ${L - 8},${T - 18} ${L + 8},${T - 18}"/><text class="ht s" x="${L + 16}" y="${T - 22}">${o.yl || 'Tần số'}</text>`;
  g += `<text class="ht xl" x="${W - Rp + 50}" y="${Y(0) + 34}">${o.xl || ''}</text>`;
  const ticks = o.ticks || a;
  ticks.forEach(v => { g += `<line class="hax" x1="${X(v)}" y1="${Y(0)}" x2="${X(v)}" y2="${Y(0) + 8}"/><text class="ht" x="${X(v)}" y="${Y(0) + 34}">${nf(v)}</text>`; });
  /* vạch đánh dấu (Q1, Q3, x̄…) */
  (o.mk || []).forEach(k => { g += `<g${st(k.step, 'hmk ' + (k.cls || ''))}><line x1="${X(k.x)}" y1="${Y(0) + 44}" x2="${X(k.x)}" y2="${T - 4}"/><text x="${X(k.x)}" y="${Y(0) + 70}">${k.lab}</text></g>`; });
  /* ngoặc đo độ dài (R, ΔQ…): trên hình hoặc dưới trục */
  let up = 0, dn = 0;
  (o.br || []).forEach(b => {
    const y = b.below ? Y(0) + 62 + 54 * dn++ : T - 50 - 64 * up++, xa = X(b.x0), xb = X(b.x1), dir = b.below ? -1 : 1;
    g += `<g${st(b.step, 'hbr ' + (b.cls || ''))}><line class="gd" x1="${xa}" y1="${y}" x2="${xa}" y2="${Y(0)}"/><line class="gd" x1="${xb}" y1="${y}" x2="${xb}" y2="${Y(0)}"/>` +
      `<path d="M${xa} ${y + 10 * dir} V${y} H${xb} V${y + 10 * dir}"/><text x="${(xa + xb) / 2}" y="${y - 10}">${b.lab}</text></g>`;
  });
  return g + '</svg>';
}

/* ---------- DẢI XẾP HẠNG: n số liệu xếp tăng dần, mỗi ô một số liệu ---------- */
function STRIP(o){
  const m = o.m, n = sum(m), W = o.W || 1500, ch = o.ch || 56, y = 56, H = o.H || (y + ch + 110), P = 30, cw = (W - 2 * P) / n;
  const st = (s, cls) => `${s ? ` data-step="${s}"` : ''} class="${cls || ''}"`;
  let g = `<svg class="strip fit" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria || 'Dải xếp hạng các số liệu'}">`, c = 0;
  m.forEach((v, i) => {
    const xa = P + c * cw, hs = o.hiGrp && o.hiGrp.find(h => h.p === i);
    if (v > 0){
      g += `<g class="sg g${i % 2}">`; for (let j = 0; j < v; j++) g += `<rect x="${xa + j * cw + 1}" y="${y}" width="${cw - 2}" height="${ch}" rx="3"/>`; g += '</g>';
      if (hs) g += `<rect${st(hs.step, 'shi')} x="${xa - 2}" y="${y - 6}" width="${v * cw + 4}" height="${ch + 12}" rx="8"/>`;
      g += `<text class="sl" x="${xa + v * cw / 2}" y="${y - 18}">${o.labels ? o.labels[i] : ''}</text>`;
    }
    c += v;
    g += `<line class="sb" x1="${P + c * cw}" y1="${y - 6}" x2="${P + c * cw}" y2="${y + ch + 14}"/>`;
    if (v > 0 || i === 0) g += `<text class="sc${o.cumStep ? '' : ''}" x="${P + c * cw}" y="${y + ch + 44}"${o.cumStep ? ` data-step="${o.cumStep}"` : ''}>${c}</text>`;
  });
  g += `<text class="sc" x="${P}" y="${y + ch + 44}">0</text>`;
  (o.pos || []).forEach(p => { const x = P + p.t * cw;
    g += `<g${st(p.step, 'spos ' + (p.cls || ''))}><line x1="${x}" y1="${y - 4}" x2="${x}" y2="${y + ch + 62}"/><polygon points="${x},${y + ch + 56} ${x - 11},${y + ch + 76} ${x + 11},${y + ch + 76}"/><text x="${x}" y="${y + ch + 104 + (p.dy || 0)}">${p.lab}</text></g>`; });
  return g + '</svg>';
}

/* ---------- PHÓNG TO NHÓM CHỨA TỨ PHÂN VỊ: nội suy tuyến tính ---------- */
function ZOOM(o){
  const W = o.W || 900, H = o.H || 250, P = 70, y = 70, ch = 60, cw = (W - 2 * P) / o.mp, f = (o.t - o.c), xq = P + f * cw;
  const st = s => s ? ` data-step="${s}"` : '';
  let g = `<svg class="zoom fit" viewBox="0 0 ${W} ${H}" role="img" aria-label="Nội suy trong nhóm chứa tứ phân vị">`;
  for (let j = 0; j < o.mp; j++) g += `<rect class="zc" x="${P + j * cw + 2}" y="${y}" width="${cw - 4}" height="${ch}" rx="5"/>`;
  g += `<rect class="zf"${st(o.s1)} x="${P + 2}" y="${y + 6}" width="${Math.max(0, xq - P - 4)}" height="${ch - 12}" rx="4"/>`;
  g += `<line class="hax" x1="${P}" y1="${y + ch + 22}" x2="${W - P}" y2="${y + ch + 22}"/>`;
  [[P, o.a0], [W - P, o.a1]].forEach(([x, v]) => { g += `<line class="hax" x1="${x}" y1="${y + ch + 12}" x2="${x}" y2="${y + ch + 32}"/><text class="ht" x="${x}" y="${y + ch + 62}">${nf(v)}</text>`; });
  g += `<g class="zq"${st(o.s2)}><line x1="${xq}" y1="${y - 26}" x2="${xq}" y2="${y + ch + 32}"/><text x="${xq}" y="${y - 36}">${o.lab}</text></g>`;
  g += `<text class="zt"${st(o.s1)} x="${P + Math.max(f * cw / 2, 60)}" y="${y + ch / 2 + 10}">${o.ft || ''}</text>`;
  g += `<text class="ht mut" x="${W / 2}" y="${y + ch + 62}">${o.cap || ''}</text>`;
  return g + '</svg>';
}

/* ---------- DỰ ĐOÁN (không chấm điểm): chọn một ý, ghi nhớ để kiểm chứng sau ---------- */
const PRED_SEL = {};
const PRED = (id, opts) => `<span class="pred" data-pred="${id}" role="group">${opts.map((o, k) => `<button type="button" class="btn" data-v="${k}">${o}</button>`).join('')}</span>`;
document.addEventListener('click', e => { const b = e.target.closest('.pred button'); if (!b) return; const g = b.closest('.pred');
  g.querySelectorAll('button').forEach(x => x.removeAttribute('data-state')); b.dataset.state = 'sel'; PRED_SEL[g.dataset.pred] = +b.dataset.v;
  document.querySelectorAll(`[data-pred-echo="${g.dataset.pred}"]`).forEach(x => { x.textContent = b.textContent; }); });

/* ---------- MÔ HÌNH CHẤM: x̄ và dải x̄ ± s (Bài 10) ---------- */
function statOf(a, m){ const x = m.map((_, i) => (a[i] + a[i + 1]) / 2), n = sum(m); if (!n) return {n: 0};
  const mean = sum(m.map((v, i) => v * x[i])) / n, v = sum(m.map((k, i) => k * x[i] * x[i])) / n - mean * mean; return {n, x, mean, v: Math.max(0, v), s: Math.sqrt(Math.max(0, v))}; }
function dotsSVG(o, m){
  const a = o.a, W = o.W || 1000, H = o.H || 400, L = 50, Rp = 50, base = H - 70, r = o.r || 13, x0 = a[0], x1 = a[a.length - 1];
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - Rp), S = statOf(a, m);
  let g = `<svg class="dots fit" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mô hình chấm của mẫu số liệu ghép nhóm">`;
  if (S.n && o.band !== false) g += `<rect class="dband" x="${X(Math.max(x0, S.mean - S.s))}" y="18" width="${X(Math.min(x1, S.mean + S.s)) - X(Math.max(x0, S.mean - S.s))}" height="${base - 18}"/>`;
  m.forEach((v, i) => { const xm = X((a[i] + a[i + 1]) / 2), per = Math.max(1, Math.floor((base - 40) / (2 * r + 3)));
    for (let j = 0; j < v; j++){ const col = Math.floor(j / per), row = j % per; g += `<circle class="dt${o.cls ? ' ' + o.cls[i] : ''}" cx="${xm + (col - (Math.ceil(v / per) - 1) / 2) * (2 * r + 3)}" cy="${base - r - 3 - row * (2 * r + 3)}" r="${r}"/>`; } });
  g += `<line class="hax" x1="${L - 10}" y1="${base}" x2="${W - Rp + 20}" y2="${base}"/>`;
  a.forEach(v => { g += `<line class="hax" x1="${X(v)}" y1="${base}" x2="${X(v)}" y2="${base + 8}"/><text class="ht" x="${X(v)}" y="${base + 36}">${nf(v)}</text>`; });
  if (S.n){ g += `<line class="dmean" x1="${X(S.mean)}" y1="10" x2="${X(S.mean)}" y2="${base}"/>`;
    if (o.band !== false) [S.mean - S.s, S.mean + S.s].forEach((v, k) => { if (v >= x0 && v <= x1) g += `<line class="dsd" x1="${X(v)}" y1="18" x2="${X(v)}" y2="${base}"/>`; });
    g += `<text class="dml" x="${X(S.mean)}" y="${base + 64}">x̄</text>`; }
  return g + '</svg>';
}
/* ================= HÌNH MINH HOẠ CHƯƠNG VI (xác suất) ================= */
/* SƠ ĐỒ HÌNH CÂY 2 tầng. o = {W, H, root, kids:[{lab, p, kids:[{lab, p, leaf}]}], hl:['0-1',...] (nhánh tô vàng), step:{...}}
   Nhãn xác suất là KaTeX đặt trên lớp HTML phủ. */
function TREE(o){
  const W = o.W || 760, H = o.H || 440, n1 = o.kids.length, n2 = o.kids.reduce((s, k) => s + k.kids.length, 0);
  const y0 = 46, y1 = H * 0.46, y2 = H - 70, R = 13, hl = new Set(o.hl || []), st = o.step || {};
  const leafX = i => W * (i + 0.5) / n2;
  let svg = '', lab = '', li = 0;
  const x0 = W / 2;
  const pos = (x, y) => `left:${(x / W * 100).toFixed(2)}%;top:${(y / H * 100).toFixed(2)}%`;
  o.kids.forEach((k, i) => {
    const xs = k.kids.map((_, j) => leafX(li + j)), x1 = (xs[0] + xs[xs.length - 1]) / 2;
    const on1 = [...hl].some(h => h.startsWith(i + '-') || h === String(i)), s1 = st[i] ? ` data-step="${st[i]}"` : '';
    svg += `<g${s1}><line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" class="tr-l${on1 ? ' hl' : ''}"/>`;
    k.kids.forEach((c, j) => { const on = hl.has(i + '-' + j), s2 = st[i + '-' + j] ? ` data-step="${st[i + '-' + j]}"` : '';
      svg += `<g${s2}><line x1="${x1}" y1="${y1}" x2="${xs[j]}" y2="${y2}" class="tr-l${on ? ' hl' : ''}"/><circle cx="${xs[j]}" cy="${y2}" r="${R}" class="tr-n ${c.cls || ''}"/></g>`;
      const mx = (x1 + xs[j]) / 2, my = (y1 + y2) / 2;
      lab += `<span class="tr-p ${xs[j] < x1 ? 'l' : 'r'}${on ? ' hl' : ''}" style="${pos(mx + (xs[j] < x1 ? -8 : 8), my)}"${s2}>${c.p}</span>`;
      lab += `<span class="tr-lab leaf" style="${pos(xs[j], y2 + 26)}"${s2}>${c.lab}${c.leaf ? `<small>${c.leaf}</small>` : ''}</span>`; });
    svg += `<circle cx="${x1}" cy="${y1}" r="${R}" class="tr-n ${k.cls || ''}"/></g>`;
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    lab += `<span class="tr-p ${x1 < x0 ? 'l' : 'r'}${on1 ? ' hl' : ''}" style="${pos(mx + (x1 < x0 ? -10 : 10), my)}"${s1}>${k.p}</span>`;
    lab += `<span class="tr-lab ${x1 < x0 ? 'l' : 'r'}" style="${pos(x1 + (x1 < x0 ? -22 : 22), y1)}"${s1}>${k.lab}</span>`;
    li += k.kids.length; });

  const path = (f, a, b, n = 260) => { let d = '', pen = false; for (let i = 0; i <= n; i++){ const x = a + (b - a) * i / n, y = f(x);
      if (!isFinite(y) || y < y0 - (y1 - y0) * 0.02 || y > y1 + (y1 - y0) * 0.02){ pen = false; continue; }

    (o.yt || []).forEach(t => { const v = Array.isArray(t) ? t[0] : t; g += `<line class="pl-g" x1="${f2(X(x0))}" y1="${f2(Y(v))}" x2="${f2(X(x1))}" y2="${f2(Y(v))}"/>`; }); }

const RULE = {n: ITEMS.length, enough: 13, pass: 11, objPct: 0.5};

/* ================= TỰ KIỂM TRA · KHUNG CHUNG =================
   Trong khi làm: không gợi ý, không lí thuyết, không phản hồi. Sau khi nộp: điểm, phân tích, bản đồ kiến thức/mục tiêu, đường ôn lại. */
const AVATAR = TEACHER_PHOTO ? `<img src="${TEACHER_PHOTO}" alt="Thầy Mr Black"><span class="mb">MB</span>` : LOGO;
const T = {state: 'NOT_STARTED', v: 'A', ans: {}, t0: 0, tEnd: 0, attempt: 1};
const NSEC = SECS.length - 1;
addSlide({label: 'Bìa', sec: -1, anchor: 'start', html: R`
<div class="cover"><div>
  <div class="avatar">${AVATAR}</div>
  <p class="eb" style="margin-top:26px">${COVER_A.eb}</p>
  <h1>${COVER_A.h1 || 'Kiểm tra'}<span>${COVER_A.title}</span></h1>
  <p class="sig">${COVER_A.sig || 'Đánh giá cuối chương'} <b>Mr Black NBK</b></p></div>
  <div class="cvr2"><div class="rules"><b>Quy định</b>
    <span>${ITEMS.length} câu · thời gian gợi ý ${COVER_A.mins} phút (không khoá giờ). Được dùng máy tính cầm tay.</span>
    <span>Trong khi làm: <b>không gợi ý, không xem lí thuyết, không báo đúng/sai</b>. Con có thể sửa đáp án trước khi nộp.</span>
    <span>Sau khi bấm <b>Nộp bài</b>: điểm, đúng/sai từng câu, bản đồ kiến thức và mục tiêu, kết luận và gợi ý phần cần ôn.</span>
    <span><b>ĐÃ ĐẠT YÊU CẦU</b> khi đúng từ <b>${RULE.pass}/${ITEMS.length}</b> câu và mỗi mục tiêu đúng ít nhất một nửa số câu của mục tiêu đó. Trả lời dưới ${RULE.enough} câu hoặc bỏ trống cả một mục tiêu: <b>CHƯA ĐỦ DỮ LIỆU ĐỂ KẾT LUẬN</b>.</span>
    <span>Nhập số: dùng dấu phẩy hoặc dấu chấm, ví dụ <b>33,25</b>; làm tròn theo yêu cầu của câu.</span></div></div>
</div>`, note: 'Đáp án từng câu hiện ở “Gợi ý GV” khi bật chế độ Giáo viên. Kết quả chỉ nằm trên trình duyệt đang dùng, không gửi về máy chủ. Ngưỡng ' + RULE.pass + '/' + ITEMS.length + ' và ' + RULE.enough + ' câu tối thiểu do thầy điều chỉnh trong RULE nếu cần.'});
const qHTML = (it, V) => {
  const d = it[V], ctl = it.kind === 'choice'
    ? `<div class="aopts${d.one ? ' one' : ''}" data-q="${it.id}" data-v="${V}">${d.opts.map((o, k) => `<button type="button" class="btn opt" data-k="${k}"><b>${'ABCD'[k]}.</b> ${o}</button>`).join('')}</div>`
    : `<label class="anum" data-q="${it.id}" data-v="${V}">Đáp số: <input type="text" inputmode="text" autocomplete="off" spellcheck="false" aria-label="Đáp số câu ${it.id}">${d.unit ? `<small>${d.unit}</small>` : ''}</label>`;
  const inner = `<div class="aq">${d.q}</div>${ctl}<div class="asol" hidden></div>`;
  return `<div class="avar" data-var="${V}"><div class="avb${d.fig ? ' wfig' : ''}">${d.fig ? `<div class="fig">${d.fig}</div><div class="rc">${inner}</div>` : inner}</div></div>`;
};
ITEMS.forEach((it, i) => {
  addSlide({label: `Câu ${i + 1}`, sec: it.sec, anchor: i === 0 ? 'q1' : null, item: it,
    html: hd(it.sec, `Câu ${i + 1} / ${ITEMS.length}`) + `<div class="abody">${qHTML(it, 'A')}${qHTML(it, 'B')}</div>`,
    note: $('#btn-gv').disabled ? '' : `Đề A: <b>${it.kind === 'choice' ? 'ABCD'[it.A.ans] : vn(it.A.ans)}</b> · Đề B: <b>${it.kind === 'choice' ? 'ABCD'[it.B.ans] : vn(it.B.ans)}</b> · ${it.k.join(', ')} · ${it.obj}`});

/* ================= ĐIỀU HƯỚNG ================= */
const secsEl = $('#secs'); SECS.forEach(t => { const s = document.createElement('span'); s.textContent = t; secsEl.appendChild(s); });
function go(n, step = 0){
  n = Math.max(0, Math.min(slides.length - 1, n));
  slides[S.cur].el.hidden = true; S.cur = n; const s = slides[n]; s.el.hidden = false; s.el.classList.remove('fade'); void s.el.offsetWidth; s.el.classList.add('fade');
  $('#nlabel').textContent = s.label; $('#ncount').textContent = `${n + 1} / ${slides.length}`;
  $('#pbar').style.width = (n / (slides.length - 1) * 100) + '%'; $('#prev').disabled = n === 0;
  [...secsEl.children].forEach((e, j) => { e.className = j === s.sec ? 'cur' : (j < s.sec ? 'done' : ''); });
  secsEl.style.visibility = s.sec < 0 ? 'hidden' : 'visible';
  $('#menu').hidden = true; modal.hidden = true; setStep(step === 'end' ? s.max : step);
  if (s.item && T.state === 'NOT_STARTED'){ T.state = 'IN_PROGRESS'; T.t0 = Date.now(); }
  if (s.anchor === 'submit') renderSubmit();
  if (s.anchor === 'res') renderRes();
  $('#next').disabled = n === slides.length - 1 || (s.anchor === 'submit' && T.state !== 'ANALYZED');
}
const fwd = () => { if (S.cur < slides.length - 1 && !(slides[S.cur].anchor === 'submit' && T.state !== 'ANALYZED')) go(S.cur + 1); };
const back = () => { if (S.cur > 0) go(S.cur - 1); };
const goAnchor = a => { const k = slides.findIndex(s => s.anchor === a); if (k >= 0) go(k); };
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) goAnchor(b.dataset.go); });
$('#next').addEventListener('click', fwd); $('#prev').addEventListener('click', back);
document.addEventListener('keydown', e => {
  if (e.target.closest('input')){ if (e.key === 'Enter'){ e.target.blur(); fwd(); } return; }
  if (['ArrowRight', 'PageDown'].includes(e.key)){ fwd(); e.preventDefault(); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)){ back(); e.preventDefault(); }
  else if (e.key === 'Escape'){ $('#menu').hidden = true; if (!modal.hidden) closeModal(); }
});
$('#btn-menu').textContent = '☰ Bảng câu hỏi';
$('#btn-menu').addEventListener('click', () => { renderMenu(); $('#menu').hidden = !$('#menu').hidden; });
$('#btn-fs').addEventListener('click', () => { try { if (document.fullscreenElement || document.webkitFullscreenElement) { const x = document.exitFullscreen || document.webkitExitFullscreen; const p = x.call(document); if (p && p.catch) p.catch(() => {}); } else { const r = document.documentElement, q = r.requestFullscreen || r.webkitRequestFullscreen; if (!q) { window.mbFsHint(); return; } const p = q.call(r); if (p && p.catch) p.catch(() => {}); } } catch (e) {} });
document.addEventListener('fullscreenchange', () => setTimeout(fit, 60));
$('#btn-gv').addEventListener('click', () => { if ($('#btn-gv').disabled) return; S.teacher = !S.teacher; document.body.classList.toggle('gv', S.teacher); $('#btn-gv').setAttribute('aria-pressed', String(S.teacher)); });
let light = document.documentElement.getAttribute('data-mb') === 'light';
const themeLabel = () => { $('#btn-theme').textContent = light ? 'Nền: Sáng' : 'Nền: Tối'; }; themeLabel();
$('#btn-theme').addEventListener('click', () => { light = !light; if (light) document.documentElement.setAttribute('data-mb', 'light'); else document.documentElement.removeAttribute('data-mb'); themeLabel(); });
const clock = h('<span class="aclock" aria-live="off">⏱ 00:00</span>'); $('#ncount').after(clock);
setInterval(() => { if (T.state === 'IN_PROGRESS'){ const s = Math.floor((Date.now() - T.t0) / 1000); clock.textContent = `⏱ ${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; } }, 1000);

/* ================= BÀI LÀM ================= */
const key = (id, V) => id + V;
function setVariant(V){ T.v = V; document.body.dataset.var = V; }
document.addEventListener('click', e => {
  const b = e.target.closest('.aopts .opt'); if (!b || T.state === 'SUBMITTED' || T.state === 'ANALYZED') return;
  const box = b.closest('.aopts'); box.querySelectorAll('.opt').forEach(x => x.removeAttribute('data-state')); b.dataset.state = 'sel';
  T.ans[key(box.dataset.q, box.dataset.v)] = +b.dataset.k;
});
document.addEventListener('input', e => {
  const l = e.target.closest('.anum'); if (!l) return;
  const raw = e.target.value.trim(); const k = key(l.dataset.q, l.dataset.v);
  if (raw === '') delete T.ans[k]; else T.ans[k] = raw;
});
const given = it => T.ans[key(it.id, T.v)];
const answered = it => given(it) !== undefined;
function isRight(it){
  const g = given(it), d = it[T.v]; if (g === undefined) return false;
  if (it.kind === 'choice') return g === d.ans;
  const x = parseNum(g); return !isNaN(x) && near(x, d.ans, d.tol ?? 1e-9);
}
function renderMenu(){
  const mn = $('#menu'); mn.innerHTML = `<div class="agrid">${ITEMS.map((it, i) => `<button type="button" class="${answered(it) ? 'done' : ''}" data-q="${i}">${i + 1}</button>`).join('')}</div><div class="row" style="justify-content:flex-end;gap:10px;margin-top:14px"><button type="button" class="btn" data-go="start">Bìa</button><button type="button" class="btn gold" data-go="submit">Nộp bài</button></div>`;
  mn.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => go(1 + +b.dataset.q)));
}
function renderSubmit(){
  const box = $('#asub'), n = ITEMS.filter(answered).length, miss = ITEMS.map((it, i) => answered(it) ? null : i + 1).filter(Boolean);
  if (T.state === 'ANALYZED'){ box.innerHTML = `<p class="lead">Con đã nộp bài. Xem <b>Kết quả</b> ở trang sau.</p><div class="row"><button class="btn gold" type="button" data-go="res">Xem kết quả</button></div>`; return; }
  box.innerHTML = `<p class="lead big">Đã trả lời <b class="gold-t">${n}/${ITEMS.length}</b> câu.</p>
    ${miss.length ? `<p class="lead">Còn để trống: ${miss.map(k => `<button type="button" class="btn sm" data-q="${k - 1}">Câu ${k}</button>`).join(' ')}</p>` : '<p class="lead">Con đã trả lời đủ các câu.</p>'}
    <div class="agrid big">${ITEMS.map((it, i) => `<button type="button" class="${answered(it) ? 'done' : ''}" data-q="${i}">${i + 1}</button>`).join('')}</div>
    <div class="row" style="justify-content:center;margin-top:24px"><button class="btn gold big" type="button" data-a="submit">Nộp bài</button></div>
    <p class="lead c sm" id="asubmsg"></p>`;
  box.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => go(1 + +b.dataset.q)));
  box.querySelector('[data-a=submit]').addEventListener('click', e => {
    const b = e.currentTarget;
    if (miss.length && !b.dataset.sure){ b.dataset.sure = 1; b.textContent = 'Vẫn nộp bài'; $('#asubmsg').textContent = `Còn ${miss.length} câu để trống. Bấm “Vẫn nộp bài” nếu con chắc chắn.`; return; }
    submit();
  });
}
function submit(){
  T.state = 'SUBMITTED'; T.tEnd = Date.now();
  document.querySelectorAll('.anum input').forEach(i => { i.disabled = true; });
  document.querySelectorAll('.aopts .opt').forEach(b => { b.disabled = true; });
  ITEMS.forEach((it, i) => {
    const sl = slides[1 + i].el, wrap = sl.querySelector(`.avar[data-var="${T.v}"]`), ok = isRight(it), d = it[T.v];
    if (it.kind === 'choice'){ wrap.querySelectorAll('.opt').forEach(b => { const k = +b.dataset.k; if (k === d.ans) b.dataset.state = 'ok'; else if (k === given(it)) b.dataset.state = 'bad'; }); }
    else { const inp = wrap.querySelector('input'); inp.closest('.anum').dataset.state = ok ? 'ok' : 'bad'; }
    const sol = wrap.querySelector('.asol'); sol.hidden = false;
    sol.innerHTML = `<b class="${ok ? 'okt' : 'badt'}">${ok ? '✓ Đúng' : answered(it) ? '✗ Chưa đúng' : '— Bỏ trống'}</b> · Đáp án: <b>${it.kind === 'choice' ? 'ABCD'[d.ans] : (d.show || vn(d.ans))}</b><br>${d.sol}`;
    texAll(sol);
  });
  T.state = 'ANALYZED'; goAnchor('res');
}
function pct(a, b){ return b ? Math.round(100 * a / b) : 0; }
function renderRes(){
  const box = $('#ares');
  if (T.state !== 'ANALYZED'){ box.innerHTML = `<p class="lead">Con chưa nộp bài.</p><div class="row"><button class="btn gold" type="button" data-go="submit">Đến trang nộp bài</button></div>`; return; }
  const N = ITEMS.length, right = ITEMS.filter(isRight).length, nAns = ITEMS.filter(answered).length;
  const objs = Object.keys(OBJ).map(o => { const its = ITEMS.filter(it => it.obj === o); return {o, n: its.length, a: its.filter(answered).length, r: its.filter(isRight).length}; });
  const ks = Object.keys(THEORY).map(k => { const its = ITEMS.filter(it => it.k.includes(k)); return {k, n: its.length, r: its.filter(isRight).length}; }).filter(x => x.n);
  const enough = nAns >= RULE.enough && objs.every(x => x.a > 0);
  const pass = right >= RULE.pass && objs.every(x => x.r >= RULE.objPct * x.n);
  const verdict = !enough ? ['CHƯA ĐỦ DỮ LIỆU ĐỂ KẾT LUẬN', 'mid', `Con mới trả lời ${nAns}/${N} câu${objs.some(x => !x.a) ? ' và còn mục tiêu chưa có câu trả lời' : ''}. Hãy làm lại để có kết luận.`]
    : pass ? ['ĐÃ ĐẠT YÊU CẦU', 'ok', `Con đã đạt các mục tiêu của ${COVER_A.short}.`] : ['CHƯA ĐẠT YÊU CẦU', 'bad', `Cần đúng từ ${RULE.pass}/${N} câu và mỗi mục tiêu đúng ít nhất một nửa. Ôn lại ${COVER_A.revWhere || 'các mục trong Slide tổng hợp'}, luyện lại các nhiệm vụ gợi ý rồi làm đề tương đương.`];
  const weak = ks.filter(x => x.r < x.n);
  const mins = T.t0 ? Math.max(1, Math.round((T.tEnd - T.t0) / 60000)) : 1;
  box.innerHTML = `<div class="rtop"><div class="score"><b>${right}</b><span>/${N}</span></div><div class="verd ${verdict[1]}"><b>${verdict[0]}</b><span>${verdict[2]}</span><i>Đề ${T.v} · lần làm ${T.attempt} · khoảng ${mins} phút</i></div>
      <div class="row" style="flex-direction:column;gap:10px"><button class="btn gold" type="button" data-a="retry">↻ Làm đề tương đương</button><button class="btn" type="button" data-q="0">Xem lại từng câu</button></div></div>
    <div class="rgrid">
      <div class="rbox"><h4>Từng câu</h4><div class="ritems">${ITEMS.map((it, i) => `<button type="button" data-q="${i}" class="${isRight(it) ? 'ok' : answered(it) ? 'bad' : 'skip'}" title="${it.k.join(', ')}">${i + 1}<i>${isRight(it) ? '✓' : answered(it) ? '✗' : '–'}</i></button>`).join('')}</div>
        <h4 style="margin-top:12px">Mục tiêu</h4>${objs.map(x => `<div class="rbar"><span><b>${x.o}</b> ${OBJ[x.o]}</span><em>${x.r}/${x.n}</em><i style="--p:${pct(x.r, x.n)}%" class="${x.r >= RULE.objPct * x.n ? 'ok' : 'bad'}"></i></div>`).join('')}</div>
      <div class="rbox"><h4>Kiến thức cần ôn ${weak.length ? '' : '— không có'}</h4>${weak.length ? `<div class="rweak">${weak.map(x => `<div><span><b>${x.k}</b> ${THEORY[x.k].t} <em>(${x.r}/${x.n})</em><small>${COVER_A.revLabel || 'Slide tổng hợp: mục'} “${REV[x.k]}”${P2MAP[x.k] ? ` · Luyện tập: nhiệm vụ ${P2MAP[x.k].join(', ')}` : ''}</small></span><button class="btn" type="button" data-rev="${x.k}">📖 Ôn</button></div>`).join('')}</div>` : '<p class="lead">Con đã làm đúng mọi câu theo từng kiến thức.</p>'}</div>
    </div>`;
  texAll(box);
  box.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => go(1 + +b.dataset.q)));
  box.querySelectorAll('[data-rev]').forEach(b => b.addEventListener('click', () => showTheory([b.dataset.rev])));
  box.querySelector('[data-a=retry]').addEventListener('click', retryTest);
}
function retryTest(){
  T.attempt++; T.ans = {}; T.state = 'NOT_STARTED'; T.t0 = 0; clock.textContent = '⏱ 00:00';
  setVariant(T.v === 'A' ? 'B' : 'A');
  document.querySelectorAll('.anum input').forEach(i => { i.disabled = false; i.value = ''; });
  document.querySelectorAll('.anum').forEach(l => l.removeAttribute('data-state'));
  document.querySelectorAll('.aopts .opt').forEach(b => { b.disabled = false; b.removeAttribute('data-state'); });
  document.querySelectorAll('.asol').forEach(s => { s.hidden = true; s.innerHTML = ''; });
  goAnchor('q1');
}
(function(){ const cv = slides[0].el.querySelector('.cover > div');
  const b = h('<button class="btn gold vostart" type="button">▶ Bắt đầu làm bài</button>'); cv.appendChild(b); b.addEventListener('click', () => goAnchor('q1')); })();
setVariant('A');
slides[0].el.hidden = false; go(0);
window.__lesson = {go, slides, S, T, ITEMS, submit, isRight, retryTest, setStep, DRAW};
})();

</script>
<script>
/* iPhone/iPad: hướng dẫn toàn màn hình + nút về trang chủ khi mở như ứng dụng */
window.mbFsHint = function(){
  if (document.getElementById('mbfs')) return;
  var d = document.createElement('div'); d.id = 'mbfs';
  d.style.cssText = 'position:fixed;inset:0;z-index:100000;background:rgba(5,10,30,.72);display:flex;align-items:center;justify-content:center;padding:16px';
  d.innerHTML = '<div style="max-width:520px;background:#fff;color:#14213d;border-radius:16px;padding:20px 22px;font:16px/1.5 -apple-system,Segoe UI,sans-serif;box-shadow:0 20px 60px rgba(0,0,0,.4)">'
    + '<b style="font-size:18px">Xem toàn màn hình trên iPhone</b>'
    + '<p style="margin:10px 0 6px"><b>Cách 1:</b> bấm biểu tượng <b>aA</b> hoặc <b>☰</b> bên trái địa chỉ web → chọn <b>Ẩn thanh công cụ</b>.</p>'
    + '<p style="margin:6px 0 14px"><b>Cách 2:</b> bấm <b>Chia sẻ ⬆</b> → <b>Thêm vào MH chính</b>. Mở từ biểu tượng Mr Black trên màn hình chính sẽ luôn toàn màn hình.</p>'
    + '<button type="button" style="font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 18px;background:#f5b301;color:#14213d">Đã hiểu</button></div>';
  d.addEventListener('click', function(e){ if (e.target === d || e.target.tagName === 'BUTTON') d.remove(); });
  document.body.appendChild(d);
};
(function(){
  var sa = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (!sa) return;
  var a = document.createElement('a'); a.href = '../'; a.textContent = '⌂'; a.title = 'Về trang chủ'; a.setAttribute('aria-label', 'Về trang chủ');
  a.style.cssText = 'position:fixed;left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));z-index:99999;width:38px;height:38px;border-radius:12px;background:rgba(0,0,0,.55);color:#fff;font:22px/38px sans-serif;text-align:center;text-decoration:none';
  document.body.appendChild(a);
})();
</script>
<script>
/* Xoay máy: co giãn lại sân khấu nhiều nhịp sau khi xoay (iPhone/Android báo kích thước mới trễ, nhất là trang nặng) */
(function(){
  var last = '';
  function refit(){ try { window.dispatchEvent(new Event('resize')); } catch (e) {} }
  function burst(){ [0, 120, 300, 600, 1000, 1600].forEach(function(t){ setTimeout(refit, t); }); }
  function check(){ var vv = window.visualViewport, k = (vv ? vv.width + 'x' + vv.height : innerWidth + 'x' + innerHeight); if (k !== last){ last = k; burst(); } }
  window.addEventListener('orientationchange', burst);
  try { if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', burst); } catch (e) {}
  try { var mq = matchMedia('(orientation: portrait)'); if (mq.addEventListener) mq.addEventListener('change', burst); else if (mq.addListener) mq.addListener(burst); } catch (e) {}
  try { if (window.ResizeObserver) new ResizeObserver(check).observe(document.documentElement); } catch (e) {}
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) burst(); });
  window.addEventListener('pageshow', burst);
})();
</script>
