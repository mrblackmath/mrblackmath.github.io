/* MR BLACK NBK — BÀI GIẢNG TƯƠNG TÁC LOẠI A (2D) · Toán 10 Chương III
   Kế thừa Design System bài giảng T12-B7: sân khấu 1920×1080 co giãn · nền xanh đêm + ánh vàng · Chakra Petch · KaTeX nhúng.
   Thành phần: đề mục · khung đề vàng (đề SGK chép đủ) · GHI VỞ (phóng giữa màn hình) · TRẠM DỪNG (đúng mới đi tiếp) · khung lời giảng (bản GV). */
:root{
  --stage-a:#070d24; --stage-b:#13245e;
  --panel:#0f1a3f; --panel-2:#16245a; --panel-line:#2f4488;
  --text:#f5f7fc; --muted:#b4c0e2; --dim:#7f8db8;
  --gold:#ffc83d; --gold-2:#ff9f1c; --gold-ink:#1a1204; --gold-soft:rgba(255,200,61,.14);
  --blue:#4c8eff; --blue-soft:rgba(76,142,255,.16);
  --ok:#2fd27a; --ok-soft:rgba(47,210,122,.16); --bad:#ff5a5f; --bad-soft:rgba(255,90,95,.16);
  --fig-ink:#f5f7fc; --fig-dim:#9fb0da; --fig-faint:#2a3d7a;
  --c-red:#ff6b6b; --c-blue:#5aa8ff; --c-green:#2fd27a; --c-violet:#c08bff;
  --btn:#1b2a63; --btn-line:#3a55a8; --input-bg:#060b1f;
  --font:"Chakra Petch","Bahnschrift","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans",sans-serif;
  --h:42px; --tx:34px; --sm:26px; --line:1.42;
  color-scheme:dark;
}
:root[data-mb="light"]{
  --stage-a:#e9eefb; --stage-b:#f8f9fe;
  --panel:#ffffff; --panel-2:#f2f5fd; --panel-line:#c6d1ee;
  --text:#0d1433; --muted:#3c4870; --dim:#6b7699;
  --gold:#b87a00; --gold-2:#a86400; --gold-ink:#ffffff; --gold-soft:rgba(201,136,0,.12);
  --blue:#1d4ed8; --blue-soft:rgba(29,78,216,.1);
  --ok:#0f8a44; --ok-soft:rgba(15,138,68,.12); --bad:#c62828; --bad-soft:rgba(198,40,40,.1);
  --fig-ink:#0d1433; --fig-dim:#5b6892; --fig-faint:#d5ddf2;
  --c-red:#d63031; --c-blue:#1d6fe0; --c-green:#0f8a44; --c-violet:#7b3fd1;
  --btn:#ffffff; --btn-line:#b9c6ea; --input-bg:#ffffff;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--stage-a);color:var(--text);font-family:var(--font);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
#viewport{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% -10%,var(--stage-b),var(--stage-a) 70%)}
#canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;font-size:var(--tx);line-height:var(--line)}
.katex{font-size:1.04em}
.katex .mbin,.katex .mrel{margin-left:.06em;margin-right:.06em}
b{font-weight:700}
.gold-t{color:var(--gold)} .ok-t{color:var(--ok)} .bad-t{color:var(--bad)} .blue-t{color:var(--blue)} .muted{color:var(--muted)}
.gold-t .katex,.ok-t .katex,.bad-t .katex{color:inherit}

/* ---------- thanh trên ---------- */
.topbar{position:absolute;left:48px;right:48px;top:24px;height:64px;display:flex;align-items:center;gap:28px;z-index:3;transition:opacity .3s,filter .3s}
.brand{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;text-align:left;flex:0 0 auto}
.brand .logo{width:60px;height:60px;position:relative}
.brand .logo svg{width:60px;height:60px;display:block}
.brand .logo img{position:absolute;inset:4px;width:52px;height:52px;object-fit:cover;border-radius:10px}
.brand b{display:block;font-size:var(--sm);line-height:1}
.brand small{display:block;margin-top:5px;font-size:16px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.mb{position:absolute;right:-8px;bottom:-6px;padding:1px 5px;border-radius:6px;font-size:13px;font-weight:700;line-height:1.2;color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2));box-shadow:0 0 0 2px var(--stage-a)}
.brand:not(.has-photo) .mb{display:none}
.secs{margin-left:auto;display:flex;align-items:center}
.secs span{height:44px;padding:0 18px;display:inline-flex;align-items:center;font-size:20px;font-weight:700;color:var(--dim);border-bottom:3px solid var(--panel-line);white-space:nowrap}
.secs span.done{color:var(--muted)}
.secs span.cur{color:var(--gold);border-bottom-color:var(--gold)}

/* ---------- sân khấu ---------- */
.stage{position:absolute;left:48px;right:48px;top:112px;bottom:112px;z-index:2}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;gap:22px}
.watermark{position:absolute;right:0;bottom:0;font-size:110px;font-weight:700;color:var(--text);opacity:.045;pointer-events:none;line-height:1}
.hd{flex:0 0 auto;display:flex;align-items:stretch;border-radius:16px;overflow:hidden;border:2px solid var(--gold);background:var(--panel)}
.hd .sn{flex:0 0 auto;min-width:92px;padding:0 22px;display:grid;place-items:center;font-size:var(--h);font-weight:700;color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2))}
.hd .st{flex:0 0 auto;padding:12px 28px;font-size:var(--h);font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center}
.hd .ss{flex:1 1 auto;padding:12px 28px;font-size:var(--h);font-weight:700;color:var(--text);display:flex;align-items:center;border-left:2px solid var(--panel-line)}
.lead{margin:0;font-size:var(--tx);font-weight:600;color:var(--muted);flex:0 0 auto}
.lead b{color:var(--text)}
.cols{flex:1 1 auto;min-height:0;display:grid;gap:40px;align-items:center;grid-template-rows:minmax(0,1fr)}
.cols>*{min-width:0;min-height:0}
.fig{position:relative;min-height:0;min-width:0;height:100%;display:grid;place-items:center}
.fig>svg{display:block;width:100%;height:100%;max-height:100%;overflow:visible}
.stack{display:flex;flex-direction:column;gap:18px;min-height:0;justify-content:center}
.box{border-radius:18px;border:2px solid var(--panel-line);background:var(--panel);padding:18px 26px}
.kbox{border-radius:18px;border:2px solid var(--gold);background:linear-gradient(var(--gold-soft),var(--gold-soft)),var(--panel);padding:16px 26px;font-weight:600}
.kw{color:var(--gold)}
.kw .katex{color:inherit}

/* ---------- KHUNG ĐỀ VÀNG: đề SGK chép đủ ---------- */
.de{flex:0 0 auto;border-radius:18px;border:3px solid var(--gold);background:linear-gradient(var(--gold-soft),var(--gold-soft)),var(--panel);padding:14px 26px;font-size:36px;font-weight:600;line-height:1.42}
.de .tag{display:inline-block;margin-right:12px;padding:0 14px;border-radius:9px;background:linear-gradient(180deg,var(--gold),var(--gold-2));color:var(--gold-ink);font-size:var(--sm);font-weight:700;vertical-align:.12em}
.de .src{float:right;margin-left:14px;font-size:20px;font-weight:700;color:var(--dim)}
.de .it{display:block;padding-left:44px;text-indent:-40px}
.de .it b.lb{color:var(--gold);display:inline-block;width:40px;text-indent:0}
.de.sm{font-size:32px}

/* ---------- lời dẫn / các bước ---------- */
.say{display:grid;gap:14px;align-content:center}
.say>div{font-size:var(--tx);font-weight:600;padding:12px 24px;border-left:6px solid var(--gold);border-radius:0 14px 14px 0;background:var(--panel)}
.calc3{display:grid;gap:10px;align-content:center}
.calc3 .cr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;font-size:36px;font-weight:600;padding:6px 18px;border-radius:12px}
.calc3 .cr .why{font-size:24px;color:var(--ok);font-weight:600;max-width:340px}
.calc3 .cr .why .katex{color:var(--ok)}
.calc3.sm .cr{font-size:32px}
.calc3 .cr.res{border:2px solid var(--gold);background:var(--gold-soft)}
.bubble{position:relative;padding:14px 22px;border-radius:18px;border:2px dashed var(--blue);background:var(--blue-soft);font-size:var(--sm);font-weight:600;color:var(--text)}
.bubble::before{content:"💬 ";}
[data-step]:not(.on){visibility:hidden}
[data-unstep].gone{visibility:hidden}

/* ---------- GHI VỞ ---------- */
.ghi{position:relative;flex:0 0 auto;margin-top:44px;padding:20px 32px 16px;border-radius:0 18px 18px 18px;border:3px solid var(--gold);cursor:pointer;
  background:repeating-linear-gradient(180deg,transparent 0 45px,rgba(255,200,61,.07) 45px 46px),var(--panel)}
.ghi::before{content:"📝  GHI VỞ";position:absolute;left:-3px;top:-44px;height:44px;padding:0 22px;display:flex;align-items:center;border-radius:12px 12px 0 0;font-size:var(--sm);font-weight:700;letter-spacing:.12em;color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2))}
.ghi ul,.spotbox ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ghi li{font-size:32px;font-weight:600;line-height:1.42;padding-left:36px;position:relative}
.ghi li::before{content:"";position:absolute;left:6px;top:.6em;width:14px;height:14px;border-radius:4px;background:var(--gold)}
.ghi li.l2{padding-left:84px}
.ghi li.l2::before{left:48px;top:.72em;width:20px;height:4px;border-radius:2px;background:var(--muted)}
.ghi li.nodash::before,.spotbox li.nodash::before{display:none}
.dimmer{position:absolute;inset:-112px -48px;z-index:5;background:rgba(3,6,18,.82);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .35s}
:root[data-mb="light"] .dimmer{background:rgba(230,235,248,.85)}
.slide.focus .dimmer{opacity:1;pointer-events:auto}
body.focus .topbar,body.focus .bottombar>:not(#next):not(#prev){opacity:.18;filter:blur(2px)}
.spotbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:1720px;max-height:820px;padding:56px 64px 46px;border:4px solid var(--gold);border-radius:28px;cursor:pointer;
  background:repeating-linear-gradient(180deg,transparent 0 69px,rgba(255,200,61,.08) 69px 70px),var(--panel);box-shadow:0 0 0 12px var(--gold-soft),0 40px 120px rgba(0,0,0,.55)}
.spotbox .tab{position:absolute;left:-4px;top:-60px;height:60px;padding:0 30px;display:flex;align-items:center;border-radius:16px 16px 0 0;font-size:var(--h);font-weight:700;letter-spacing:.1em;color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2))}
.spotbox ul{gap:16px}
.spotbox li{font-size:44px;font-weight:700;line-height:1.35;padding-left:56px;position:relative}
.spotbox li::before{content:"";position:absolute;left:6px;top:.5em;width:22px;height:22px;border-radius:6px;background:var(--gold)}
.spotbox li.l2{padding-left:130px;font-weight:600}
.spotbox li.l2::before{left:70px;top:.66em;width:32px;height:6px;border-radius:3px;background:var(--muted)}
.spotbox .kw{color:var(--gold)}
.spotbox.pop{animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.92)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.ghi table,.spotbox table{border-collapse:collapse;margin:6px 0 0 36px}
.ghi td,.ghi th{border:2px solid var(--panel-line);padding:2px 16px;text-align:center;font-size:30px}
.spotbox td,.spotbox th{border:2px solid var(--panel-line);padding:4px 22px;text-align:center;font-size:38px}

/* ---------- thanh dưới ---------- */
.bottombar{position:absolute;left:48px;right:48px;bottom:24px;height:64px;display:flex;align-items:center;gap:12px;z-index:7}
.bottombar>*{transition:opacity .3s,filter .3s}
.nbtn{height:58px;min-width:58px;padding:0 16px;border-radius:10px;border:2px solid var(--btn-line);background:var(--btn);font-size:19px;font-weight:700;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.nbtn:hover:not(:disabled){border-color:var(--gold)}
.nbtn:disabled{opacity:.35;cursor:default}
.nbtn.go{background:linear-gradient(180deg,var(--gold),var(--gold-2));border-color:var(--gold);color:var(--gold-ink);min-width:110px;font-size:var(--sm)}
.nbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.nlabel{font-size:20px;font-weight:700;width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.progress{flex:1;height:10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--panel-line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .3s}
.ncount{font-size:20px;font-weight:700;color:var(--muted);min-width:76px;text-align:right;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:6px;min-width:60px}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--gold)}
.pips i.on{background:var(--gold)}
.nomic{height:44px;padding:0 14px;display:inline-flex;align-items:center;border-radius:10px;font-size:18px;font-weight:700;color:var(--dim);border:2px dashed var(--panel-line);white-space:nowrap}
.menu{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);width:1300px;z-index:9;padding:24px;border-radius:18px;border:2px solid var(--panel-line);background:var(--panel)}
.menu .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu button{text-align:left;padding:14px 18px;border-radius:12px;border:2px solid var(--panel-line);background:var(--btn);font-size:22px;font-weight:700}
.menu button:hover{border-color:var(--gold)}
.gvnote{position:absolute;left:0;right:0;bottom:-8px;z-index:8;display:none;padding:10px 18px;border-radius:14px;border:2px dashed var(--gold);background:var(--panel);font-size:20px;font-weight:600;color:var(--muted)}
body.gv .gvnote{display:block}
#nojs{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#0b1024;color:#fff;font:600 18px system-ui,sans-serif}
.js #nojs{display:none}
#rotate{position:fixed;inset:0;z-index:998;display:none;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:rgba(6,9,20,.94);color:#fff;font:600 19px system-ui,sans-serif;text-align:center;padding:28px}
#rotate button{font:700 16px system-ui,sans-serif;background:#ffc83d;border:0;border-radius:10px;padding:10px 18px;color:#0a0c12}
@media (orientation:portrait) and (max-width:900px){.js:not(.keep-portrait) #rotate{display:flex}}
.fade{animation:fd .4s ease-out}
@keyframes fd{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(4px)}}
@keyframes pls{0%,100%{box-shadow:0 0 0 0 var(--gold-soft)}50%{box-shadow:0 0 0 10px var(--gold-soft)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- nút & trạm dừng ---------- */
.btn{height:60px;padding:0 26px;border-radius:12px;border:2px solid var(--btn-line);background:var(--btn);font-size:var(--sm);font-weight:700}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold-2));border-color:var(--gold);color:var(--gold-ink)}
.btn .m,.btn .katex,.btn .katex *{pointer-events:none}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qa{display:grid;gap:14px;align-content:center}
.qa .q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:12px 58px 12px 26px;border-radius:14px;border:2px solid var(--panel-line);background:var(--panel);font-size:var(--tx);font-weight:600}
.qa .q.one{grid-template-columns:1fr}
.qa.tight{gap:10px} .qa.tight .q{padding-top:8px;padding-bottom:8px}
.ain{--w:220px;position:relative;display:inline-flex;align-items:center;justify-self:end}
.ain input{width:var(--w);height:66px;border-radius:14px;border:3px solid var(--panel-line);background:var(--input-bg);color:var(--text);font:inherit;font-size:38px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.ain input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 6px var(--gold-soft)}
.ain input:disabled{opacity:1}
.ain[data-state="ok"] input{border-color:var(--ok);background:var(--ok-soft)}
.ain[data-state="bad"] input{border-color:var(--bad);border-style:dashed;background:var(--bad-soft);animation:shake .45s}
.mk{position:absolute;right:-36px;font-style:normal;font-size:32px;font-weight:700}
.ain[data-state="ok"] .mk,.ach[data-state="ok"] .mk{color:var(--ok)} .ain[data-state="bad"] .mk,.ach[data-state="bad"] .mk{color:var(--bad)}
.ach{position:relative;display:inline-flex;flex-wrap:wrap;gap:12px;justify-self:end}
.ach .btn{height:auto;min-height:62px;min-width:120px;padding:6px 20px;line-height:1.25;font-size:30px}
.ach .btn[data-state="sel"]{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.ach .btn[data-state="ok"]{border-color:var(--ok);background:var(--ok-soft)}
.ach .btn[data-state="bad"]{border-color:var(--bad);border-style:dashed;background:var(--bad-soft);animation:shake .45s}
.ach .btn:disabled{cursor:default}
.ach .btn:disabled:not([data-state]){opacity:.5}
.ach.wide{justify-self:stretch}
.stfoot{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.stfoot .btn{height:60px}
.stfoot .btn:disabled{opacity:.38;cursor:default}
.stbadge{height:44px;padding:0 16px;display:inline-flex;align-items:center;border-radius:10px;font-size:20px;font-weight:700;letter-spacing:.12em;color:var(--gold);border:2px solid var(--gold);background:var(--gold-soft)}
.stfb{flex:1 1 100%;margin:0;min-height:54px;padding:8px 20px;border-radius:14px;font-size:27px;font-weight:600;line-height:1.35;color:var(--muted);border:2px solid transparent}
.stfb.ok{color:var(--text);background:var(--ok-soft);border-color:var(--ok)} .stfb.ok b{color:var(--ok)}
.stfb.bad{color:var(--text);background:var(--bad-soft);border:2px dashed var(--bad)}

function parseNum(str){
  let s = String(str || '').trim().toLowerCase().replace(/[°º%]|độ|km|m\b/g, '').replace(/[−–]/g, '-').replace(/\s+/g, '').replace(',', '.');
  if (s === '' || s === '+' || s === '-') return NaN;
  const q = s.match(/^([+-]?\d*\.?\d+)\/([+-]?\d*\.?\d+)$/);
  if (q) return parseFloat(q[1]) / parseFloat(q[2]);
  if (/^[+-]?\d*\.?\d+$/.test(s)) return parseFloat(s);
  return NaN;
}

addSlide({label: '1. HĐ1 · Đặc điểm chung', sec: 1, anchor: 'm1', html: hd(1, 'HĐ1 · Các biểu thức có gì chung?') + R`

const voBar = h(HAS_VO ? `<span class="vobar"><button class="nbtn" id="vo-play" type="button" title="Nghe / tạm dừng lời giảng">▶ Nghe</button><button class="nbtn" id="vo-replay" type="button" aria-label="Nghe lại slide này">↺</button><button class="nbtn" id="vo-auto" type="button" aria-pressed="true">Tự chạy: Bật</button><button class="nbtn" id="vo-rec" type="button">⏺ Chỉnh mốc</button></span>`
  : `<span class="vobar"><span class="nomic" title="Bản thiết kế: chưa gắn file thu âm lời giảng">🎙 Chưa gắn lời giảng</span></span>`);
$('#btn-menu').before(voBar);
function voUI(){
  if (!HAS_VO) return;
  const playing = !VO.au.paused && VO.phase !== 'idle';
  $('#vo-play').textContent = VO.phase === 'rec' ? '■ Xong' : playing ? '⏸ Dừng' : '▶ Nghe';
  $('#vo-auto').textContent = 'Tự chạy: ' + (VO.auto ? 'Bật' : 'Tắt'); $('#vo-auto').setAttribute('aria-pressed', String(VO.auto));
  $('#vo-rec').classList.toggle('on', VO.phase === 'rec');
  document.body.classList.toggle('vo-on', playing);
}
if (HAS_VO){
  $('#vo-play').addEventListener('click', () => {
    VO.started = true;
    if (VO.phase === 'rec'){ voRecFinish(); return; }
    if (!VO.au.paused){ voStop(S.step >= slides[S.cur].max ? 'done' : 'idle'); return; }
    const d = voData();
    if (VO.phase === 'wait' && !blocked()){ voPlayFrom(d.a2Start, 'a2'); return; }
    voPlayFrom(0, 'a1');
  });
  $('#vo-replay').addEventListener('click', () => { VO.started = true; go(S.cur, 0); if (!VO.auto) voPlayFrom(0, 'a1'); });
  $('#vo-auto').addEventListener('click', () => { VO.auto = !VO.auto; VO.started = true; if (!VO.auto) clearTimeout(VO.timer); else voAfterStep(); voUI(); });
  $('#vo-rec').addEventListener('click', () => { if (VO.phase === 'rec'){ voRecFinish(); return; } VO.started = true; go(S.cur, 0); voStop(); VO.recT = []; voPlayFrom(0, 'rec'); });
}
function voRecFinish(){
  VO.au.pause(); cancelAnimationFrame(VO.raf);
  const k = voKey(S.cur), marks = VO.recT || []; VO.phase = 'idle'; VO.recT = null; voUI();
  const line = `${k}: ${marks.map(m0 => m0.t.toFixed(1)).join(', ') || '(chưa bấm mốc nào)'}`;
  if (marks.length){ try { localStorage.setItem(META.pkey + '-cues-' + k, JSON.stringify(marks)); } catch (e) {} }
  openModal(`<div class="tab">⏺ MỐC ▶ CỦA ${k}</div><h3>Đã ghi ${marks.length} mốc</h3><p>Gửi dòng sau cho Claude để áp dụng cho mọi học sinh:</p><pre>${line}</pre><div class="row" style="justify-content:flex-end"><button class="btn gold" type="button" data-a="close">Đóng</button></div>`);
}
document.addEventListener('pointerdown', () => { VO.started = true; }, {once: true, capture: true});
/* bìa: nút bắt đầu, chọn phần học, học tiếp (tiến độ chỉ lưu trên trình duyệt đang dùng) */
(function(){ const c = slides[0].el.querySelector('.cover > div'); if (!c) return;
  const b = h('<button class="btn gold vostart" type="button">▶ Bắt đầu học</button>'); c.appendChild(b);
  b.addEventListener('click', () => { if (!HAS_VO){ go(1); return; } VO.started = true; VO.auto = true; voPlayFrom(0, 'a1'); }); })();
if (!HAS_VO){ const cv = slides[0].el.querySelector('.cover .cvr'); if (cv) cv.prepend(h('<p class="pending">🎙 Bản chờ hoàn thiện · lời giảng của thầy sẽ được bổ sung</p>')); }
const PKEY = META.pkey + '-prog';
const PROG = (() => { try { const v = JSON.parse(localStorage.getItem(PKEY) || '{}'); return {last: +v.last || 0, done: Array.isArray(v.done) ? v.done : []}; } catch (e) { return {last: 0, done: []}; } })();
const progSave = () => { try { localStorage.setItem(PKEY, JSON.stringify(PROG)); } catch (e) {} };
const stKeys = sec => slides.flatMap((s, i) => s.sec === sec && s.stations ? s.stations.map(t => i + ':' + t.id) : []);
const cards = [];
(function(){ const box = slides[0].el.querySelector('.parts'); if (!box) return;
  META.parts.forEach((p, j) => { const k = slides.findIndex(s => s.anchor === p.a);
    const c = h(`<button type="button" class="pcard"><span class="pn">Phần ${j + 1}</span><b>${p.t}</b><span class="pf"><span class="pst"></span>${p.need ? `<span class="pneed">${p.need}</span>` : ''}</span></button>`);
    c.addEventListener('click', () => { if (HAS_VO){ VO.started = true; VO.auto = true; } go(k); }); box.appendChild(c); cards.push({c, p}); });
  const cv = slides[0].el.querySelector('.cover > div');
  const r = h('<button class="btn resume" type="button" hidden></button>'); cv.appendChild(r);
  r.addEventListener('click', () => go(PROG.last)); cards.resume = r; })();
function progUI(){
  cards.forEach(({c, p}) => { const ks = stKeys(p.sec), d = ks.filter(k => PROG.done.includes(k)).length, all = d === ks.length && ks.length > 0;
    c.classList.toggle('ok', all); c.querySelector('.pst').textContent = (all ? '✓ ' : '') + `${d}/${ks.length} trạm dừng`; });
  const r = cards.resume; if (!r) return;
  r.hidden = !(PROG.last > 1 && PROG.last < slides.length - 1);
  if (!r.hidden) r.textContent = `↻ Học tiếp · ${slides[PROG.last].label}`;
}
document.addEventListener('station-done', e => { const k = S.cur + ':' + (e.detail && e.detail.id); if (!PROG.done.includes(k)){ PROG.done.push(k); progSave(); } progUI(); });
const go0 = go; go = function(n, step){ go0(n, step); if (S.cur > 0){ PROG.last = S.cur; progSave(); } else progUI(); };
backBtn.addEventListener('pointerdown', () => { VO.skipNext = true; });
slides[0].el.hidden = false; go(0);
window.__lesson = {go, slides, S, fwd, spot, blocked, VO, voData, setStep};
})();

</script>

<script>
/* Xoay máy: co giãn lại sân khấu nhiều nhịp sau khi xoay (iPhone/Android báo kích thước mới trễ, nhất là trang nặng) */
(function(){
  var last = '';
  function refit(){ try { window.dispatchEvent(new Event('resize')); } catch (e) {} }
  function burst(){ [0, 120, 300, 600, 1000, 1600].forEach(function(t){ setTimeout(refit, t); }); }
  function check(){ var vv = window.visualViewport, k = (vv ? vv.width + 'x' + vv.height : innerWidth + 'x' + innerHeight); if (k !== last){ last = k; burst(); } }
  window.addEventListener('orientationchange', burst);
  try { if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', burst); } catch (e) {}
  try { var mq = matchMedia('(orientation: portrait)'); if (mq.addEventListener) mq.addEventListener('change', burst); else if (mq.addListener) mq.addListener(burst); } catch (e) {}
  try { if (window.ResizeObserver) new ResizeObserver(check).observe(document.documentElement); } catch (e) {}
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) burst(); });
  window.addEventListener('pageshow', burst);
})();
</script>
