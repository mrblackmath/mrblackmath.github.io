<html lang="vi"><head><meta charset="utf-8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Mr Black"><link rel="apple-touch-icon" href="../icon.png"><script>try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
/* ===== SLIDE TỔNG HỢP KIẾN THỨC CHƯƠNG (Loại B · P1) — không lời giảng, tự điều hướng ===== */
.hub{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:8px}
.hcard{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:22px 26px;border-radius:20px;background:var(--panel);border:2px solid var(--panel-line);box-shadow:0 8px 26px rgba(0,0,0,.18);transition:transform .15s,border-color .15s}
.hcard:hover,.hcard:focus-visible{transform:translateY(-3px);border-color:var(--gold)}
.hcard .hn{font-size:20px;font-weight:700;color:var(--gold);letter-spacing:.06em}
.hcard b{font-size:32px;line-height:1.2}
.hcard span.hs{font-size:22px;color:var(--muted);line-height:1.4}
.hcard .hb{font-size:17px;color:var(--dim)}
.hcard.seen{border-color:var(--ok)}
.hcard.seen .hn::after{content:"  ✓ đã xem";color:var(--ok);font-weight:600;letter-spacing:0}
.howto{display:flex;gap:16px 28px;flex-wrap:wrap;font-size:22px;color:var(--muted);margin-top:22px}
.howto span{display:inline-flex;gap:8px;align-items:center}
.howto b{color:var(--text)}
/* thẻ lật */
.fcs{display:grid;gap:18px}
.fc{all:unset;cursor:pointer;position:relative;display:block;min-height:var(--fh,150px);perspective:1400px;border-radius:18px}
.fc .fi{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fi{transform:rotateY(180deg)}
.fc .ff,.fc .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:16px 22px;display:flex;flex-direction:column;justify-content:center;gap:6px;font-size:26px;line-height:1.42;border:2px solid var(--panel-line);background:var(--panel)}
.fc .ff b.t{display:block;font-size:27px;color:var(--gold)}
.fc .ff i.tap{position:absolute;right:14px;bottom:6px;font-size:16px;font-style:normal;color:var(--dim)}
.fc .fb{transform:rotateY(180deg);background:var(--panel-2);border-color:var(--gold)}
.fc:focus-visible .ff,.fc:focus-visible .fb{outline:3px solid var(--gold);outline-offset:2px}
.fc.bad .ff{border-color:var(--bad);background:linear-gradient(0deg,var(--bad-soft),var(--bad-soft)),var(--panel)}
.fc.bad .ff b.t{color:var(--bad)}
.fc.bad .fb{border-color:var(--ok);background:linear-gradient(0deg,var(--ok-soft),var(--ok-soft)),var(--panel)}
.fc .fb b.t{display:block;font-size:26px;color:var(--ok)}
/* khối mở rộng */
.acc{border:2px solid var(--panel-line);border-radius:16px;background:var(--panel);overflow:hidden}
.acc>button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;width:calc(100% - 44px);padding:16px 22px;font-size:27px;font-weight:700}
.acc>button::before{content:"＋";color:var(--gold);font-size:24px;width:26px}
.acc.open>button::before{content:"－"}
.acc>button:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.acc>div{display:none;padding:2px 24px 18px 60px;font-size:25px;line-height:1.5}
.acc.open>div{display:block}
.acc+.acc{margin-top:12px}
/* các bước của phương pháp */
.steps{counter-reset:st;display:flex;flex-direction:column;gap:12px}
.steps>div{counter-increment:st;position:relative;padding:12px 18px 12px 66px;border-radius:14px;background:var(--panel);border:2px solid var(--panel-line);font-size:25px;line-height:1.45}
.steps>div::before{content:counter(st);position:absolute;left:16px;top:13px;width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-weight:800;display:grid;place-items:center;font-size:20px}
.steps>div[data-step]{opacity:.18;transition:opacity .3s}
.steps>div[data-step].on{opacity:1}
.mtitle{font-size:30px;font-weight:800;margin:0 0 12px;display:flex;gap:12px;align-items:center}
.mtitle .tag{font-size:17px;padding:3px 12px;border-radius:999px;background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold)}
.ksrc{font-size:18px;color:var(--dim);margin-top:auto;padding-top:8px}
.hint{font-size:22px;color:var(--muted)}
.hint b{color:var(--gold)}
/* bảng */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:24px;line-height:1.4;border:2px solid var(--panel-line);border-radius:16px;overflow:hidden;background:var(--panel)}
.tbl th{background:var(--panel-2);color:var(--gold);text-align:left;padding:14px 18px;font-size:23px}
.tbl td{padding:13px 18px;border-top:1px solid var(--panel-line);vertical-align:top}
.tbl td:first-child{font-weight:700;white-space:nowrap}
.tbl tr.yes td:nth-child(2){color:var(--ok)}
/* sơ đồ chuỗi song song */
.chain{display:grid;grid-template-columns:1fr 250px 1fr 250px 1fr;align-items:center;gap:0;margin:18px 0 16px}
.cnode{padding:30px 18px;border-radius:20px;border:3px solid var(--gold);background:var(--panel);text-align:center;font-size:40px;font-weight:700}
.cnode small{display:block;font-size:21px;font-weight:500;color:var(--muted);margin-top:4px}
.carr{display:flex;flex-direction:column;gap:8px;align-items:stretch;padding:0 8px}
.carr button{all:unset;cursor:pointer;text-align:center;font-size:22px;padding:10px 8px;border-radius:12px;border:2px solid var(--panel-line);background:var(--panel-2);line-height:1.3}
.carr button.r{border-color:var(--blue)}
.carr button:hover,.carr button.cur{border-color:var(--gold);background:var(--gold-soft)}
.carr button::after{display:block;font-size:30px;color:var(--gold)}
.carr button.f::after{content:"⟶"}
.carr button.r::after{content:"⟵";color:var(--blue)}
.cout{min-height:190px;padding:22px 28px;border-radius:18px;background:var(--panel);border:2px dashed var(--panel-line);font-size:28px;line-height:1.5}
.cout b.t{color:var(--gold)}
/* ghép dạng toán ↔ phương pháp (không chấm điểm) */
.match{display:grid;grid-template-columns:1fr 1fr;gap:18px 34px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mcol h4{margin:0 0 4px;font-size:22px;color:var(--gold);letter-spacing:.04em}
.mi{all:unset;cursor:pointer;padding:15px 20px;border-radius:14px;border:2px solid var(--panel-line);background:var(--panel);font-size:25px;line-height:1.35}
.mi:hover{border-color:var(--gold)}
.mi:focus-visible{outline:3px solid var(--gold)}
.mi.sel{border-color:var(--gold);background:var(--gold-soft)}
.mi.pair{border-color:var(--ok);background:var(--ok-soft)}
.mi.no{animation:shake .4s}
.mi .pn{display:inline-block;min-width:28px;font-weight:800;color:var(--ok)}
.mfb{grid-column:1/-1;min-height:72px;font-size:25px;line-height:1.45;padding:10px 18px;border-radius:14px;background:var(--panel-2)}
.vbadge{position:absolute;right:26px;top:22px;font-size:16px;padding:4px 14px;border-radius:999px;border:1px solid var(--panel-line);color:var(--dim)}
.fig .f3d{margin:0 auto}
.mini{font-size:23px;color:var(--muted);line-height:1.45}
.fc .ff>span,.fc .fb>span{display:block}
.chain+.row .btn{font-size:24px}
</style>

<style>

/* MR BLACK NBK — DESIGN SYSTEM (kế thừa từ bài giảng Mr Black trước):
   sân khấu cố định 1920×1080 co giãn vừa màn hình · nền xanh đêm + ánh vàng thương hiệu · Chakra Petch · KaTeX nhúng sẵn.
   Bản bài giảng: topbar (thương hiệu – tên phần – thanh 6 pha của dạng toán) · stage (mỗi slide một vấn đề) · bottombar điều hướng. */
:root{
  --stage-a:#070d24; --stage-b:#13245e; --ray:rgba(255,214,102,.05);
  --panel:#0f1a3f; --panel-2:#16245a; --panel-line:#2f4488; --glow:rgba(76,142,255,.35);
  --text:#f5f7fc; --muted:#b4c0e2; --dim:#7f8db8;
  --gold:#ffc83d; --gold-2:#ff9f1c; --gold-ink:#1a1204; --gold-soft:rgba(255,200,61,.14);
  --blue:#4c8eff; --blue-2:#2f6bff; --blue-soft:rgba(76,142,255,.16);
  --ok:#2fd27a; --ok-soft:rgba(47,210,122,.16); --bad:#ff5a5f; --bad-soft:rgba(255,90,95,.16);
  --hint:#ffd166;
  --fig-ink:#f5f7fc; --fig-dim:#9fb0da; --fig-faint:#3a4d8f;
  --pl-a:rgba(76,142,255,.26); --pl-b:rgba(255,200,61,.24); --pl-c:rgba(47,210,122,.22);
  --btn:#1b2a63; --btn-line:#3a55a8; --input-bg:#060b1f;
  --font:"Chakra Petch","Bahnschrift","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans",sans-serif;
  color-scheme:dark;
}
:root[data-mb="light"]{
  --stage-a:#e9eefb; --stage-b:#f8f9fe; --ray:rgba(30,64,175,.035);
  --panel:#ffffff; --panel-2:#f2f5fd; --panel-line:#c6d1ee; --glow:rgba(29,78,216,.12);
  --text:#0d1433; --muted:#3c4870; --dim:#6b7699;
  --gold:#b87a00; --gold-2:#a86400; --gold-ink:#ffffff; --gold-soft:rgba(201,136,0,.12);
  --blue:#1d4ed8; --blue-2:#1e40af; --blue-soft:rgba(29,78,216,.1);
  --ok:#0f8a44; --ok-soft:rgba(15,138,68,.12); --bad:#c62828; --bad-soft:rgba(198,40,40,.1);
  --hint:#8a5a00;
  --fig-ink:#0d1433; --fig-dim:#5b6892; --fig-faint:#c3cde9;
  --pl-a:rgba(29,78,216,.16); --pl-b:rgba(201,136,0,.2); --pl-c:rgba(15,138,68,.16);
  --btn:#ffffff; --btn-line:#b9c6ea; --input-bg:#ffffff;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--stage-a);color:var(--text);font-family:var(--font);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}


/* ĐOÀN TÀU DÃY SỐ · Mr Black NBK
   Thang chữ khóa 3 cỡ: --h 40px (đề mục) · --tx 32px (nội dung) · --sm 24px (nhãn phụ). */
:root{--h:40px;--tx:32px;--sm:24px;--line:1.45}
#viewport{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% -10%,var(--stage-b),var(--stage-a) 70%)}
#canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;font-size:var(--tx);line-height:var(--line)}
.katex{font-size:1.02em;text-transform:none;letter-spacing:normal}
b{font-weight:700}

/* ---------- Thanh trên: thương hiệu + mục lục đề mục ---------- */
.topbar{position:absolute;left:48px;right:48px;top:24px;height:64px;display:flex;align-items:center;gap:28px;z-index:3;transition:opacity .3s,filter .3s}
.brand{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;text-align:left;flex:0 0 auto}
.brand .logo{width:56px;height:56px;position:relative}
.brand .logo svg{width:56px;height:56px;display:block}
.brand .logo img{position:absolute;inset:4px;width:48px;height:48px;object-fit:cover;border-radius:9px}
.brand b{display:block;font-size:var(--sm);line-height:1}
.brand small{display:block;margin-top:5px;font-size:16px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.secs{margin-left:auto;display:flex;align-items:center;gap:0}
.secs span{height:44px;padding:0 18px;display:inline-flex;align-items:center;font-size:20px;font-weight:700;color:var(--dim);border-bottom:3px solid var(--panel-line)}
.secs span.done{color:var(--muted)}
.secs span.cur{color:var(--gold);border-bottom-color:var(--gold)}

.stage{position:absolute;left:48px;right:48px;top:112px;bottom:112px;z-index:2}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;gap:28px}
.watermark{position:absolute;right:0;bottom:0;font-size:110px;font-weight:700;color:var(--text);opacity:.045;pointer-events:none;line-height:1}

/* ---------- ĐỀ MỤC: luôn nổi bật ở đầu mỗi slide ---------- */
.hd{flex:0 0 auto;display:flex;align-items:stretch;gap:0;border-radius:16px;overflow:hidden;border:2px solid var(--gold);background:var(--panel)}
.hd .sn{flex:0 0 auto;min-width:92px;padding:0 22px;display:grid;place-items:center;font-size:var(--h);font-weight:700;color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2))}
.hd .st{flex:0 0 auto;padding:14px 28px;font-size:var(--h);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center}
.hd .ss{flex:1 1 auto;padding:14px 28px;font-size:var(--h);font-weight:700;color:var(--text);display:flex;align-items:center;border-left:2px solid var(--panel-line)}
.lead{margin:0;font-size:var(--tx);font-weight:600;color:var(--muted)}
.lead b{color:var(--text)}

/* ---------- Vùng hình ---------- */
.fig{flex:1 1 auto;min-height:0;display:grid;place-items:center;position:relative}
.fig>svg{display:block;overflow:visible}
.cols{flex:1 1 auto;min-height:0;display:grid;gap:40px;align-items:center}
.muted{color:var(--muted)} .gold-t{color:var(--gold)} .blue-t{color:var(--blue)} .ok-t{color:var(--ok)} .bad-t{color:var(--bad)}
.box{border-radius:18px;border:2px solid var(--panel-line);background:var(--panel);padding:22px 28px}
.cap{display:block;text-align:center;font-size:var(--sm);font-weight:700;color:var(--muted);margin-top:8px}

/* ---------- GHI VỞ: thẻ vở có tab thò ra, nội dung thò thụt ---------- */
.ghi{position:relative;flex:0 0 auto;margin-top:18px;padding:26px 34px 22px 34px;border-radius:0 18px 18px 18px;border:3px solid var(--gold);
  background:repeating-linear-gradient(180deg,transparent 0 45px,rgba(255,200,61,.07) 45px 46px),var(--panel);transition:transform .35s ease,box-shadow .35s ease}
.ghi::before{content:"📝  GHI VỞ";position:absolute;left:-3px;top:-44px;height:44px;padding:0 22px;display:flex;align-items:center;border-radius:12px 12px 0 0;
  font-size:var(--sm);font-weight:700;letter-spacing:.12em;color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2))}
.ghi{cursor:pointer}
.ghi ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ghi li{font-size:var(--tx);font-weight:600;line-height:var(--line);padding-left:36px;position:relative}
.ghi li::before{content:"";position:absolute;left:6px;top:.6em;width:14px;height:14px;border-radius:4px;background:var(--gold)}
.ghi li.l2{padding-left:84px}
.ghi li.l2::before{left:48px;top:.72em;width:20px;height:4px;border-radius:2px;background:var(--muted)}
.ghi .kw{color:var(--gold)}
/* chế độ tập trung ghi chép */
.dimmer{position:absolute;inset:-112px -48px;z-index:5;background:rgba(3,6,18,.74);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .35s}
:root[data-mb="light"] .dimmer{background:rgba(230,235,248,.8)}
.slide.focus .dimmer{opacity:1;pointer-events:auto}
.ghi.spot{z-index:6;transform:scale(1.04);box-shadow:0 0 0 8px var(--gold-soft),0 30px 80px rgba(0,0,0,.45)}
body.focus .topbar,body.focus .bottombar>:not(#next):not(#prev){opacity:.18;filter:blur(2px)}
.focus-tip{position:absolute;right:0;top:-40px;font-size:20px;font-weight:700;color:var(--dim);display:none}
.ghi.spot .focus-tip{display:block}

/* ---------- Thanh dưới ---------- */
.bottombar{position:absolute;left:48px;right:48px;bottom:24px;height:64px;display:flex;align-items:center;gap:14px;z-index:7}
.bottombar>*{transition:opacity .3s,filter .3s}
.nbtn{height:58px;min-width:58px;padding:0 18px;border-radius:10px;border:2px solid var(--btn-line);background:var(--btn);font-size:20px;font-weight:700;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.nbtn:hover:not(:disabled){border-color:var(--gold)}
.nbtn:disabled{opacity:.35;cursor:default}
.nbtn.go{background:linear-gradient(180deg,var(--gold),var(--gold-2));border-color:var(--gold);color:var(--gold-ink);min-width:110px;font-size:var(--sm)}
.nbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.nlabel{font-size:20px;font-weight:700;width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.progress{flex:1;height:10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--panel-line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .3s}
.ncount{font-size:20px;font-weight:700;color:var(--muted);min-width:76px;text-align:right;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:6px;min-width:80px}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--gold)}
.pips i.on{background:var(--gold)}

/* ---------- Thành phần ---------- */
.btn{height:60px;padding:0 26px;border-radius:12px;border:2px solid var(--btn-line);background:var(--btn);font-size:var(--sm);font-weight:700}
.btn:hover{border-color:var(--gold)}
.btn[data-state="ok"]{border-color:var(--ok);background:var(--ok-soft)}
.btn[data-state="ok"]::before{content:"✓ ";color:var(--ok)}
.btn[data-state="bad"]{border-color:var(--bad);border-style:dashed;background:var(--bad-soft)}
.btn[data-state="bad"]::before{content:"✗ ";color:var(--bad)}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.fbk{font-size:var(--sm);font-weight:600;min-height:1.45em;margin:0;text-align:center}
.qa{display:grid;gap:14px;align-content:center}
.qa .q{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:14px 26px;border-radius:14px;border:2px solid var(--panel-line);background:var(--panel);font-size:var(--tx)}
.qa .a{font-weight:700;color:var(--gold)}
.qa .a .katex{color:var(--gold)}
.say{display:grid;gap:14px}
.say>div{font-size:var(--tx);font-weight:600;padding:12px 24px;border-left:6px solid var(--gold);border-radius:0 14px 14px 0;background:var(--panel)}

[data-step]:not(.on){visibility:hidden}
[data-unstep].gone{visibility:hidden}

/* ---------- SVG ---------- */
.rail{stroke:var(--panel-line);stroke-width:5}
.car{fill:var(--panel-2);stroke:var(--blue);stroke-width:3}
.car.last{stroke:var(--gold);stroke-width:5}
.carg.click{cursor:pointer}
.carg.click:hover .car{stroke:var(--gold)}
.carg[data-state="ok"] .car{stroke:var(--ok);stroke-width:5;fill:var(--ok-soft)}

/* máy công thức (hình động → lớn) */

body.gv .gvnote{display:block}
.menu{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);width:1300px;z-index:9;padding:24px;border-radius:18px;border:2px solid var(--panel-line);background:var(--panel)}

/* ===== LUYỆN TẬP ===== */

/* ===== BÀI 16 · PHÉP NHÂN SỐ NGUYÊN — thành phần riêng ===== */

/* ===== BÀI 6 · VECTƠ TRONG KHÔNG GIAN — thành phần riêng ===== */
/* --- hình không gian --- */
.f3d{position:relative;width:var(--fw);height:var(--fh);max-width:100%;max-height:100%;margin:auto;touch-action:none}
.f3d svg{display:block;width:100%;height:100%;overflow:visible;cursor:grab;user-select:none;-webkit-user-select:none}
.f3d.drag svg{cursor:grabbing}
.f3e{stroke:var(--fig-ink);stroke-width:3.5;stroke-linecap:round}
.f3e.hid{stroke:var(--fig-dim);stroke-width:2.6;stroke-dasharray:11 9}
.f3s{stroke:var(--fig-ink);stroke-width:3;stroke-linecap:round}
.f3s.hid{stroke:var(--fig-dim);stroke-width:2.6;stroke-dasharray:11 9}
.f3seg.gold .f3s{stroke:var(--gold)} .f3seg.blue .f3s{stroke:var(--blue)} .f3seg.dim .f3s{stroke:var(--fig-dim);stroke-dasharray:6 8}
.f3seg.thin .f3s{stroke-width:2}
.f3fill polygon{fill:var(--pl-a);stroke:none}
.f3fill.gold polygon{fill:var(--pl-b)} .f3fill.green polygon{fill:var(--pl-c)} .f3fill.grey polygon{fill:rgba(160,175,215,.16)}
.f3l{font-family:KaTeX_Math,"Times New Roman",serif;font-style:italic;font-size:34px;fill:var(--text);paint-order:stroke;stroke:var(--stage-a);stroke-width:7px;stroke-linejoin:round}
.f3vl{stroke-width:5;stroke-linecap:round;fill:none}
.f3vl.hid{stroke-dasharray:12 9;stroke-width:4.4}
.f3v.red .f3vl{stroke:#ff6b6b} .f3v.red .f3vh{fill:#ff6b6b}
.f3v.blue .f3vl{stroke:#5aa8ff} .f3v.blue .f3vh{fill:#5aa8ff}
.f3v.gold .f3vl{stroke:var(--gold)} .f3v.gold .f3vh{fill:var(--gold)}
.f3v.green .f3vl{stroke:#2fd27a} .f3v.green .f3vh{fill:#2fd27a}
.f3v.violet .f3vl{stroke:#c08bff} .f3v.violet .f3vh{fill:#c08bff}
:root[data-mb="light"] .f3v.red .f3vl{stroke:#d63031} :root[data-mb="light"] .f3v.red .f3vh{fill:#d63031}
:root[data-mb="light"] .f3v.blue .f3vl{stroke:#1d6fe0} :root[data-mb="light"] .f3v.blue .f3vh{fill:#1d6fe0}
:root[data-mb="light"] .f3v.green .f3vl{stroke:#0f8a44} :root[data-mb="light"] .f3v.green .f3vh{fill:#0f8a44}
:root[data-mb="light"] .f3v.violet .f3vl{stroke:#7b3fd1} :root[data-mb="light"] .f3v.violet .f3vh{fill:#7b3fd1}
.f3vt{font-family:KaTeX_Math,"Times New Roman",serif;font-style:italic;font-size:34px;fill:currentColor;paint-order:stroke;stroke:var(--stage-a);stroke-width:7px}
.f3va{fill:none;stroke-width:2.4;stroke:currentColor}
.f3v.red{color:#ff6b6b} .f3v.blue{color:#5aa8ff} .f3v.gold{color:var(--gold)} .f3v.green{color:#2fd27a} .f3v.violet{color:#c08bff}
:root[data-mb="light"] .f3v.red{color:#d63031} :root[data-mb="light"] .f3v.blue{color:#1d6fe0} :root[data-mb="light"] .f3v.green{color:#0f8a44} :root[data-mb="light"] .f3v.violet{color:#7b3fd1}
.f3dot circle{fill:var(--gold);stroke:var(--stage-a);stroke-width:2}
.f3tick line{stroke:var(--gold);stroke-width:3}
.f3arc polyline{fill:none;stroke:var(--gold);stroke-width:4}
.f3al{font-family:var(--font);font-size:28px;font-weight:700;fill:var(--gold);paint-order:stroke;stroke:var(--stage-a);stroke-width:6px}
.f3rot{position:absolute;right:0;bottom:-10px;transform:scale(.85);transform-origin:100% 100%;display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;border:2px solid var(--panel-line);background:var(--panel);font-size:20px;font-weight:700;color:var(--muted);opacity:.85}
.f3rot input{width:180px;height:24px;accent-color:var(--gold)}
.f3rot:hover{opacity:1;border-color:var(--gold)}
/* nhãn đỉnh/vectơ phải đổi màu viền halo theo nền */
:root[data-mb="light"] .f3l,:root[data-mb="light"] .f3vt,:root[data-mb="light"] .f3al{stroke:#f4f6fd}
/* --- hình 2D --- */
.v2{display:block;overflow:visible}

.v2 .lbl{font-family:var(--font);font-size:26px;font-weight:700;fill:var(--muted);paint-order:stroke;stroke:var(--stage-a);stroke-width:6px}
:root[data-mb="light"] .v2 .lab,:root[data-mb="light"] .v2 .lbl{stroke:#f4f6fd}
.ctl{display:flex;align-items:center;justify-content:center;gap:20px;font-size:var(--sm);font-weight:700;color:var(--muted)}
.ctl input[type=range]{width:520px}

/* --- thẻ định nghĩa/tri thức trên slide (không phải ghi vở) --- */
.kbox{border-radius:18px;border:2px solid var(--gold);background:linear-gradient(var(--gold-soft),var(--gold-soft)),var(--panel);padding:20px 28px;font-size:var(--tx);font-weight:600;line-height:1.45}
.kbox .kw{color:var(--gold)}
.sayv>div{font-size:var(--tx)}
.say .q2{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-right:54px}
.qa .q .ach .btn{min-width:120px}
.vs{display:inline-flex;gap:10px}
.lead.c{text-align:center}

.cols>.fig{height:100%}

.ach.wide .btn{min-width:110px;padding:0 18px}
.proof{display:grid;gap:12px;align-content:center}
.proof .pr{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:38px;font-weight:600;padding:10px 54px 10px 22px;border-radius:14px;border:2px solid var(--panel-line);background:var(--panel);position:relative}

.proof .pr .ach{justify-self:auto}

.calc3 .cr{grid-template-columns:minmax(0,1fr) auto}

.calc3.sm .cr .why{font-size:24px}
.nomic{height:44px;padding:0 14px;display:inline-flex;align-items:center;border-radius:10px;font-size:18px;font-weight:700;color:var(--dim);border:2px dashed var(--panel-line);white-space:nowrap}

/* hình 3D luôn nằm gọn trong ô hình, không đè thanh trạm dừng */
.fig>.f3d{position:absolute;inset:0;margin:auto;width:100%;height:100%;max-width:var(--fw);max-height:var(--fh)}

.ach .btn{height:auto;min-height:60px;padding:6px 20px;line-height:1.25}
.lead{margin:0}
.slide>.lead{flex:0 0 auto}
/* bìa: chọn phần học */
.cover .cvr{display:grid;grid-template-rows:380px auto;gap:6px;align-self:stretch;align-content:center;min-width:0}
.cover .cvr .fig{height:380px;position:relative}

.pcard{display:grid;gap:4px;text-align:left;padding:14px 20px 12px;border-radius:16px;border:2px solid var(--panel-line);background:var(--panel);color:var(--text);cursor:pointer;font:inherit}

.cover .pending{justify-self:end;margin:0;padding:6px 16px;border-radius:12px;border:2px dashed var(--gold);font-size:22px;font-weight:700;color:var(--gold);background:var(--gold-soft)}
.cover .cvr:has(.pending){grid-template-rows:auto 340px auto}
.cover .cvr:has(.pending) .fig{height:340px}
.btn .m,.btn .katex,.btn .katex *{pointer-events:none}
/* ===== BÀI 7 · HỆ TRỤC TOẠ ĐỘ — thành phần riêng ===== */
.f3v.axis .f3vl{stroke:var(--fig-ink);stroke-width:3.4} .f3v.axis .f3vh{fill:var(--fig-ink)}
.f3seg.grid .f3s{stroke:var(--fig-dim);stroke-width:1.6;opacity:.55}
.f3seg.green .f3s{stroke:#2fd27a;stroke-width:3.6} :root[data-mb="light"] .f3seg.green .f3s{stroke:#0f8a44}
.f3seg.gdash .f3s{stroke:var(--gold);stroke-width:3;stroke-dasharray:9 8}
.f3seg.bdash .f3s{stroke:#5aa8ff;stroke-width:3;stroke-dasharray:9 8} :root[data-mb="light"] .f3seg.bdash .f3s{stroke:#1d6fe0}
.f3fill.blue polygon{fill:rgba(90,168,255,.14)} .f3fill.pink polygon{fill:rgba(255,120,170,.13)} .f3fill.mint polygon{fill:rgba(47,210,122,.12)}
.f3tx text{font-family:var(--font);font-size:28px;font-weight:700;fill:var(--gold);paint-order:stroke;stroke:var(--stage-a);stroke-width:6px;stroke-linejoin:round}
.f3tx.mut text{fill:var(--muted)} .f3tx.math text{font-family:KaTeX_Main,"Times New Roman",serif;font-weight:400;font-size:30px;fill:var(--text)}
:root[data-mb="light"] .f3tx text{stroke:#f4f6fd}
.coord{display:inline-flex;align-items:center;gap:6px;font-size:38px;font-weight:600}
.coord .ain{--w:110px}
.tri{display:grid;gap:12px}
.ctl.xyz{gap:12px}
.ctl.xyz input[type=range]{width:150px}
.ctl.xyz output{min-width:0}
/* vectơ đơn vị i, j, k: nét đậm, ba màu riêng */
.f3v.ui,.f3v.uj,.f3v.uk{color:inherit}
.f3v.ui{color:#ff5a5f} .f3v.ui .f3vl{stroke:#ff5a5f;stroke-width:7.5} .f3v.ui .f3vh{fill:#ff5a5f}
.f3v.uj{color:#2fd27a} .f3v.uj .f3vl{stroke:#2fd27a;stroke-width:7.5} .f3v.uj .f3vh{fill:#2fd27a}
.f3v.uk{color:#4c8eff} .f3v.uk .f3vl{stroke:#4c8eff;stroke-width:7.5} .f3v.uk .f3vh{fill:#4c8eff}
.f3v.ui .f3vl.hid,.f3v.uj .f3vl.hid,.f3v.uk .f3vl.hid{stroke-width:6;stroke-dasharray:7 6;stroke-linecap:butt}
:root[data-mb="light"] .f3v.ui{color:#d63031} :root[data-mb="light"] .f3v.ui .f3vl{stroke:#d63031} :root[data-mb="light"] .f3v.ui .f3vh{fill:#d63031}
:root[data-mb="light"] .f3v.uj{color:#0f8a44} :root[data-mb="light"] .f3v.uj .f3vl{stroke:#0f8a44} :root[data-mb="light"] .f3v.uj .f3vh{fill:#0f8a44}
:root[data-mb="light"] .f3v.uk{color:#1d6fe0} :root[data-mb="light"] .f3v.uk .f3vl{stroke:#1d6fe0} :root[data-mb="light"] .f3v.uk .f3vh{fill:#1d6fe0}
.f3seg.axl .f3s{stroke:var(--fig-ink);stroke-width:3.4} .f3seg.axl .f3s.hid{stroke:var(--fig-dim);stroke-width:2.6;stroke-dasharray:11 9}
/* ===== BÀI 8 · CHUẨN TRÌNH BÀY MỚI (góp ý của thầy 09/10/2026) =====
   - Đề bài mọi thể loại: khung vàng, chữ lớn, mỗi ý a) b) c) một dòng.
   - Giãn cách cân đối: đề bài ngay dưới tiêu đề, lời giải ngay dưới đề bài, các dòng lời giải cách đều, thoáng. */
.slide{gap:26px}
.de{flex:0 0 auto;margin:0;padding:18px 30px 20px;border:3px solid var(--gold);border-radius:18px;
  background:linear-gradient(var(--gold-soft),var(--gold-soft)),var(--panel);font-size:36px;font-weight:600;line-height:1.5;color:var(--text)}
.de .it{display:block;margin-top:6px}
.de .tg{display:inline-block;margin-right:14px;padding:0 14px;border-radius:10px;background:linear-gradient(180deg,var(--gold),var(--gold-2));color:var(--gold-ink);font-size:28px;font-weight:700;line-height:1.5;vertical-align:2px}

.calc3{flex:0 1 auto;align-content:start;gap:22px}

/* cột: hình bên trái, (đề bài + lời giải) bên phải, căn từ trên xuống */
.cols{align-items:stretch}
.side{min-height:0;display:flex;flex-direction:column;gap:24px}
.side>.de{font-size:34px;line-height:1.45}

/* điều khiển góc nhìn hình không gian */
.f3ctl{position:absolute;right:0;bottom:-12px;display:flex;align-items:center;gap:10px;padding:5px 10px 5px 16px;border-radius:999px;border:2px solid var(--panel-line);background:var(--panel);
  font-size:20px;font-weight:700;color:var(--muted);opacity:.9;transform:scale(.86);transform-origin:100% 100%;z-index:3}

$('#brand').innerHTML = '<span class="logo">' + LOGO + '<span class="mb">MB</span></span><span><b>Mr Black</b><small>Toán THPT</small></span>';
function setPhoto(src){
  const logo = $('#brand .logo'); let img = logo.querySelector('img');
  if (!src){ if (img) img.remove(); $('#brand').classList.remove('has-photo'); return; }
  if (!img){ img = document.createElement('img'); img.alt = 'Ảnh giáo viên'; logo.appendChild(img); }
  img.src = src; $('#brand').classList.add('has-photo');
}
(function(){ let saved = ''; try { saved = localStorage.getItem('mrblack-photo') || ''; } catch (e) {} setPhoto(TEACHER_PHOTO || saved); })();
$('#brand').addEventListener('click', () => $('#photo-input').click());
$('#photo-input').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const S = 200, cv = document.createElement('canvas'); cv.width = S; cv.height = S;
      const s = Math.min(im.width, im.height), cx = cv.getContext('2d');
      cx.drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, S, S);
      const url = cv.toDataURL('image/jpeg', .85); setPhoto(url);
      try { localStorage.setItem('mrblack-photo', url); } catch (err) {}
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(f); e.target.value = '';
});

/* ---------- Công thức ---------- */
function texAll(root){
  if (!window.katex) return;
  root.querySelectorAll('.m:not([data-k]),.md:not([data-k])').forEach(e => {
    try { katex.render(e.textContent, e, {displayMode: e.classList.contains('md'), throwOnError: false, strict: false}); e.dataset.k = '1'; } catch (err) {}
  });
}
/* đọc số học sinh nhập: 3/4, -1/2, 0,75, 45°, 0.96 … */
function parseNum(str){

  const cnt = [0, 0, 0, 0, 0]; items.forEach(i => cnt[i.c]++);

  let t = 0; const start = [];
  [0, 1, 2, 3, 4].forEach(c => { start[c] = t; if (cnt[c]) t += gap[c] * (cnt[c] - 1) + (c === 0 ? 0.45 : c === 1 ? 0.1 : 0.5); });
  if (cnt[1] && cnt[0]) start[1] = Math.max(0, start[1] - 0.35);
  const seen = [0, 0, 0, 0, 0], grp = new Map();
  items.forEach(({e, c}) => {
    /* các nét trong cùng một vectơ (thân, đầu, nhãn) vẽ liền nhau */
    let d;
    if (c === 3){ const g = e.closest('.f3v'); if (!grp.has(g)) grp.set(g, start[3] + gap[3] * seen[3]++); d = grp.get(g); }
    else d = start[c] + gap[c] * seen[c]++;

}

function station(sec, cfg){
  const st = {id: cfg.id, gate: cfg.gate || 0, done: false, attempts: 0, review: false, items: {}, cfg};
  const foot = sec.querySelector(`.stfoot[data-st="${cfg.id}"]`), fb = foot.querySelector('.stfb');
  const B = a => foot.querySelector(`[data-a=${a}]`);
  cfg.items.forEach(it => {
    const el = sec.querySelector(`[data-it="${cfg.id}:${it.id}"]`), I = {cfg: it, el, ok: false, bad: false, val: null};
    st.items[it.id] = I;
    if (it.kind === 'choice'){
      el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { if (I.ok || I.bad) return; el.querySelectorAll('button').forEach(x => x.removeAttribute('data-state')); b.dataset.state = 'sel'; I.val = +b.dataset.v; }));
    } else {
      const inp = el.querySelector('input');
      inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); check(); } e.stopPropagation(); });
      inp.addEventListener('input', () => { el.removeAttribute('data-state'); });
    }
  });
  const setMark = (I, s) => { if (s) I.el.dataset.state = s; else I.el.removeAttribute('data-state'); I.el.querySelector('.mk').textContent = s === 'ok' ? '✓' : s === 'bad' ? '✗' : ''; };
  const lock = (I, on) => { if (I.cfg.kind === 'choice') I.el.querySelectorAll('button').forEach(b => { b.disabled = on; }); else I.el.querySelector('input').disabled = on; };
  function diag(I, v){
    if (I.cfg.diag){ const d = I.cfg.diag(v); if (d) return d; }
    return I.cfg.why || 'Chưa đúng.';
  }
  const isOk = I => I.cfg.kind === 'choice' ? I.val === I.cfg.ans : near(I.val, I.cfg.ans, I.cfg.tol);
  function check(){
    if (st.done || st.review) return;
    const open = Object.values(st.items).filter(I => !I.ok);
    let empty = false;
    open.forEach(I => { if (I.cfg.kind === 'choice'){ if (I.val === null) empty = true; } else { const raw = I.el.querySelector('input').value; I.val = parseNum(raw); if (raw.trim() === '') empty = true; } });
    if (empty){ fb.className = 'stfb'; fb.innerHTML = 'Con hoàn thành đủ tất cả các ô rồi bấm <b>Kiểm tra</b> nhé.'; return; }
    const notNum = open.find(I => I.cfg.kind !== 'choice' && isNaN(I.val));
    if (notNum){ fb.className = 'stfb'; fb.innerHTML = 'Có ô chưa phải là một số. Ví dụ cách viết: <b>45</b>, <b>1/2</b> hoặc <b>0,96</b>.'; return; }
    const wrong = [];
    open.forEach(I => {
      if (isOk(I)){ I.ok = true; setMark(I, 'ok'); lock(I, true); if (I.cfg.kind === 'choice') I.el.querySelector(`[data-v="${I.val}"]`).dataset.state = 'ok'; }
      else { I.bad = true; setMark(I, 'bad'); lock(I, true); if (I.cfg.kind === 'choice') I.el.querySelector(`[data-v="${I.val}"]`).dataset.state = 'bad'; wrong.push(I); }
    });
    if (!wrong.length){
      st.done = true; fb.className = 'stfb ok'; fb.innerHTML = '<b>✓ Chính xác!</b> Bấm ▶ để sang nhiệm vụ tiếp theo.';
      B('chk').disabled = true; B('rev').disabled = true; B('rev').classList.remove('pulse'); B('sol').disabled = false;
      if (cfg.onDone) cfg.onDone(sec); gateUI(); document.dispatchEvent(new CustomEvent('station-done', {detail: {id: cfg.id, attempts: st.attempts}})); return;
    }
    st.attempts++; st.review = true;
    fb.className = 'stfb bad'; fb.innerHTML = wrong.map(I => `<span class="why"><b>${I.cfg.name}</b> ${diag(I, I.val)}</span>`).join('') + '<span class="why go">Bấm <b>📖 Xem lại</b>, đọc lại kiến thức rồi làm lại các ô màu đỏ.</span>';
    texAll(fb);
    B('chk').disabled = true; B('rev').disabled = false; B('rev').classList.add('pulse');
  }
  function retry(){
    st.review = false; B('rev').classList.remove('pulse'); B('rev').disabled = true; B('chk').disabled = false;
    if (st.attempts >= (cfg.solAfter || 2)) B('sol').disabled = false;
    let first = null;
    Object.values(st.items).forEach(I => { if (!I.bad) return; I.bad = false; I.val = null; setMark(I, null); lock(I, false);
      if (I.cfg.kind === 'choice') I.el.querySelectorAll('button').forEach(b => b.removeAttribute('data-state')); else { const inp = I.el.querySelector('input'); inp.value = ''; first = first || inp; } });
    fb.className = 'stfb'; fb.innerHTML = 'Làm lại các ô màu đỏ rồi bấm <b>Kiểm tra</b>.' + (st.attempts >= (cfg.solAfter || 2) ? ' Cần thì mở <b>💡 Lời giải chi tiết</b>.' : '');
    if (first) setTimeout(() => first.focus(), 50);
  }
  B('chk').addEventListener('click', check);
  B('rev').addEventListener('click', () => { const keys = Object.values(st.items).filter(I => I.bad).map(I => I.cfg.review || cfg.review); showTheory(keys, retry); });
  B('sol').addEventListener('click', () => openModal(`<div class="tab">💡 LỜI GIẢI CHI TIẾT</div>${cfg.title ? `<h3>${cfg.title}</h3>` : ''}${lis(cfg.items.map(it => cfg.solNoName ? it.sol : `<b class="kw">${it.name}</b> ${it.sol}`))}<div class="row" style="justify-content:flex-end;margin-top:26px"><button class="btn gold" type="button" data-a="close">Đóng</button></div>`));
  return st;
}

/* ================= HÌNH ================= */
const RAD = Math.PI / 180;
/* hình chiếu của X lên mặt phẳng nằm ngang z = z0 theo phương u */
const prj = (X, u, z0 = 0) => V3.sub(X, V3.mul(u, (X[2] - z0) / u[2]));
/* phương chiếu: góc phương vị φ (độ), độ nghiêng k */
const dirOf = (phi, k = 0.5) => [k * Math.cos(phi * RAD), k * Math.sin(phi * RAD), 1];
/* đường cong (đường tròn, elip) vẽ bằng nhiều đoạn nhỏ */
const ring = (pts, cls, ly, step) => pts.map((p, i) => ({a: p, b: pts[(i + 1) % pts.length], cls, ly, step}));
const circ3 = (O, u, v, n = 48) => [...Array(n).keys()].map(i => { const a = 2 * Math.PI * i / n; return V3.add(O, V3.add(V3.mul(u, Math.cos(a)), V3.mul(v, Math.sin(a)))); });

/* ---- HĐ3: ba hình vẽ hình lập phương (2D) ---- */
function cube2(kind){
  const s = 130, X = 40, Y = 80, dx = 55, dy = -45;
  const F = [[X, Y], [X + s, Y], [X + s, Y + s], [X, Y + s]]; let Bk = F.map(([x, y]) => [x + dx, y + dy]);
  if (kind === 'b') Bk[1] = [X + s + dx - 6, Y + dy + 34];     /* một đỉnh bị đặt lệch: mặt bên không còn là hình bình hành */
  if (kind === 'c'){ const V = [X + s + 110, Y - 110], k = 0.6; Bk = F.map(([x, y]) => [V[0] + (x - V[0]) * k, V[1] + (y - V[1]) * k]); }   /* các cạnh bên hội tụ: không còn song song */
  const L = (p, q, h) => `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" class="${h ? 'hid' : ''}"/>`;
  /* đỉnh khuất: đỉnh mặt sau ứng với đỉnh dưới-trái của mặt trước */
  let out = F.map((p, i) => L(p, F[(i + 1) % 4])).join('');
  out += [0, 1, 2, 3].map(i => L(Bk[i], Bk[(i + 1) % 4], i === 2 || i === 3)).join('');
  out += [0, 1, 2, 3].map(i => L(F[i], Bk[i], i === 3)).join('');
  return `<svg class="cube2" viewBox="0 0 250 230" role="img" aria-label="Hình vẽ ${kind}">${out}</svg>`;
}
