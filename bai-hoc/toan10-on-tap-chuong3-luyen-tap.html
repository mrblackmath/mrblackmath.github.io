<style>
/* MR BLACK NBK — HỆ THỐNG SLIDE TỔNG HỢP KIẾN THỨC CHƯƠNG (Loại B · P1)
   Kế thừa token & bố cục sân khấu 1920×1080 của bài giảng T12-B7 (Design System v1.0). */
:root{
  --stage-a:#070d24; --stage-b:#13245e;
  --panel:#0f1a3f; --panel-2:#16245a; --panel-line:#2f4488;
  --text:#f5f7fc; --muted:#b4c0e2; --dim:#7f8db8;
  --gold:#ffc83d; --gold-2:#ff9f1c; --gold-ink:#1a1204; --gold-soft:rgba(255,200,61,.14);
  --blue:#4c8eff; --blue-soft:rgba(76,142,255,.16);
  --ok:#2fd27a; --ok-soft:rgba(47,210,122,.16); --bad:#ff5a5f; --bad-soft:rgba(255,90,95,.16);
  --fig-ink:#f5f7fc; --fig-dim:#9fb0da; --fig-faint:#26386f; --hatch:#8fa3d9;
  --sol:rgba(76,142,255,.22); --sol-line:#5aa8ff;
  --btn:#1b2a63; --btn-line:#3a55a8; --input-bg:#060b1f;
  --font:"Chakra Petch","Bahnschrift","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans",sans-serif;
  --h:42px; --tx:32px; --sm:25px; --line:1.42;
  color-scheme:dark;
}
:root[data-mb="light"]{
  --stage-a:#e9eefb; --stage-b:#f8f9fe;
  --panel:#ffffff; --panel-2:#f2f5fd; --panel-line:#c6d1ee;
  --text:#0d1433; --muted:#3c4870; --dim:#6b7699;
  --gold:#b87a00; --gold-2:#a86400; --gold-ink:#ffffff; --gold-soft:rgba(201,136,0,.12);
  --blue:#1d4ed8; --blue-soft:rgba(29,78,216,.1);
  --ok:#0f8a44; --ok-soft:rgba(15,138,68,.12); --bad:#c62828; --bad-soft:rgba(198,40,40,.1);
  --fig-ink:#0d1433; --fig-dim:#5b6892; --fig-faint:#dfe5f5; --hatch:#7d8bb3;
  --sol:rgba(29,78,216,.14); --sol-line:#1d6fe0;
  --btn:#ffffff; --btn-line:#b9c6ea; --input-bg:#ffffff;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--stage-a);color:var(--text);font-family:var(--font);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
#viewport{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% -10%,var(--stage-b),var(--stage-a) 70%)}
#canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;font-size:var(--tx);line-height:var(--line)}
.katex{font-size:1.04em}
b{font-weight:700}
.gold-t{color:var(--gold)} .ok-t{color:var(--ok)} .bad-t{color:var(--bad)} .blue-t{color:var(--blue)} .muted{color:var(--muted)}
.gold-t .katex{color:var(--gold)}

/* ---------- thanh trên ---------- */
.topbar{position:absolute;left:48px;right:48px;top:22px;height:66px;display:flex;align-items:center;gap:22px;z-index:3}
.brand{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;text-align:left;flex:0 0 auto}
.brand .logo{width:60px;height:60px;position:relative}
.brand .logo svg{width:60px;height:60px;display:block}
.brand .logo img{position:absolute;inset:4px;width:52px;height:52px;object-fit:cover;border-radius:10px}
.brand b{display:block;font-size:var(--sm);line-height:1}
.brand small{display:block;margin-top:5px;font-size:15px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.mb{position:absolute;right:-8px;bottom:-6px;padding:1px 5px;border-radius:6px;font-size:13px;font-weight:700;line-height:1.2;color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2));box-shadow:0 0 0 2px var(--stage-a)}
.brand:not(.has-photo) .mb{display:none}
.secs{margin-left:auto;display:flex;align-items:center}
.secs button{position:relative;height:46px;padding:0 13px;display:inline-flex;align-items:center;font-size:19px;font-weight:700;color:var(--dim);border:0;border-bottom:3px solid var(--panel-line);background:none;white-space:nowrap}
.secs button:hover{color:var(--text)}
.secs button.seen{color:var(--muted)}
.secs button.seen::after{content:"";position:absolute;right:4px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.secs button.cur{color:var(--gold);border-bottom-color:var(--gold)}

.stage{position:absolute;left:48px;right:48px;top:106px;bottom:108px;z-index:2}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;gap:22px}
.watermark{position:absolute;right:0;bottom:-6px;font-size:100px;font-weight:700;color:var(--text);opacity:.045;pointer-events:none;line-height:1}

/* đề mục */
.hd{flex:0 0 auto;display:flex;align-items:stretch;border-radius:16px;overflow:hidden;border:2px solid var(--gold);background:var(--panel)}
.hd .sn{flex:0 0 auto;min-width:88px;padding:0 20px;display:grid;place-items:center;font-size:var(--h);font-weight:700;color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2))}
.hd .st{flex:0 0 auto;padding:12px 26px;font-size:var(--h);font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center}
.hd .ss{flex:1 1 auto;padding:12px 26px;font-size:var(--h);font-weight:700;display:flex;align-items:center;border-left:2px solid var(--panel-line)}
.hd .kid{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 18px}
.kchip{display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:999px;border:2px solid var(--panel-line);font-size:18px;font-weight:700;color:var(--muted)}

.cols{flex:1 1 auto;min-height:0;display:grid;gap:30px}
.cols>*{min-width:0;min-height:0}
.box{border-radius:18px;border:2px solid var(--panel-line);background:var(--panel);padding:18px 26px}
.kbox{border-radius:18px;border:2px solid var(--gold);background:linear-gradient(var(--gold-soft),var(--gold-soft)),var(--panel);padding:18px 26px;font-weight:600}
.kbox .kw,.kw{color:var(--gold)}
.ttl{display:block;font-size:var(--sm);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.de{border-radius:18px;border:3px solid var(--gold);background:var(--panel);padding:14px 24px;font-size:var(--tx);font-weight:600}
.de .tag{display:inline-block;margin-right:10px;padding:0 12px;border-radius:9px;background:linear-gradient(180deg,var(--gold),var(--gold-2));color:var(--gold-ink);font-size:var(--sm);font-weight:700}
ul.dot{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.dot li{position:relative;padding-left:32px}
ul.dot li::before{content:"";position:absolute;left:4px;top:.55em;width:13px;height:13px;border-radius:4px;background:var(--gold)}
ul.dot li.l2{padding-left:70px;font-weight:500}
ul.dot li.l2::before{left:38px;top:.7em;width:20px;height:4px;border-radius:2px;background:var(--muted)}
.vstack{display:flex;flex-direction:column;gap:16px;min-height:0}
.fill{flex:1 1 auto;min-height:0}

/* nút */
.btn{min-height:56px;padding:6px 22px;border-radius:12px;border:2px solid var(--btn-line);background:var(--btn);font-size:var(--sm);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:default}
.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold-2));border-color:var(--gold);color:var(--gold-ink)}
.btn.sm{min-height:46px;font-size:21px;padding:4px 16px}
.btn[aria-pressed="true"],.btn.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;flex-wrap:wrap;gap:8px}

/* thanh dưới */
.bottombar{position:absolute;left:48px;right:48px;bottom:22px;height:64px;display:flex;align-items:center;gap:12px;z-index:7}
.nbtn{height:58px;min-width:58px;padding:0 16px;border-radius:10px;border:2px solid var(--btn-line);background:var(--btn);font-size:19px;font-weight:700;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.nbtn:hover:not(:disabled){border-color:var(--gold)}
.nbtn:disabled{opacity:.35;cursor:default}
.nbtn.go{background:linear-gradient(180deg,var(--gold),var(--gold-2));border-color:var(--gold);color:var(--gold-ink);min-width:104px;font-size:var(--sm)}
.nbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.nlabel{font-size:20px;font-weight:700;width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.progress{flex:1;height:10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--panel-line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .3s}
.ncount{font-size:20px;font-weight:700;color:var(--muted);min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:6px}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--gold)}
.pips i.on{background:var(--gold)}
.menu{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);width:1500px;z-index:9;padding:22px;border-radius:18px;border:2px solid var(--panel-line);background:var(--panel);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.menu .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu button{text-align:left;padding:12px 16px;border-radius:12px;border:2px solid var(--panel-line);background:var(--btn);font-size:21px;font-weight:700}
.menu button:hover{border-color:var(--gold)}
.menu button.cur{border-color:var(--gold);color:var(--gold)}
.gvnote{position:absolute;left:0;right:0;bottom:-6px;z-index:8;display:none;padding:10px 18px;border-radius:14px;border:2px dashed var(--gold);background:var(--panel);font-size:20px;font-weight:600;color:var(--muted);line-height:1.4}
body.gv .gvnote{display:block}
#nojs{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#0b1024;color:#fff;font:600 18px system-ui,sans-serif}
.js #nojs{display:none}
#rotate{position:fixed;inset:0;z-index:998;display:none;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:rgba(6,9,20,.94);color:#fff;font:600 19px system-ui,sans-serif;text-align:center;padding:28px}
#rotate button{font:700 16px system-ui,sans-serif;background:#ffc83d;border:0;border-radius:10px;padding:10px 18px;color:#0a0c12}
@media (orientation:portrait) and (max-width:900px){.js:not(.keep-portrait) #rotate{display:flex}}
.fade{animation:fd .35s ease-out}
@keyframes fd{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[data-step]:not(.on){visibility:hidden}

/* ---------- bìa ---------- */
.cover{flex:1;display:grid;grid-template-columns:820px 1fr;gap:56px;align-items:center}
.avatar{position:relative;width:180px;height:180px;border-radius:28px;padding:6px;background:linear-gradient(180deg,#ffe28a,var(--gold) 45%,var(--gold-2));box-shadow:0 0 50px rgba(255,200,61,.35)}
.avatar img{display:block;width:100%;height:100%;object-fit:cover;border-radius:22px}
.avatar svg{width:100%;height:100%}
.avatar .mb{right:-14px;bottom:-12px;font-size:24px;padding:3px 12px;border-radius:10px;box-shadow:0 0 0 4px var(--stage-a)}
.cover .eb{margin:26px 0 0;font-size:var(--sm);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.cover h1{margin:12px 0 0;font-size:92px;line-height:1.02;letter-spacing:-.02em}
.cover h1 span{display:block;font-size:54px;line-height:1.15;margin-top:12px;background:linear-gradient(180deg,#ffe28a,var(--gold) 50%,var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-mb="light"] .cover h1 span{background:none;color:var(--gold)}
.cover .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.cover .chips span{height:42px;padding:0 16px;display:inline-flex;align-items:center;border-radius:999px;border:2px solid var(--panel-line);background:var(--panel);font-size:20px;font-weight:700;color:var(--muted)}
.cover .sig{margin-top:22px;font-size:var(--sm);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.cover .sig b{color:var(--gold)}
.cmenu{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmenu .pk{grid-column:1/-1;margin:0;font-size:var(--sm);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.ccard{display:grid;gap:4px;text-align:left;padding:14px 20px;border-radius:16px;border:2px solid var(--panel-line);background:var(--panel);cursor:pointer}
.ccard:hover,.ccard:focus-visible{border-color:var(--gold);outline:none}
.ccard .pn{font-size:18px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.ccard b{font-size:27px;line-height:1.2}
.ccard small{font-size:19px;color:var(--muted);font-weight:600}
.ccard.wide{grid-column:1/-1;border-color:var(--gold);background:linear-gradient(var(--gold-soft),var(--gold-soft)),var(--panel)}

/* ---------- sơ đồ chương ---------- */
.cmap{position:relative;flex:1 1 auto;min-height:0}
.cmap>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cmap .arw{stroke:var(--gold);stroke-width:4;fill:none}
.cmap .arh{fill:var(--gold)}
.cmap .alab{font-family:var(--font);font-size:21px;font-weight:700;fill:var(--muted);paint-order:stroke;stroke:var(--stage-a);stroke-width:7px}
.node{position:absolute;display:flex;flex-direction:column;gap:6px;padding:16px 22px;border-radius:18px;border:2px solid var(--panel-line);background:var(--panel);cursor:pointer;text-align:left}
.node:hover,.node:focus-visible{border-color:var(--gold);outline:none;box-shadow:0 0 0 6px var(--gold-soft)}
.node .nn{display:flex;align-items:center;gap:12px;font-size:28px;font-weight:700}
.node .nn i{font-style:normal;width:44px;height:44px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;font-size:24px;color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2))}
.node .nf{font-size:26px;font-weight:600;color:var(--muted)}
.node .go{margin-top:auto;font-size:19px;font-weight:700;color:var(--gold);letter-spacing:.08em}

/* ---------- thẻ mở rộng ---------- */
.acc{border-radius:16px;border:2px solid var(--panel-line);background:var(--panel);overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;gap:14px;padding:12px 20px;border:0;background:none;text-align:left;font-size:var(--tx);font-weight:700}
.acc>button::after{content:"+";margin-left:auto;font-size:34px;color:var(--gold);line-height:1}
.acc.open>button::after{content:"–"}
.acc.open{border-color:var(--gold)}
.acc .ab{display:none;padding:0 22px 16px;font-size:30px;font-weight:600}
.acc.open .ab{display:block}

/* ---------- lật thẻ ---------- */
.flips{display:grid;gap:16px}
.flip{position:relative;perspective:1200px;border:0;padding:0;background:none;min-height:150px;text-align:center}
.flip .in{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 16px}
.flip .fa{border:2px solid var(--btn-line);background:var(--panel);font-size:32px;font-weight:600}
.flip .fa small{font-size:18px;font-weight:700;letter-spacing:.12em;color:var(--dim)}
.flip:hover .fa{border-color:var(--gold)}
.flip .fb{transform:rotateY(180deg);font-size:24px;font-weight:600;line-height:1.3}
.flip .fb.y{border:3px solid var(--ok);background:linear-gradient(var(--ok-soft),var(--ok-soft)),var(--panel)}
.flip .fb.n{border:3px dashed var(--bad);background:linear-gradient(var(--bad-soft),var(--bad-soft)),var(--panel)}
.flip .fb b{font-size:28px}
.flip .fb.y b{color:var(--ok)} .flip .fb.n b{color:var(--bad)}
.flip .fb.w{border:3px dashed var(--bad);background:linear-gradient(var(--bad-soft),var(--bad-soft)),var(--panel)}
.flip .fa.w{border:2px dashed var(--bad);font-size:26px;line-height:1.3}
.flip .fa.w small{color:var(--bad)}
.flip .fb.r{border:3px solid var(--ok);background:linear-gradient(var(--ok-soft),var(--ok-soft)),var(--panel);font-size:23px;text-align:left;align-items:flex-start}
.flip .fb.r b{color:var(--ok);font-size:22px;letter-spacing:.1em}

/* ---------- đồ thị ---------- */
.plot{position:relative;min-height:0;display:grid;place-items:center}
.plot svg{display:block;width:100%;height:100%;overflow:visible;user-select:none;-webkit-user-select:none;touch-action:none}
.pg .gl{stroke:var(--fig-faint);stroke-width:1.5}
.pg .ax{stroke:var(--fig-ink);stroke-width:3}
.pg .axh{fill:var(--fig-ink)}
.pg .tk{font-family:KaTeX_Main,"Times New Roman",serif;font-size:24px;fill:var(--muted);paint-order:stroke;stroke:var(--stage-a);stroke-width:6px}
.pg .al{font-family:KaTeX_Math,"Times New Roman",serif;font-style:italic;font-size:32px;fill:var(--text);paint-order:stroke;stroke:var(--stage-a);stroke-width:7px}
.pg .ln{stroke:#ff6b6b;stroke-width:4;stroke-linecap:round}
.pg .ln.dash{stroke-dasharray:14 10}
.pg .ln.c1{stroke:#ff6b6b} .pg .ln.c2{stroke:#5aa8ff} .pg .ln.c3{stroke:#2fd27a} .pg .ln.c4{stroke:#c08bff}
.pg .ll{font-family:KaTeX_Main,"Times New Roman",serif;font-size:27px;paint-order:stroke;stroke:var(--stage-a);stroke-width:7px;fill:#ff8f8f}
.pg .ll.c2{fill:#7ab9ff} .pg .ll.c3{fill:#45dd8a} .pg .ll.c4{fill:#cfa3ff}
.pg .ht{stroke:none}
.pg .sol{fill:var(--sol);stroke:none}
.pg .pt{fill:var(--gold);stroke:var(--stage-a);stroke-width:3}
.pg .pt.ok{fill:var(--ok)} .pg .pt.bad{fill:none;stroke:var(--bad);stroke-width:4}

/* bảng log / bước */

.stepper{display:inline-flex;align-items:center;gap:6px;font-size:28px;font-weight:700}

.custom{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-radius:14px;border:2px dashed var(--panel-line)}
.chk{display:flex;align-items:center;gap:14px;padding:8px 16px;border-radius:14px;border:2px solid var(--panel-line);background:var(--panel);font-size:29px;font-weight:600;cursor:pointer;text-align:left;width:100%}

/* ghép dạng toán */

/* máy tính mô phỏng */
.calc{border-radius:24px;border:3px solid var(--panel-line);background:linear-gradient(180deg,#1b2440,#0d1328);padding:18px 20px 20px;display:grid;gap:12px;color:#e9eefc}

.ptab{flex:1 1 auto;min-height:0;overflow:auto;border-radius:16px;border:2px solid var(--panel-line)}
.ptab table{width:100%;border-collapse:collapse;font-size:22px}
.ptab th{position:sticky;top:0;background:var(--panel-2);text-align:left;padding:8px 14px;color:var(--muted);font-weight:700}
.ptab td{padding:4px 14px;border-top:1px solid var(--panel-line)}
.ptab tr.ok .stt{color:var(--ok);font-weight:700} .ptab tr.bad .stt{color:var(--bad);font-weight:700} .ptab tr.mid .stt{color:var(--gold);font-weight:700}
.ptab td .btn{min-height:40px;font-size:18px;padding:0 12px}
svg.scene{width:100%;height:auto;display:block}
.scene .sc-b{fill:var(--panel-2);stroke:var(--fig-ink);stroke-width:3}
.scene .sc-w{fill:var(--blue-soft);stroke:var(--fig-ink);stroke-width:2}
.scene .sc-k{fill:var(--fig-dim);stroke:var(--fig-ink);stroke-width:3}
.scene .sc-a{fill:rgba(255,200,61,.35);stroke:var(--gold);stroke-width:3}
.scene .sc-c{fill:rgba(76,142,255,.3);stroke:var(--blue);stroke-width:3}
.scene .sc-t{font:700 30px var(--font);fill:var(--text);text-anchor:middle}
.scene .sc-l{font:700 28px var(--font);fill:var(--gold);text-anchor:middle}
.scene .sc-s{font:600 24px var(--font);fill:var(--muted);text-anchor:middle}

.cover h1{font-size:74px}
.cover .avatar{width:150px;height:150px}
.cover h1 span{font-size:44px}
.pde{font-size:35px}
.pde .tag{font-size:24px}
.pde .opts .opt{font-size:32px;min-height:70px}
.pde .num{font-size:32px}
.pde .num input{height:66px;font-size:32px;width:220px}
.q{padding:2px 0 6px}
.pfig .pg{width:100%;height:100%}

.pfig svg.g2{position:static;width:100%;height:100%;max-height:100%}
.pfig{display:grid;place-items:center}
.opts .opt .katex{font-size:1.02em}

$('#brand').innerHTML = '<span class="logo">' + LOGO + '<span class="mb">MB</span></span><span><b>Mr Black</b><small>Toán THPT</small></span>';
function setPhoto(src){
  const logo = $('#brand .logo'); let img = logo.querySelector('img');
  if (!src){ if (img) img.remove(); $('#brand').classList.remove('has-photo'); return; }
  if (!img){ img = document.createElement('img'); img.alt = 'Ảnh giáo viên'; logo.appendChild(img); }
  img.src = src; $('#brand').classList.add('has-photo');
}
(function(){ let saved = ''; try { saved = localStorage.getItem('mrblack-photo') || ''; } catch (e) {} setPhoto(saved || TEACHER_PHOTO); })();
$('#brand').addEventListener('click', () => $('#photo-input').click());
$('#photo-input').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => { const S0 = 200, cv = document.createElement('canvas'); cv.width = S0; cv.height = S0;
    const s = Math.min(im.width, im.height); cv.getContext('2d').drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, S0, S0);
    const url = cv.toDataURL('image/jpeg', .85); setPhoto(url); try { localStorage.setItem('mrblack-photo', url); } catch (err) {} }; im.src = rd.result; };
  rd.readAsDataURL(f); e.target.value = '';
});
function texAll(root){
  if (!window.katex) return;
  root.querySelectorAll('.m:not([data-k]),.md:not([data-k])').forEach(e => {
    try { katex.render(e.textContent, e, {displayMode: e.classList.contains('md'), throwOnError: false, strict: false}); e.dataset.k = '1'; } catch (err) {}
  });

/* tam giác ABC từ toạ độ màn hình, nhãn đỉnh đẩy ra xa trọng tâm */
function TRI(P, names, o = {}){
  const G = [(P[0][0] + P[1][0] + P[2][0]) / 3, (P[0][1] + P[1][1] + P[2][1]) / 3];
  let s = PL(P, o.cls || '', null, true);
  names.forEach((nm, i) => { if (!nm) return; const d = [P[i][0] - G[0], P[i][1] - G[1]], Ld = Math.hypot(d[0], d[1]) || 1, r = o.lr || 32; s += TX([P[i][0] + d[0] / Ld * r, P[i][1] + d[1] / Ld * r + 11], nm); });
  return s;
}
/* nhãn cạnh: đặt ở trung điểm PQ, lệch ra phía ngoài (so với điểm trong I) */
function SIDE(Pp, Q, I, s, cls = 'tx', o = {}){
  const M = [(Pp[0] + Q[0]) / 2, (Pp[1] + Q[1]) / 2]; let nx = -(Q[1] - Pp[1]), ny = Q[0] - Pp[0]; const Ln = Math.hypot(nx, ny) || 1; nx /= Ln; ny /= Ln;
  if ((I[0] - M[0]) * nx + (I[1] - M[1]) * ny > 0){ nx = -nx; ny = -ny; }
  const r = o.r || 30; return TX([M[0] + nx * r, M[1] + ny * r + 10], s, cls, o);
}
/* giải tam giác bằng toạ độ: đặt B tại gốc, C trên trục x (toạ độ toán), trả về 3 điểm toán */
function triPts(a, b, c){ const x = (a * a + c * c - b * b) / (2 * a), y = Math.sqrt(Math.max(0, c * c - x * x)); return {A: [x, y], B: [0, 0], C: [a, 0]}; }
/* khung hình vừa bao các điểm: trả về F đã căn giữa */
function fitF(pts, W, H, pad = 60){
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const s = Math.min((W - 2 * pad) / ((x1 - x0) || 1), (H - 2 * pad) / ((y1 - y0) || 1));
  return F(W / 2 - s * (x0 + x1) / 2, H / 2 + s * (y0 + y1) / 2, s);
}

function station(sec, o){

    hit.addEventListener('click', e => { if (st.ok[pit.id]) return; const [x, y] = P.evt(e), X = Math.round(x), Y = Math.round(y);
      if (Math.hypot(x - X, y - Y) > 0.45 || X < P.xmin || X > P.xmax || Y < P.ymin || Y > P.ymax) return;
      const i = st.pts.findIndex(p => p[0] === X && p[1] === Y);

function clearFb(sec, id){ const q = sec.querySelector(`.q[data-q="${id}"] .fb`); if (q && !q.classList.contains('ok')){ q.innerHTML = ''; q.className = 'fb'; } }
function judge(o, it){
  const st = o.st, v = st.val[it.id];
  if (it.kind === 'points'){
    if (st.pts.length < it.n) return {empty: true};
    const bad = st.pts.find(p => !it.test(p[0], p[1]));
    return bad ? {ok: false, msg: it.diag(bad[0], bad[1])} : {ok: true};
  }
  if (v === undefined || v === '') return {empty: true};
  if (it.kind === 'num'){ const x = pnum(v); if (isNaN(x)) return {ok: false, msg: 'Con nhập một số (dấu phẩy cho số thập phân, ví dụ 2,5; được nhập phân số, ví dụ 3/11).'};
    if (Math.abs(x - it.ans) < (it.tol || 1e-9)) return {ok: true}; return {ok: false, msg: (it.diag && it.diag(x)) || it.why}; }

function check(sec, o){
  const st = o.st; if (st.done) return;
  const res = o.items.map(it => st.ok[it.id] ? {ok: true, kept: true} : judge(o, it));
  const empty = o.items.filter((it, i) => res[i].empty);
  const msg = sec.querySelector('.stmsg');
  if (empty.length){ msg.className = 'stmsg warn'; msg.textContent = `Con chưa trả lời: ${empty.map(it => it.name || it.id).join(', ')}.`; return; }
  st.checks++;
  let anyBad = false;
  o.items.forEach((it, i) => {
    const r = res[i]; if (r.kept) return;
    const q = sec.querySelector(`.q[data-q="${it.id}"]`), fb = q.querySelector('.fb');
    if (r.ok){
      st.ok[it.id] = true; fb.className = 'fb ok'; fb.innerHTML = '✓ Đúng' + (it.okmsg ? ' — ' + it.okmsg : '');

    st.done = true; msg.className = 'stmsg ok';
    msg.textContent = st.checks === 1 ? 'Hoàn thành ngay lần đầu. Bấm ▶ để sang nhiệm vụ tiếp theo.' : 'Hoàn thành. Bấm ▶ để sang nhiệm vụ tiếp theo.';
    sec.querySelector('[data-a=sol]').disabled = false; sec.querySelector('[data-a=chk]').disabled = true;
    if (!PR.res[o.id]){ PR.res[o.id] = {first: st.checks === 1}; prSave(); }

}

/* ================= LUYỆN TẬP TỔNG HỢP CHƯƠNG III · P01–P18 (đáp án kiểm chứng: verify_p2.py) =================
   Có các Bài tập cuối chương SGK 3.12–3.19 (tr.44–45). Không kết luận đạt/chưa đạt. */
const sfig = svg => ({html: () => svg, mount(){}});
const near = (v, x, e = 0.06) => Math.abs(v - x) < e;
function triFig(P, o = {}){
  const W = o.W || 640, H = o.H || 460, f = fitF([P.A, P.B, P.C].concat(o.extra || []), W, H, o.pad || 70), S = {A: f.P(...P.A), B: f.P(...P.B), C: f.P(...P.C)};
  const I = [(S.A[0] + S.B[0] + S.C[0]) / 3, (S.A[1] + S.B[1] + S.C[1]) / 3];
  let g = TRI([S.A, S.B, S.C], [o.nA ?? 'A', o.nB ?? 'B', o.nC ?? 'C']);
  const sd = o.sides || {}, an = o.ang || {}, nb = {A: ['B', 'C'], B: ['C', 'A'], C: ['A', 'B']};
  if (sd.a) g += SIDE(S.B, S.C, I, sd.a, 'tx'); if (sd.b) g += SIDE(S.C, S.A, I, sd.b, 'tx'); if (sd.c) g += SIDE(S.A, S.B, I, sd.c, 'tx');
  Object.keys(an).forEach(k => { const [u, v] = nb[k]; g += ANG(S[k], S[u], S[v], 42, an[k], 'arc'); });
  return SV(W, H, g + (o.post ? o.post(f, S) : ''), o.aria || 'Tam giác ABC');
}
function triSAS(b, c, A){ return {A: [0, 0], B: [c, 0], C: [b * Math.cos(deg(A)), b * Math.sin(deg(A))]}; }
function elevFig(a1, a2, dist){
  const h = dist * Math.sin(deg(a1)) * Math.sin(deg(a2)) / Math.sin(deg(a2 - a1)), BH = h / Math.tan(deg(a2)), AH = BH + dist;
  const f = fitF([[0, 0], [AH, h], [AH * 1.08, 0]], 640, 440, 70), A = f.P(0, 0), B = f.P(dist, 0), H = f.P(AH, 0), T = f.P(AH, h);
  return SV(640, 440, L(f.P(-0.05 * AH, 0), f.P(AH * 1.12, 0), 'ln') + L(H, T, 'w5') + L(A, T, 'dash') + L(B, T, 'dash') + RA(H, T, B, 16) + DOT(A) + DOT(B) + DOT(T, 'ink') +
    TX(A, 'A', 'lab', {dy: 36}) + TX(B, 'B', 'lab', {dy: 36}) + TX(H, 'H', 'lab', {dy: 36}) + TX(T, 'T', 'lab', {dx: 18, dy: -10, a: 'start'}) +
    ANG(A, B, T, 50, a1 + '°', 'arc') + ANG(B, H, T, 42, a2 + '°', 'arc') + `<line class="ax" x1="${A[0]}" y1="${A[1] + 50}" x2="${B[0]}" y2="${B[1] + 50}"/>` + TX([(A[0] + B[0]) / 2, A[1] + 76], dist + ' m', 'tx'),
    `Góc nâng ${a1}° tại A, ${a2}° tại B, AB = ${dist} m`);
}

addSlide({label: 'Kết quả theo kiến thức', sec: SECS.length - 1, anchor: 'sum', html: hd(SECS.length - 1, 'Tiến bộ theo từng kiến thức') + `<div class="pres" id="pres"></div>`,
  note: 'Bảng tự cập nhật theo các nhiệm vụ học sinh đã hoàn thành. “Đúng ngay” = đúng tất cả các ý ở lần Kiểm tra đầu tiên. Nhiệm vụ thử thách không tính.'});
const CORE = TASKS.filter(t => !t.optional);
const KS = Object.keys(THEORY).filter(k => CORE.some(t => t.k.includes(k)));
function kState(k){
  const ts = CORE.filter(t => t.k.includes(k)), done = ts.filter(t => PR.res[t.id]), first = done.filter(t => PR.res[t.id].first).length;
  let st = 'Chưa luyện', cls = '';
  if (done.length && done.length < ts.length){ st = 'Đang luyện'; cls = 'mid'; }
  if (done.length === ts.length){ if (first * 3 >= 2 * ts.length){ st = '✓ Vững'; cls = 'ok'; } else { st = 'Cần ôn lại'; cls = 'bad'; } }
  return {ts, done: done.length, first, st, cls};
}
function renderResults(){
  const box = $('#pres'); if (!box) return;
  const rows = KS.map(k => { const s = kState(k); return `<tr class="${s.cls}"><td><b>${k}</b> ${THEORY[k].t}</td><td>${s.done}/${s.ts.length}</td><td>${s.first}</td><td class="stt">${s.st}</td><td><button class="btn sm" type="button" data-rev="${k}">📖 Xem lại</button> <button class="btn sm" type="button" data-to="${s.ts.find(t => !PR.res[t.id])?.id || s.ts[0].id}">↻ Luyện</button></td></tr>`; }).join('');
  const nOk = KS.filter(k => kState(k).cls === 'ok').length;
  box.innerHTML = `<p class="lead">Vững <b class="gold-t">${nOk}/${KS.length}</b> kiến thức. Một kiến thức <b>Vững</b> khi con đã làm hết các nhiệm vụ của nó và đúng ngay lần đầu ở ít nhất 2/3 số nhiệm vụ. Đây là kết quả luyện tập, chưa phải kết luận đạt/chưa đạt (xem bài ${CFG.testname}).</p>
    <div class="ptab"><table><thead><tr><th>Kiến thức</th><th>Đã làm</th><th>Đúng ngay</th><th>Trạng thái</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="row" style="justify-content:flex-end"><button class="btn sm" type="button" data-a="reset">Xoá kết quả, luyện lại từ đầu</button></div>`;
  box.querySelectorAll('[data-rev]').forEach(b => b.addEventListener('click', () => showTheory([b.dataset.rev])));
  box.querySelectorAll('[data-to]').forEach(b => b.addEventListener('click', () => { const k = slides.findIndex(s => s.task && s.task.id === b.dataset.to); if (k >= 0) go(k); }));
  box.querySelector('[data-a=reset]').addEventListener('click', e => { const b = e.currentTarget; if (b.dataset.sure){ PR.res = {}; prSave(); renderResults(); coverUI(); } else { b.dataset.sure = 1; b.textContent = 'Bấm lần nữa để xác nhận xoá'; } });
}

function go(n, step = 0){
  n = Math.max(0, Math.min(slides.length - 1, n));

}

<script>
/* Xoay máy: co giãn lại sân khấu nhiều nhịp sau khi xoay (iPhone/Android báo kích thước mới trễ, nhất là trang nặng) */
(function(){
  var last = '';
  function refit(){ try { window.dispatchEvent(new Event('resize')); } catch (e) {} }
  function burst(){ [0, 120, 300, 600, 1000, 1600].forEach(function(t){ setTimeout(refit, t); }); }
  function check(){ var vv = window.visualViewport, k = (vv ? vv.width + 'x' + vv.height : innerWidth + 'x' + innerHeight); if (k !== last){ last = k; burst(); } }
  window.addEventListener('orientationchange', burst);
  try { if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', burst); } catch (e) {}
  try { var mq = matchMedia('(orientation: portrait)'); if (mq.addEventListener) mq.addEventListener('change', burst); else if (mq.addListener) mq.addListener(burst); } catch (e) {}
  try { if (window.ResizeObserver) new ResizeObserver(check).observe(document.documentElement); } catch (e) {}
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) burst(); });
  window.addEventListener('pageshow', burst);
})();
</script>
